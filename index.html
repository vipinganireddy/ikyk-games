t-weight:800;color:var(--gold)}\n\n .panel{border:1px solid var(--line);border-radius:11px;padding:9px 10px;height:132px;overflow:hidden;background:rgba(255,255,255,.03)}\n .panel .none{margin:0;font-size:11px;color:var(--muted);font-weight:600}\n .panel h3{margin:0 0 3px;font-size:13px;font-weight:800}\n .panel .stats{font-size:10.5px;color:var(--muted);font-weight:650;line-height:1.6;margin:0 0 8px}\n .panel .stats b{color:var(--ink);font-family:var(--mono)}\n .maps{display:flex;gap:6px;margin-top:8px}\n .maps button{flex:1;padding:7px 4px;font-size:11.5px}\n\n .preview{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;height:70px;overflow:hidden}\n .chip{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:999px;\n   padding:2px 7px 2px 4px;font-size:9.5px;font-weight:800;font-family:var(--mono);color:var(--muted);\n   height:20px;white-space:nowrap}\n .chip i{width:8px;height:8px;border-radius:50%;display:block;flex:none}\n .chip.warn{border-color:rgba(255,194,61,.5);color:#ffc23d}\n\n .panel .mode{display:flex;align-items:center;gap:6px;margin:0 0 7px;font-size:10.5px;\n   color:var(--muted);font-weight:700}\n .panel .mode button{flex:none;padding:4px 10px;font-size:10.5px}\n .panel .btns{display:flex;gap:6px}\n .panel .btns button{flex:1;padding:7px 4px;font-size:11.5px}\n\n button{font:inherit;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.06);\n   border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:12.5px;font-weight:750}\n button:hover:not(:disabled){background:rgba(255,255,255,.13)}\n button:disabled{opacity:.4;cursor:default}\n button[aria-pressed=\"true\"]{background:#f2f2f2;color:#0a0a1a;border-color:#fff}\n button.primary{background:linear-gradient(135deg,#8dff5a,#31e1ff);color:#04202b;border-color:transparent;\n   padding:11px 14px;font-size:13.5px}\n button:focus-visible{outline:2px solid #fff;outline-offset:2px}\n .row2{display:flex;gap:6px}\n .row2 button{flex:1}\n .note{margin:0;font-size:10.5px;color:var(--muted);font-weight:600;line-height:1.5;height:32px;overflow:hidden}\n\n @media (max-width:820px){\n   .app{flex-direction:column;align-items:center}\n   .left{width:min(94vw,660px)}\n   .side{width:min(94vw,660px)}\n   .shop{flex-direction:row}\n   .tw{flex:1;flex-direction:column;align-items:flex-start;gap:3px}\n   .tw .p{margin-left:0}\n }\n", body: "<main class=\"app\">\n <div class=\"left\">\n  <div class=\"topline\">\n   <h1>Line Defence</h1>\n   <div class=\"hud\">\n    <span class=\"gold\">&#9679; <b id=\"gold\">0</b></span>\n    <span class=\"life\">&#9829; <b id=\"lives\">0</b></span>\n    <span class=\"wave\">Wave <b id=\"wave\">0</b></span>\n   </div>\n  </div>\n  <canvas id=\"c\" width=\"1320\" height=\"840\"></canvas>\n  <div class=\"maps\" id=\"maps\"></div>\n </div>\n\n <div class=\"side\">\n  <div class=\"lab\">Build</div>\n  <div class=\"shop\" id=\"shop\"></div>\n\n  <div class=\"lab\">Coming next</div>\n  <div class=\"preview\" id=\"preview\"></div>\n\n  <div class=\"lab\">Selected</div>\n  <div class=\"panel\" id=\"panel\"><p class=\"none\">Click a tower on the map.</p></div>\n\n  <button type=\"button\" id=\"go\" class=\"primary\">Start wave 1</button>\n  <div class=\"row2\">\n   <button type=\"button\" id=\"speed\">Speed &times;1</button>\n   <button type=\"button\" id=\"restart\">Restart</button>\n  </div>\n  <p class=\"note\" id=\"note\">Leaks cost a life. Twenty lives, then it is over.</p>\n </div>\n</main>\n", js: "\n 'use strict';\n const $=id=>document.getElementById(id);\n const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n   return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n   catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n\n const cv=$('c'), ctx=cv.getContext('2d');\n const COLS=22, ROWS=14, CS=cv.width/COLS;\n const W=cv.width, H=cv.height;\n\n /* ---------------- maps ----------------\n    Three routes rather than one, because a single fixed map means the second run\n    is the first run again. They ask for different things: Switchback doubles back\n    so a handful of spots cover three lanes, Spiral winds inward so the centre is\n    gold, Comb is long and open with nowhere especially good. */\n const MAPS=[\n   {name:'Switchback', way:[[-1,2],[6,2],[6,6],[2,6],[2,10],[12,10],[12,4],[16,4],[16,11],[22,11]]},\n   {name:'Spiral',     way:[[-1,12],[19,12],[19,2],[3,2],[3,8],[15,8],[15,5],[7,5],[7,13],[22,13]]},\n   {name:'Comb',       way:[[-1,1],[4,1],[4,12],[8,12],[8,1],[13,1],[13,12],[17,12],[17,1],[22,1]]}\n ];\n let mapIx=0, WAY, PATH, LEG, TOTAL, blocked;\n function loadMap(i){\n   mapIx=i; WAY=MAPS[i].way;\n   PATH=WAY.map(([x,y])=>({x:(x+0.5)*CS,y:(y+0.5)*CS}));\n   LEG=[]; TOTAL=0;\n   for(let k=1;k<PATH.length;k++){\n     const d=Math.hypot(PATH[k].x-PATH[k-1].x,PATH[k].y-PATH[k-1].y);\n     LEG.push(d); TOTAL+=d;\n   }\n   blocked=new Set();\n   for(let k=1;k<WAY.length;k++){\n     const [x0,y0]=WAY[k-1],[x1,y1]=WAY[k];\n     const steps=Math.abs(x1-x0)+Math.abs(y1-y0);\n     for(let s=0;s<=steps;s++)\n       blocked.add(Math.round(x0+(x1-x0)*s/steps)+','+Math.round(y0+(y1-y0)*s/steps));\n   }\n }\n function posAt(dist){\n   let d=dist;\n   for(let i=0;i<LEG.length;i++){\n     if(d<=LEG[i]){ const t=d/LEG[i],a=PATH[i],b=PATH[i+1];\n       return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }\n     d-=LEG[i];\n   }\n   return PATH[PATH.length-1];\n }\n\n /* ---------------- towers ---------------- */\n const KINDS={\n   gun:   {name:'Gun',    desc:'fast, one target',   cost:50, col:'#31e1ff',\n           rng:2.7, rate:3.2, dmg:9,  splash:0,    slow:0},\n   cannon:{name:'Cannon', desc:'splash, beats armour', cost:95, col:'#ff7a4d',\n           rng:2.3, rate:0.7, dmg:30, splash:0.95, slow:0},\n   frost: {name:'Frost',  desc:'chills, no real damage', cost:75, col:'#9b8dff',\n           rng:2.5, rate:1.3, dmg:5,  splash:0,    slow:0.5}\n };\n const upCost=t=>Math.round(KINDS[t.kind].cost*0.8*Math.pow(1.65,t.lvl));\n const stat=t=>{\n   const k=KINDS[t.kind], m=Math.pow(1.42,t.lvl-1);\n   return {rng:k.rng+(t.lvl-1)*0.32, rate:k.rate*(1+(t.lvl-1)*0.16), dmg:k.dmg*m,\n           splash:k.splash?k.splash+(t.lvl-1)*0.12:0,\n           slow:k.slow?Math.min(0.72,k.slow+(t.lvl-1)*0.06):0};\n };\n const MODES=['first','last','strong','close'];\n const MODE_LABEL={first:'Furthest along',last:'Nearest the start',strong:'Most health',close:'Closest'};\n\n /* ---------------- enemies ----------------\n    The point of the extra types is that no single tower answers all of them.\n    Armour shrugs off single shots but not blasts, swarms overwhelm slow guns,\n    and a healer undoes chip damage unless something kills it outright. */\n const FOES={\n   grunt:  {col:'#ff5c7a', r:0.30, sp:0.95, hp:1,    gold:4,  armour:0,    shape:'circle'},\n   runner: {col:'#ffe14d', r:0.24, sp:1.85, hp:0.62, gold:5,  armour:0,    shape:'tri'},\n   swarm:  {col:'#7dffb0', r:0.17, sp:1.45, hp:0.26, gold:2,  armour:0,    shape:'diamond'},\n   armour: {col:'#a8bcdd', r:0.33, sp:0.78, hp:1.5,  gold:10, armour:0.055, shape:'hex'},\n   tank:   {col:'#8b7bff', r:0.40, sp:0.55, hp:3.1,  gold:13, armour:0.012, shape:'square'},\n   healer: {col:'#5ce1a0', r:0.30, sp:0.72, hp:1.4,  gold:14, armour:0,    shape:'cross', heal:0.09},\n   boss:   {col:'#ff3d81', r:0.56, sp:0.62, hp:13,   gold:37, armour:0.006, shape:'boss'}\n };\n function waveList(n){\n   const out=[], hp=Math.round(40*Math.pow(1.24,n-1));\n   const add=(t,count,mul)=>out.push({t, hp:Math.max(1,Math.round(hp*FOES[t].hp*(mul||1))), n:count});\n   if(n%5===0){\n     add('boss',1);\n     add('grunt',4+n);\n     if(n>=10) add('armour',2+Math.floor(n/6));\n   } else {\n     add('grunt', 6+Math.floor(n*1.3));\n     if(n>=3) add('runner', 3+Math.floor(n*0.7));\n     if(n>=4) add('swarm', 8+Math.floor(n*1.8));\n     if(n>=6) add('tank', 1+Math.floor(n/4));\n     if(n>=6) add('armour', 2+Math.floor(n/3));\n     if(n>=9 && n%2===1) add('healer', 1+Math.floor(n/9));\n   }\n   return out;\n }\n\n /* ---------------- state ---------------- */\n let towers, foes, shots, sparks, gold, lives, wave, running, queue, spawnT,\n     sel, build, speed, over, raf, last, best, defMode;\n best=store.get('defence.best')||0;\n defMode=store.get('defence.mode')||'first';\n\n function reset(){\n   towers=[]; foes=[]; shots=[]; sparks=[]; queue=[];\n   gold=140; lives=20; wave=0; running=false; over=false;\n   sel=null; build=null; speed=1; spawnT=0;\n   sync(true); drawShop(); drawMaps(); preview(); showPanel();\n   cancelAnimationFrame(raf); last=0; raf=requestAnimationFrame(loop);\n }\n\n let syncKey='';\n function sync(force){\n   const k=[gold,lives,wave,running,over,speed,best,queue.length].join('|');\n   if(!force && k===syncKey) return;\n   syncKey=k;\n   $('gold').textContent=gold; $('lives').textContent=lives; $('wave').textContent=wave;\n   const bonus=earlyBonus();\n   $('go').textContent = over ? 'Game over'\n     : running ? ('Call wave '+(wave+1)+' now  +'+bonus)\n     : ('Start wave '+(wave+1));\n   $('go').disabled = over;\n   $('speed').textContent='Speed \\u00d7'+speed;\n   $('note').textContent = over\n     ? 'Reached wave '+wave+'. Best '+best+'.'\n     : running ? 'Calling the next wave early pays a bonus \\u2014 if you can hold it.'\n     : 'Best so far: wave '+best+'.';\n   for(const el of document.querySelectorAll('.tw')) el.classList.toggle('poor', KINDS[el.dataset.k].cost>gold);\n }\n const earlyBonus=()=>14+wave*3;\n\n function drawMaps(){\n   const m=$('maps'); m.innerHTML='';\n   MAPS.forEach((mp,i)=>{\n     const b=document.createElement('button');\n     b.type='button'; b.textContent=mp.name;\n     b.setAttribute('aria-pressed',String(i===mapIx));\n     b.addEventListener('click',()=>{ if(i===mapIx) return; loadMap(i); reset(); });\n     m.appendChild(b);\n   });\n }\n function drawShop(){\n   const s=$('shop'); s.innerHTML='';\n   for(const k of Object.keys(KINDS)){\n     const d=KINDS[k];\n     const el=document.createElement('div');\n     el.className='tw'; el.dataset.k=k;\n     el.innerHTML='<span class=\"dot\" style=\"background:'+d.col+'\"></span>'\n       +'<span><span class=\"n\">'+d.name+'</span><br><span class=\"d\">'+d.desc+'</span></span>'\n       +'<span class=\"p\">'+d.cost+'</span>';\n     el.addEventListener('click',()=>{\n       build = build===k ? null : k; sel=null;\n       for(const e of document.querySelectorAll('.tw')) e.classList.toggle('sel', e.dataset.k===build);\n       showPanel();\n     });\n     s.appendChild(el);\n   }\n }\n // Knowing what is coming is the difference between planning and reacting.\n function preview(){\n   const p=$('preview'); p.innerHTML='';\n   if(over){ p.innerHTML='<span class=\"chip\">\\u2014</span>'; return; }\n   for(const g of waveList(wave+1)){\n     const c=document.createElement('span');\n     const risky = g.t==='armour'||g.t==='healer'||g.t==='boss';\n     c.className='chip'+(risky?' warn':'');\n     c.innerHTML='<i style=\"background:'+FOES[g.t].col+'\"></i>'+g.t+' \\u00d7'+g.n;\n     p.appendChild(c);\n   }\n }\n function showPanel(){\n   const p=$('panel');\n   if(!sel){ p.innerHTML='<p class=\"none\">'+(build?'Click an empty square to place your '+KINDS[build].name.toLowerCase()+'.':'Click a tower on the map.')+'</p>'; return; }\n   const st=stat(sel), k=KINDS[sel.kind], up=upCost(sel), refund=Math.round(sel.spent*0.6);\n   p.innerHTML='<h3>'+k.name+' \\u00b7 level '+sel.lvl+'</h3>'\n     +'<p class=\"stats\">Damage <b>'+st.dmg.toFixed(0)+'</b> \\u00b7 rate <b>'+st.rate.toFixed(1)+'/s</b><br>'\n     +'Range <b>'+st.rng.toFixed(1)+'</b>'+(st.splash?' \\u00b7 splash <b>'+st.splash.toFixed(1)+'</b>':'')\n     +(st.slow?' \\u00b7 slow <b>'+Math.round(st.slow*100)+'%</b>':'')+'</p>'\n     +'<p class=\"mode\">Shoots <button type=\"button\" id=\"mode\">'+MODE_LABEL[sel.mode]+'</button></p>'\n     +'<div class=\"btns\"><button type=\"button\" id=\"up\">Upgrade '+up+'</button>'\n     +'<button type=\"button\" id=\"sell\">Sell '+refund+'</button></div>';\n   $('mode').addEventListener('click',()=>{\n     sel.mode=MODES[(MODES.indexOf(sel.mode)+1)%MODES.length];\n     defMode=sel.mode; store.set('defence.mode',defMode);\n     showPanel();\n   });\n   $('up').disabled = gold<up || sel.lvl>=6;\n   if(sel.lvl>=6) $('up').textContent='Max level';\n   $('up').addEventListener('click',()=>{\n     const c=upCost(sel);\n     if(gold<c||sel.lvl>=6) return;\n     gold-=c; sel.spent+=c; sel.lvl++; sync(true); showPanel();\n   });\n   $('sell').addEventListener('click',()=>{\n     gold+=Math.round(sel.spent*0.6);\n     towers=towers.filter(t=>t!==sel);\n     sel=null; sync(true); showPanel();\n   });\n }\n\n /* ---------------- waves ---------------- */\n function startWave(){\n   if(over) return;\n   if(running) gold+=earlyBonus();          // calling early is paid for up front\n   wave++;\n   const add=[];\n   for(const g of waveList(wave))\n     for(let i=0;i<g.n;i++) add.push({t:g.t,hp:g.hp});\n   for(let i=add.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; const x=add[i];add[i]=add[j];add[j]=x; }\n   queue=queue.concat(add);\n   running=true; if(spawnT<=0) spawnT=0;\n   sync(true); preview();\n }\n function endWave(){\n   running=false;\n   gold+=20+wave*4;\n   if(wave>best){ best=wave; store.set('defence.best',best); }\n   sync(true); preview();\n }\n\n /* ---------------- simulation ---------------- */\n function hurt(f,dmg,splash){\n   const soak = splash ? f.plate*0.3 : f.plate;      // a blast goes round plating\n   f.hp -= Math.max(dmg*0.12, dmg-soak);             // never quite nothing\n   f.flash=0.14;\n }\n function step(dt){\n   if(running){\n     spawnT-=dt;\n     if(spawnT<=0 && queue.length){\n       const q=queue.shift(), d=FOES[q.t];\n       foes.push({t:q.t,hp:q.hp,max:q.hp,sp:d.sp,gold:d.gold,plate:q.hp*d.armour,\n                  d:0,chill:0,chillAmt:0,flash:0,pulse:0});\n       spawnT = q.t==='swarm'?0.17 : q.t==='runner'?0.34 : 0.6;\n     }\n     if(!queue.length && !foes.length) endWave();\n   }\n   for(const f of foes){\n     f.chill=Math.max(0,f.chill-dt);\n     f.flash=Math.max(0,f.flash-dt);\n     f.d += f.sp*CS*1.55*(f.chill>0?(1-f.chillAmt):1)*dt;\n     if(f.d>=TOTAL){ f.dead=true; f.leaked=true; }\n     if(FOES[f.t].heal){                     // healers keep the line standing up\n       f.pulse-=dt;\n       if(f.pulse<=0){\n         f.pulse=0.9;\n         const p=posAt(f.d);\n         for(const o of foes){\n           if(o===f||o.dead||o.hp>=o.max) continue;\n           const q=posAt(o.d);\n           if(Math.hypot(q.x-p.x,q.y-p.y)<CS*2.3){\n             o.hp=Math.min(o.max, o.hp+o.max*FOES[f.t].heal);\n             sparks.push({x:q.x,y:q.y,r:0,life:.6,col:'#5ce1a0',small:true});\n           }\n         }\n       }\n     }\n   }\n   for(const f of foes){\n     if(!f.leaked) continue;\n     lives--;\n     sparks.push({x:PATH[PATH.length-1].x,y:PATH[PATH.length-1].y,r:0,life:1,col:'#ff4d6d'});\n     if(lives<=0){ lives=0; over=true; running=false;\n       if(wave-1>best){ best=wave-1; store.set('defence.best',best); } }\n   }\n   foes=foes.filter(f=>!f.dead);\n\n   for(const t of towers){\n     t.cool-=dt;\n     if(t.cool>0) continue;\n     const st=stat(t), rng=st.rng*CS;\n     let target=null, bv=-Infinity;\n     for(const f of foes){\n       const p=posAt(f.d), d=Math.hypot(p.x-t.x,p.y-t.y);\n       if(d>rng) continue;\n       const v = t.mode==='first' ? f.d : t.mode==='last' ? -f.d\n               : t.mode==='strong' ? f.hp : -d;\n       if(v>bv){ bv=v; target=f; }\n     }\n     if(!target) continue;\n     t.cool=1/st.rate;\n     const p=posAt(target.d);\n     t.ang=Math.atan2(p.y-t.y,p.x-t.x);\n     shots.push({x:t.x,y:t.y,tx:p.x,ty:p.y,t:0,sp:6.5,dmg:st.dmg,splash:st.splash*CS,\n                 slow:st.slow,col:KINDS[t.kind].col,target});\n   }\n\n   for(const s of shots){\n     s.t+=dt*s.sp;\n     if(s.t<1){\n       if(s.target && !s.target.dead){ const p=posAt(s.target.d); s.tx=p.x; s.ty=p.y; }\n       continue;\n     }\n     s.done=true;\n     const hit=[];\n     if(s.splash){ for(const f of foes){ const p=posAt(f.d);\n       if(Math.hypot(p.x-s.tx,p.y-s.ty)<=s.splash) hit.push(f); } }\n     else if(s.target && !s.target.dead) hit.push(s.target);\n     for(const f of hit){\n       hurt(f,s.dmg,!!s.splash);\n       if(s.slow){ f.chill=1.6; f.chillAmt=s.slow; }\n       if(f.hp<=0 && !f.dead){ f.dead=true; gold+=f.gold;\n         sparks.push({x:posAt(f.d).x,y:posAt(f.d).y,r:0,life:1,col:FOES[f.t].col}); }\n     }\n     sparks.push({x:s.tx,y:s.ty,r:0,life:1,col:s.col,small:!s.splash});\n   }\n   shots=shots.filter(s=>!s.done);\n   foes=foes.filter(f=>!f.dead);\n   for(const p of sparks){ p.life-=dt*2.6; p.r+=dt*(p.small?90:230); }\n   sparks=sparks.filter(p=>p.life>0);\n   sync();\n }\n\n /* ---------------- drawing ---------------- */\n function shape(c,f,p){\n   const d=FOES[f.t], r=d.r*CS;\n   c.fillStyle = f.flash>0 ? '#ffffff' : d.col;\n   c.beginPath();\n   if(d.shape==='circle'||d.shape==='boss'){ c.arc(p.x,p.y,r,0,7); }\n   else if(d.shape==='tri'){\n     const a=headingAt(f.d);\n     c.moveTo(p.x+Math.cos(a)*r*1.3, p.y+Math.sin(a)*r*1.3);\n     c.lineTo(p.x+Math.cos(a+2.4)*r, p.y+Math.sin(a+2.4)*r);\n     c.lineTo(p.x+Math.cos(a-2.4)*r, p.y+Math.sin(a-2.4)*r);\n     c.closePath();\n   }\n   else if(d.shape==='diamond'){\n     c.moveTo(p.x,p.y-r); c.lineTo(p.x+r,p.y); c.lineTo(p.x,p.y+r); c.lineTo(p.x-r,p.y); c.closePath();\n   }\n   else if(d.shape==='square'){ c.rect(p.x-r*0.85,p.y-r*0.85,r*1.7,r*1.7); }\n   else if(d.shape==='hex'){\n     for(let i=0;i<6;i++){ const a=i*Math.PI/3;\n       i?c.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r):c.moveTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r); }\n     c.closePath();\n   }\n   else if(d.shape==='cross'){ c.arc(p.x,p.y,r,0,7); }\n   c.fill();\n   if(d.armour>=0.05){                     // plating, so you can spot it at a glance\n     c.strokeStyle='rgba(255,255,255,.55)'; c.lineWidth=2.5; c.stroke();\n   }\n   if(d.shape==='cross'){\n     c.strokeStyle='#08301f'; c.lineWidth=r*0.34; c.lineCap='butt';\n     c.beginPath(); c.moveTo(p.x-r*0.5,p.y); c.lineTo(p.x+r*0.5,p.y);\n     c.moveTo(p.x,p.y-r*0.5); c.lineTo(p.x,p.y+r*0.5); c.stroke(); c.lineCap='round';\n   }\n   if(d.shape==='boss'){\n     c.strokeStyle='rgba(255,255,255,.7)'; c.lineWidth=3;\n     c.beginPath(); c.arc(p.x,p.y,r*0.62,0,7); c.stroke();\n   }\n }\n function headingAt(dist){\n   const a=posAt(Math.max(0,dist-6)), b=posAt(dist+6);\n   return Math.atan2(b.y-a.y,b.x-a.x);\n }\n function draw(){\n   const c=ctx;\n   c.fillStyle='#0c1020'; c.fillRect(0,0,W,H);\n   c.strokeStyle='rgba(255,255,255,.035)'; c.lineWidth=1;\n   c.beginPath();\n   for(let x=0;x<=COLS;x++){ c.moveTo(x*CS,0); c.lineTo(x*CS,H); }\n   for(let y=0;y<=ROWS;y++){ c.moveTo(0,y*CS); c.lineTo(W,y*CS); }\n   c.stroke();\n\n   c.lineCap='round'; c.lineJoin='round';\n   c.strokeStyle='rgba(255,255,255,.07)'; c.lineWidth=CS*0.92;\n   c.beginPath(); c.moveTo(PATH[0].x,PATH[0].y);\n   for(let i=1;i<PATH.length;i++) c.lineTo(PATH[i].x,PATH[i].y);\n   c.stroke();\n   // arrows, so which way the route runs is never in doubt\n   c.fillStyle='rgba(49,225,255,.22)';\n   for(let d=CS*0.8; d<TOTAL; d+=CS*1.7){\n     const p=posAt(d), a=headingAt(d), s=CS*0.17;\n     c.beginPath();\n     c.moveTo(p.x+Math.cos(a)*s*1.7, p.y+Math.sin(a)*s*1.7);\n     c.lineTo(p.x+Math.cos(a+2.5)*s, p.y+Math.sin(a+2.5)*s);\n     c.lineTo(p.x+Math.cos(a-2.5)*s, p.y+Math.sin(a-2.5)*s);\n     c.closePath(); c.fill();\n   }\n\n   const end=PATH[PATH.length-1];\n   c.fillStyle='rgba(255,77,110,.22)';\n   c.fillRect(W-CS*0.42, end.y-CS*0.95, CS*0.42, CS*1.9);\n   c.fillStyle='rgba(255,77,110,.8)';\n   c.font='800 '+(CS*0.3)+'px Outfit,system-ui,sans-serif';\n   c.textAlign='right'; c.textBaseline='middle';\n   c.fillText('GOAL', W-CS*0.62, end.y);\n   c.fillStyle='rgba(141,255,90,.75)'; c.textAlign='left';\n   c.fillText('IN', CS*0.2, PATH[0].y);\n\n   if(build && hover){\n     const ok=canBuild(hover.gx,hover.gy);\n     c.fillStyle = ok?'rgba(141,255,90,.2)':'rgba(255,77,110,.22)';\n     c.fillRect(hover.gx*CS,hover.gy*CS,CS,CS);\n     if(ok){ c.strokeStyle='rgba(255,255,255,.28)'; c.lineWidth=2;\n       c.beginPath(); c.arc((hover.gx+.5)*CS,(hover.gy+.5)*CS,KINDS[build].rng*CS,0,7); c.stroke(); }\n   }\n   if(sel){ c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=2;\n     c.beginPath(); c.arc(sel.x,sel.y,stat(sel).rng*CS,0,7); c.stroke(); }\n\n   for(const t of towers){\n     const k=KINDS[t.kind];\n     c.fillStyle='rgba(255,255,255,.08)';\n     c.beginPath(); c.arc(t.x,t.y,CS*0.42,0,7); c.fill();\n     c.fillStyle=k.col;\n     c.beginPath(); c.arc(t.x,t.y,CS*0.3,0,7); c.fill();\n     c.save(); c.translate(t.x,t.y); c.rotate(t.ang||0);\n     c.fillStyle='rgba(255,255,255,.85)'; c.fillRect(0,-CS*0.09,CS*0.42,CS*0.18);\n     c.restore();\n     if(t.lvl>1){ c.fillStyle='#0c1020'; c.font='800 '+(CS*0.3)+'px Outfit,system-ui,sans-serif';\n       c.textAlign='center'; c.textBaseline='middle'; c.fillText(t.lvl,t.x,t.y+1); }\n     if(t===sel){ c.strokeStyle='#fff'; c.lineWidth=2.5;\n       c.beginPath(); c.arc(t.x,t.y,CS*0.44,0,7); c.stroke(); }\n   }\n\n   for(const f of foes){\n     const p=posAt(f.d), r=FOES[f.t].r*CS;\n     if(FOES[f.t].heal){\n       c.strokeStyle='rgba(92,225,160,.2)'; c.lineWidth=2;\n       c.beginPath(); c.arc(p.x,p.y,CS*2.3,0,7); c.stroke();\n     }\n     shape(c,f,p);\n     if(f.chill>0){ c.strokeStyle='rgba(155,141,255,.9)'; c.lineWidth=3;\n       c.beginPath(); c.arc(p.x,p.y,r+4,0,7); c.stroke(); }\n     const w=r*2.3, pct=Math.max(0,f.hp/f.max);\n     c.fillStyle='rgba(0,0,0,.55)'; c.fillRect(p.x-w/2,p.y-r-10,w,5);\n     c.fillStyle=pct>0.5?'#8dff5a':pct>0.22?'#ffc23d':'#ff4d6d';\n     c.fillRect(p.x-w/2,p.y-r-10,w*pct,5);\n   }\n\n   for(const s of shots){\n     const x=s.x+(s.tx-s.x)*s.t, y=s.y+(s.ty-s.y)*s.t;\n     c.fillStyle=s.col; c.beginPath(); c.arc(x,y,s.splash?6:4,0,7); c.fill();\n   }\n   for(const p of sparks){\n     c.globalAlpha=Math.max(0,p.life); c.strokeStyle=p.col; c.lineWidth=3;\n     c.beginPath(); c.arc(p.x,p.y,p.r,0,7); c.stroke();\n   }\n   c.globalAlpha=1;\n\n   if(over){\n     c.fillStyle='rgba(8,10,26,.84)'; c.fillRect(0,0,W,H);\n     c.textAlign='center'; c.textBaseline='alphabetic'; c.fillStyle='#fff';\n     c.font='800 62px Outfit,system-ui,sans-serif';\n     c.fillText('Overrun on wave '+wave,W/2,H/2-10);\n     c.font='600 30px Outfit,system-ui,sans-serif'; c.fillStyle='rgba(255,255,255,.72)';\n     c.fillText('Best run: wave '+best+'  \\u00b7  press Restart',W/2,H/2+38);\n   }\n }\n\n /* ---------------- input ---------------- */\n let hover=null;\n const cellAt=e=>{\n   const r=cv.getBoundingClientRect();\n   const x=(e.clientX-r.left)*(W/r.width), y=(e.clientY-r.top)*(H/r.height);\n   return {gx:Math.floor(x/CS), gy:Math.floor(y/CS), x, y};\n };\n function canBuild(gx,gy){\n   if(gx<0||gy<0||gx>=COLS||gy>=ROWS) return false;\n   if(blocked.has(gx+','+gy)) return false;\n   return !towers.some(t=>t.gx===gx&&t.gy===gy);\n }\n cv.addEventListener('pointermove',e=>{ hover=cellAt(e); });\n cv.addEventListener('pointerleave',()=>{ hover=null; });\n cv.addEventListener('pointerdown',e=>{\n   e.preventDefault();\n   if(over) return;\n   const p=cellAt(e);\n   const on=towers.find(t=>t.gx===p.gx&&t.gy===p.gy);\n   if(on){ sel=on; build=null;\n     for(const el of document.querySelectorAll('.tw')) el.classList.remove('sel');\n     showPanel(); return; }\n   if(!build){ sel=null; showPanel(); return; }\n   if(!canBuild(p.gx,p.gy)) return;\n   const cost=KINDS[build].cost;\n   if(gold<cost) return;\n   gold-=cost;\n   const t={kind:build,gx:p.gx,gy:p.gy,x:(p.gx+.5)*CS,y:(p.gy+.5)*CS,\n            lvl:1,cool:0,ang:0,spent:cost,mode:defMode};\n   towers.push(t);\n   sel=t; sync(true); showPanel();\n });\n\n $('go').addEventListener('click',startWave);\n $('speed').addEventListener('click',()=>{ speed = speed===1?2:speed===2?3:1; sync(true); });\n $('restart').addEventListener('click',reset);\n window.addEventListener('keydown',e=>{\n   const k=e.key.toLowerCase();\n   if(k==='1'||k==='2'||k==='3'){ build=Object.keys(KINDS)[+k-1]; sel=null;\n     for(const el of document.querySelectorAll('.tw')) el.classList.toggle('sel', el.dataset.k===build);\n     showPanel(); }\n   else if(k===' '){ e.preventDefault(); startWave(); }\n   else if(k==='escape'){ build=null; sel=null;\n     for(const el of document.querySelectorAll('.tw')) el.classList.remove('sel'); showPanel(); }\n });\n\n function loop(t){\n   raf=requestAnimationFrame(loop);\n   if(!last) last=t;\n   let dt=Math.min((t-last)/1000,0.05); last=t;\n   if(!over){ for(let i=0;i<speed;i++) step(dt); }\n   draw();\n }\n loadMap(0);\n reset();\n" }

  /* ------------------------------------------------------------ mounting ---
     A live game instance: a shadow root, plus the set of window-level
     listeners its code registered, so we can detach them all on exit. */
  function mountGame(id, container) {
    const src = GAME_SRC[id];
    const host = document.createElement('div');
    host.style.cssText = 'display:block;';
    container.appendChild(host);
    const root = host.attachShadow({ mode:'open' });

    // the game's own stylesheet, scoped to this shadow tree
    const style = document.createElement('style');
    style.textContent = ':host{all:initial;display:block;font-family:var(--font);color:#f2f5fc}' +
      '*{box-sizing:border-box}' + src.css.replace(/:root\s*\{/g, ':host{') + THEME_CSS(id);
    root.appendChild(style);

    // the game's body markup
    const wrap = document.createElement('div');
    wrap.innerHTML = src.body;
    while (wrap.firstChild) root.appendChild(wrap.firstChild);

    // ---- the per-game window shim: collects listeners so we can remove them
    const winListeners = [];
    const observers = [];
    // Timers must be tracked, not passed straight through: an untracked
    // setInterval kept running after the game closed, and stacked up another
    // copy every time the game was reopened.
    const timers = new Set(), intervals = new Set();
    const trackedTimeout = (fn, ms, ...a) => {
      const id = window.setTimeout(function(){ timers.delete(id); return fn && fn.apply(this, arguments); }, ms, ...a);
      timers.add(id); return id;
    };
    const trackedInterval = (fn, ms, ...a) => {
      const id = window.setInterval(fn, ms, ...a);
      intervals.add(id); return id;
    };
    const gameWindow = {
      addEventListener(type, fn, opts){ winListeners.push([type,fn,opts]); window.addEventListener(type,fn,opts); },
      removeEventListener(type, fn, opts){ window.removeEventListener(type,fn,opts); },
      requestAnimationFrame: window.requestAnimationFrame.bind(window),
      cancelAnimationFrame: window.cancelAnimationFrame.bind(window),
      setTimeout: trackedTimeout,
      clearTimeout: id => { timers.delete(id); window.clearTimeout(id); },
      setInterval: trackedInterval,
      clearInterval: id => { intervals.delete(id); window.clearInterval(id); },
      devicePixelRatio: window.devicePixelRatio,
      innerWidth: window.innerWidth, innerHeight: window.innerHeight,
      matchMedia: window.matchMedia.bind(window),
      location: window.location,
      get localStorage(){ return window.localStorage; }
    };

    // ---- the per-game document shim: lookups resolve inside the shadow root
    const gameDocument = {
      getElementById: sel => root.getElementById ? root.getElementById(sel) : root.querySelector('#'+CSS.escape(sel)),
      querySelector: sel => root.querySelector(sel),
      querySelectorAll: sel => root.querySelectorAll(sel),
      createElement: t => document.createElement(t),
      createElementNS: (ns,t) => document.createElementNS(ns,t),
      createTextNode: t => document.createTextNode(t),
      // Hit-testing through a shadow boundary: the real document would hand back
      // the host element, not the cell inside it, so route this to the shadow root.
      elementFromPoint: (x,y) => (root.elementFromPoint ? root.elementFromPoint(x,y)
        : (document.elementsFromPoint(x,y)||[]).find(e => root.contains(e)) || null),
      elementsFromPoint: (x,y) => (document.elementsFromPoint(x,y)||[]).filter(e => root.contains(e)),
      // some games listen on document for keys; funnel that to window so the
      // same active-game gating applies, and record it for cleanup
      addEventListener(type, fn, opts){ winListeners.push([type,fn,opts]); window.addEventListener(type,fn,opts); },
      removeEventListener(type, fn, opts){ window.removeEventListener(type,fn,opts); },
      get body(){ return root.host; },
      get documentElement(){ return document.documentElement; },
      get fullscreenElement(){ return document.fullscreenElement; },
      exitFullscreen: () => document.exitFullscreen ? document.exitFullscreen() : null,
      get hidden(){ return document.hidden; },
      get visibilityState(){ return document.visibilityState; }
    };

    // shadow roots lack getElementById in older engines; polyfill on the root
    if (!root.getElementById) root.getElementById = sel => root.querySelector('#'+CSS.escape(sel));

    // getComputedStyle(document.body) is used by a few games for a font string;
    // hand them the real body so they get a sane value
    const gameGetComputedStyle = el => window.getComputedStyle(el === gameDocument.body ? document.body : el);

    // run the game's own code with the shims in scope. It was authored as the
    // body of an IIFE, so wrapping it in a Function with these params is exactly
    // the environment it expects — just with document/window swapped.
    let raf = [];
    const rafWrap = cb => { const h = window.requestAnimationFrame(cb); raf.push(h); return h; };
    gameWindow.requestAnimationFrame = rafWrap;
    try {
      // Timers are passed in as parameters as well as on `window`, because game
      // code calls bare setTimeout(...) which would otherwise reach the real
      // global and escape teardown, leaving intervals running after close.
      const fn = new Function('document','window','getComputedStyle','localStorage','requestAnimationFrame',
        'cancelAnimationFrame','setTimeout','clearTimeout','setInterval','clearInterval','self',
        '"use strict";\n' + src.js);
      fn(gameDocument, gameWindow, gameGetComputedStyle, window.localStorage, rafWrap,
         gameWindow.cancelAnimationFrame, trackedTimeout, gameWindow.clearTimeout,
         trackedInterval, gameWindow.clearInterval, gameWindow);
    } catch (err) {
      root.appendChild(Object.assign(document.createElement('div'),
        {style:'color:#ff8b8b;padding:20px;font:13px monospace',textContent:'Failed to start: '+err.message}));
      console.error('['+id+']', err);
    }

    // ---- auto-scale: measure the game's natural size and scale the host so it
    // fills the stage. Pure CSS transform — no game code touched, no canvas
    // resolution change, so nothing inside the game can misbehave.
    //
    // host is the scaled element; `container` (.mount) is its offset parent and
    // is what we give the reserved (post-scale) footprint to, so the flex stage
    // centres it correctly and never has to scroll.
    const natural = { w: 0, h: 0 };
    function measure() {
      const stage = container.parentElement;
      const refW = stage ? stage.clientWidth - 36 : 900;
      const availH = stage ? stage.clientHeight - 32 : 700;
      const prevT = host.style.transform, prevW = host.style.width, prevH = host.style.height;
      host.style.transform = 'none';
      host.style.height = 'auto';

      const inner = root.querySelector('main,.cab,.app,.wrap,.table') || host;

      // Lay the game out at a candidate width and report the real content box.
      // Some games have chrome wider than their wrapper (Stacker's side panel,
      // the Platformer's level buttons), so take the widest right edge.
      const tryWidth = (cand) => {
        host.style.width = cand + 'px';
        const left = host.getBoundingClientRect().left;
        let w = cand, h = 0;
        const ir = inner.getBoundingClientRect();
        h = Math.max(inner.scrollHeight || ir.height, ir.height);
        for (const el of root.querySelectorAll('header,h1,p,button,canvas,.hud,.app,.wrap,.levelbar,.bar,.touch,.cab,.board,.grid')) {
          const r = el.getBoundingClientRect();
          if (r.width < 1) continue;
          const right = r.right - left;
          if (right > w) w = right;
          const bottom = r.bottom - left * 0 - host.getBoundingClientRect().top;
          if (bottom > h) h = bottom;
        }
        // A few games pin their board to an exact pixel size because they position
        // tiles absolutely inside it (2048, Fifteen). Those cannot shrink to fit a
        // phone, so capping the reported width at the stage width just chopped the
        // right-hand column off. Report the real content width instead and let the
        // scale factor below shrink the whole thing to fit.
        const rigid = Math.max(inner.scrollWidth || 0, Math.ceil(w) + 6);
        return { w: Math.min(rigid, Math.max(refW, rigid <= refW * 2.5 ? rigid : refW)), h: Math.ceil(h) };
      };

      // Start from the width the game was designed around.
      let base = 0;
      const mw = parseFloat(getComputedStyle(inner).maxWidth);
      if (isFinite(mw) && mw > 40) base = mw;
      if (!base) {
        const play = root.querySelector('canvas, .board, .grid, .cabinet, .cards, .kb');
        if (play) { const pr = play.getBoundingClientRect(); if (pr.width > 40) base = pr.width + 32; }
      }
      if (!base) base = 400;
      base = Math.max(260, Math.min(base, refW));

      // These games are portrait and the stage is landscape, so laying them out
      // at their phone-sized width left them as a thin column with the board
      // shrunk. Try progressively wider layouts and keep whichever ends up
      // physically largest on screen — that fills the window properly.
      // Wider layouts fill more of the screen but force a smaller scale factor,
      // which shrinks the text. Score each candidate on how much of the stage it
      // fills, but reject any that would push the scale below 1 (text smaller
      // than the game was designed at) — readable labels matter more than a few
      // extra percent of coverage.
      let best = null;
      for (const mult of [1, 1.3, 1.7, 2.2, 2.9]) {
        const cand = Math.min(Math.round(base * mult), refW);
        const m = tryWidth(cand);
        if (m.w < 4 || m.h < 4) continue;
        const s = Math.min(refW / m.w, availH / m.h);
        if (s < 1.12 && best) break;                 // keep text at least 1.12x design size
        const area = (m.w * s) * (m.h * s);
        if (!best || area > best.area + 1) best = { w: m.w, h: m.h, area, s };
        if (cand >= refW) break;
      }
      if (best) { natural.w = best.w; natural.h = best.h; }

      host.style.transform = prevT; host.style.width = prevW; host.style.height = prevH;
    }
    function fit() {
      const stage = container.parentElement;         // .stage
      if (!stage) return;
      measure();
      if (!natural.w || !natural.h) return;
      const availW = stage.clientWidth  - 32;        // breathing room + anti-rounding
      const availH = stage.clientHeight - 32;
      let s = Math.min(availW / natural.w, availH / natural.h);
      // never blow a fixed-size game up past ~1.8x its design size: past that the
      // text goes soft and cartoonishly large, which looks worse than a smaller game.
      s = Math.max(0.4, Math.min(s, 1.8));
      host.style.transformOrigin = 'top left';
      host.style.transform = 'scale(' + s.toFixed(4) + ')';
      // pin the host to the measured natural size so the game lays out the same
      // way it did when measured (full width available, tiles positioned)
      host.style.width = natural.w + 'px';
      host.style.height = natural.h + 'px';
      // the scaled box occupies natural*s on screen; size the offset parent to
      // exactly that so the stage centres it and shows no scrollbar
      container.style.width = Math.floor(natural.w * s) + 'px';
      container.style.height = Math.floor(natural.h * s) + 'px';


    }

    // Some games change their own board size mid-play (Minesweeper difficulty,
    // Maze size). Without this the scale stays stuck at the old size and the
    // bigger board runs off the edge of the stage, so watch and refit.
    let roTimer = null, lastKey = '';
    try {
      const ro = new ResizeObserver(()=>{
        const el = root.querySelector('canvas, .grid, .board, .cabinet, .app, main, .wrap');
        if (!el) return;
        const r = el.getBoundingClientRect();
        const key = Math.round(r.width)+'x'+Math.round(r.height);
        if (key === lastKey) return;      // ignore echoes from our own scaling
        lastKey = key;
        clearTimeout(roTimer);
        roTimer = setTimeout(()=>{ fit(); }, 40);
      });
      ro.observe(root.host);
      const watch = root.querySelector('.grid, .board, .cabinet, canvas, .app');
      if (watch) ro.observe(watch);
      observers.push(ro);
    } catch(e) { /* ResizeObserver unavailable — fixed-size games still fine */ }

    return {
      id, host, root,
      fit,
      teardown(){
        for (const h of raf) window.cancelAnimationFrame(h);
        for (const [t,f,o] of winListeners) window.removeEventListener(t,f,o);
        for (const ob of observers) { try{ ob.disconnect(); }catch(e){} }
        for (const id of timers) window.clearTimeout(id);
        for (const id of intervals) window.clearInterval(id);
        timers.clear(); intervals.clear();
        if (host.parentNode) host.parentNode.removeChild(host);
      }
    };
  }

      checkers:
        '.piece.p1{background:linear-gradient(150deg,#fff6ec,#ffd9c2) !important}' +
        '.piece.p2{background:linear-gradient(150deg,#ff5c5c,#c62828) !important;border-color:rgba(255,255,255,.35) !important}' +
        '.sq.dark{background:rgba(155,92,255,.16) !important}' +
        '.sq.light{background:rgba(255,255,255,.05) !important}' +
        '.sq.move::after{background:rgba(141,255,90,.75) !important}',
      wordsearch:
        '.cell{background:rgba(155,92,255,.09)}' +
        '.cell.sel{background:linear-gradient(135deg,#ffc23d,#ff7a4d) !important;color:#2b1400 !important}' +
        '.cell.found{background:rgba(141,255,90,.3) !important;color:#eaffef !important}' +
        '.word.done{color:#8dff5a;opacity:.55}',
      wordle:'.tile.correct{background:#8dff5a !important;border-color:#8dff5a !important;color:#0d2a06 !important}' +
        '.tile.present{background:#ffc23d !important;border-color:#ffc23d !important;color:#2b1e00 !important}' +
        '.tile.present::after{display:none}' +
        '.key.correct{background:#8dff5a !important;color:#0d2a06 !important}' +
        '.key.present{background:#ffc23d !important;color:#2b1e00 !important}',
      maze:'canvas{background:rgba(49,225,255,.05) !important;border-color:rgba(49,225,255,.28) !important}',
      tictactoe:
        '.board{position:relative;gap:0 !important;background-color:transparent;' +
          'background-image:' +
            'linear-gradient(180deg,#ff4d9d,#9b5cff),' +
            'linear-gradient(180deg,#9b5cff,#31e1ff),' +
            'linear-gradient(90deg,#ffc23d,#ff7a4d),' +
            'linear-gradient(90deg,#8dff5a,#31e1ff);' +
          'background-size:5px 90%,5px 90%,90% 5px,90% 5px;' +
          'background-position:33.33% 50%,66.66% 50%,50% 33.33%,50% 66.66%;' +
          'background-repeat:no-repeat}' +
        '.sq{border:0 !important;background:transparent !important;position:relative;z-index:1}' +
        '.sq:hover:not(.taken){background:rgba(255,255,255,.07) !important;border-radius:16px}' +
        '.sq.win{background:rgba(141,255,90,.24) !important;border-radius:16px;color:#eaffef !important}' +
        '.mark{font-weight:250}' +
        '.sq[aria-label$="X"] .mark{color:#ff4d9d;text-shadow:0 0 18px rgba(255,77,157,.55)}' +
        '.sq[aria-label$="O"] .mark{color:#31e1ff;text-shadow:0 0 18px rgba(49,225,255,.55)}'
    };
    return base + (FIX[id] || '');
  }

  /* ------------------------------------------------------------------ cards */
  function cardFor(g) {
    const el=document.createElement('button');
    el.className='card'; el.type='button'; el.dataset.id=g.id;
    el.style.setProperty('--tint',g.tint);
    el.style.setProperty('--gl',(g.glow||g.tint));
    el.setAttribute('aria-label', g.title+' — '+g.blurb);
    const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    el.innerHTML =
      '<div class="thumb"><svg viewBox="0 0 74 68" aria-hidden="true">'+g.art+'</svg></div>'+
      '<div class="meta"><h3>'+esc(g.title)+'</h3><p>'+esc(g.blurb)+'</p>'+
        '<div class="pills"><span class="pill kind">'+g.kind+'</span>'+
        '<span class="pill">'+g.ctrl+'</span></div></div>';
    el.addEventListener('click', ()=>open(g.id, el));
    return el;
  }
  function visible() {
    const q=query.trim().toLowerCase();
    return GAMES.filter(g=>{
      if (kind!=='all' && g.kind!==kind) return false;
      if (!q) return true;
      return (g.title+' '+g.blurb+' '+g.kind+' '+g.ctrl).toLowerCase().indexOf(q)>=0;
    });
  }
  function paint() {
    const list=visible();
    const before=new Map();
    for (const el of gridEl.children) before.set(el.dataset.id, el.getBoundingClientRect());
    gridEl.innerHTML='';
    if (!list.length) {
      const p=document.createElement('div'); p.className='empty';
      p.textContent='Nothing matches “'+query.trim()+'”.'; gridEl.appendChild(p);
    } else for (const g of list) gridEl.appendChild(cardFor(g));
    $('#count').textContent = list.length+(list.length===1?' game':' games');
    if (!reduce) for (const el of gridEl.children) {
      const old=before.get(el.dataset.id);
      if (!old){ el.animate([{opacity:0,transform:'scale(.94) translateY(8px)'},{opacity:1,transform:'none'}],{duration:320,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'}); continue; }
      const now=el.getBoundingClientRect(), dx=old.left-now.left, dy=old.top-now.top;
      if (dx||dy) el.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'none'}],{duration:380,easing:'cubic-bezier(.22,1,.36,1)'});
    }
    paintRecent();
  }
  function paintRecent() {
    const ids=store.get('arcade.recent')||[];
    const list=ids.map(id=>GAMES.find(g=>g.id===id)).filter(Boolean).slice(0,4);
    const show=list.length>0 && !query.trim() && kind==='all';
    const wrap=$('#recentWrap'); if(wrap) wrap.hidden=!show;
    if (!show) return;
    recentEl.innerHTML='';
    for (const g of list) {
      const el=document.createElement('button');
      el.className='rcard'; el.type='button'; el.dataset.id=g.id;
      el.style.setProperty('--tint',g.tint);
      el.innerHTML='<div class="rthumb"><svg viewBox="0 0 74 68" aria-hidden="true">'+g.art+'</svg></div>'+
                   '<div class="t">'+String(g.title).replace(/&/g,'&amp;')+'</div>';
      el.addEventListener('click',()=>open(g.id, el));
      recentEl.appendChild(el);
    }
  }
  function remember(id){ const ids=(store.get('arcade.recent')||[]).filter(x=>x!==id); ids.unshift(id); store.set('arcade.recent',ids.slice(0,8)); }

  for (const k of KINDS) {
    const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=k.label;
    b.setAttribute('aria-pressed',String(k.id===kind));
    b.addEventListener('click',()=>{ kind=k.id; for (const c of filtersEl.children) c.setAttribute('aria-pressed',String(c.textContent===k.label)); paint(); });
    filtersEl.appendChild(b);
  }
  qEl.addEventListener('input',()=>{ query=qEl.value; paint(); });
  qEl.addEventListener('keydown',e=>{ if(e.key==='Escape'){ qEl.value=''; query=''; paint(); qEl.blur(); } });

  /* --------------------------------------------------------- scroll + fullscreen
     One place owns the page scroll lock so it can never be left on, and one place
     owns leaving fullscreen so the sheet is never hidden while still fullscreen. */
  let locked=false;
  function lockScroll(){ locked=true; document.body.style.overflow='hidden'; document.body.classList.add('playing'); }
  function unlockScroll(){ locked=false; document.body.style.overflow=''; document.body.classList.remove('playing'); }
  function inPlayer(el){ return !!el && (el===player || player.contains(el)); }
  function leaveFullscreen(){
    try{ if (document.fullscreenElement && inPlayer(document.fullscreenElement)) document.exitFullscreen(); }
    catch(e){}
    try{ if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen(); }
    catch(e){}
  }
  // belt and braces: if we ever end up with no game open but the page still
  // locked, release it. Cheap, and it makes the stuck-page state unreachable.
  function audit(){ if (!current && locked) unlockScroll(); }

  /* ------------------------------------------------------------------ player */
  function open(id, card) {
    const g=GAMES.find(x=>x.id===id);
    if (!g || current) return;
    current=g; originCard=card||null;
    $('#ptitle').textContent=g.title; $('#pctrl').textContent=g.ctrl;
    player.classList.add('on'); lockScroll();
    // paint the sheet with this game's signature hue
    sheet.style.setProperty('--tint', g.tint);
    hideHow();

    // --- shared-element zoom: the sheet grows out of the card you tapped -----
    sheet.getAnimations().forEach(a=>a.cancel());
    let zoomMs = 0;
    if (!reduce && originCard) {
      const from=originCard.getBoundingClientRect(), to=sheet.getBoundingClientRect();
      const sx=Math.max(.08, from.width/to.width), sy=Math.max(.08, from.height/to.height);
      const dx=(from.left+from.width/2)-(to.left+to.width/2);
      const dy=(from.top+from.height/2)-(to.top+to.height/2);
      zoomMs = 460;
      sheet.animate(
        [{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')',opacity:.5,borderRadius:'26px'},
         {transform:'none',opacity:1,borderRadius:'24px'}],
        {duration:zoomMs, easing:'cubic-bezier(.22,1,.3,1)', fill:'both'});
      // the card itself dips back so the two read as one object
      originCard.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.94)',opacity:0}],
        {duration:220, easing:'ease-out', fill:'both'});
    }
    requestAnimationFrame(()=>player.classList.add('in'));

    // --- mount once the zoom has settled, then fade the game in -------------
    const mountNow=()=>{
      if(!current||current.id!==g.id) return;
      activeGame=mountGame(g.id, mountEl);
      refit(); requestAnimationFrame(refit);
      setTimeout(refit, 60); setTimeout(refit, 240);
      if(!reduce) mountEl.animate([{opacity:0,transform:'scale(.97)'},{opacity:1,transform:'none'}],
        {duration:260,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'});
      // first time you open a game, show how to play
      if(!store.get('ikyk.seen.'+g.id)) setTimeout(()=>showHow(g), 240);
    };
    if (reduce) mountNow(); else setTimeout(mountNow, Math.max(180, zoomMs*0.62));

    remember(g.id);
    // Focus the mount, NOT the back button — otherwise Enter (Wordle submit etc.)
    // would activate Back and close the player.
    mountEl.setAttribute('tabindex','-1');
    mountEl.focus({ preventScroll:true });
  }

  /* ------------------------------------------------------------- how to play */
  function showHow(g){
    const h=HOWTO[g.id];
    if(!h){ return; }
    $('#howcard').innerHTML =
      '<h3>'+g.title+'</h3>'+
      '<p class="goal">'+h.goal+'</p>'+
      '<ol>'+h.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'+
      (h.keys? '<div class="keys">'+h.keys.map(k=>'<span>'+k+'</span>').join('')+'</div>' : '')+
      '<button type="button" id="howGo">Got it — play</button>';
    $('#howto').classList.add('on');
    const go=$('#howGo');
    go.addEventListener('click',()=>{ store.set('ikyk.seen.'+g.id,1); hideHow(); });
    setTimeout(()=>go.focus({preventScroll:true}),30);
  }
  function hideHow(){ const el=$('#howto'); if(el) el.classList.remove('on'); }

  function close() {
    if (!current) return;
    // Leaving the player while the sheet is still the fullscreen element left the
    // document in fullscreen on a hidden node — the page behind it then had no
    // layout and could not be scrolled. Drop out of fullscreen first, always.
    leaveFullscreen();
    const card=originCard; current=null; originCard=null;
    hideHow();
    if (activeGame){ activeGame.teardown(); activeGame=null; }   // stop the loop + detach keys immediately
    mountEl.innerHTML='';
    player.classList.remove('in');
    let settled=false;
    const done=()=>{
      if(settled) return; settled=true;
      sheet.getAnimations().forEach(a=>a.cancel());
      sheet.style.width='';
      player.classList.remove('on'); unlockScroll();
      paint();
      if(card){
        const again=gridEl.querySelector('[data-id="'+card.dataset.id+'"]');
        if(again){ again.getAnimations().forEach(a=>a.cancel()); again.style.opacity=''; again.focus(); }
      }
    };
    if (reduce || !card){ done(); return; }
    // shrink back into the card it came from
    const from=card.getBoundingClientRect(), to=sheet.getBoundingClientRect();
    const sx=Math.max(.08,from.width/to.width), sy=Math.max(.08,from.height/to.height);
    const dx=(from.left+from.width/2)-(to.left+to.width/2);
    const dy=(from.top+from.height/2)-(to.top+to.height/2);
    card.getAnimations().forEach(a=>a.cancel());
    card.style.opacity='';
    const anim=sheet.animate(
      [{transform:'none',opacity:1},
       {transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')',opacity:0}],
      {duration:300, easing:'cubic-bezier(.4,0,.2,1)', fill:'both'});
    anim.addEventListener('finish',done); setTimeout(done,480);
  }
  function restart() {
    if (!current) return;
    const g=current;
    if (activeGame){ activeGame.teardown(); activeGame=null; }
    mountEl.innerHTML='';
    activeGame=mountGame(g.id, mountEl);
    refit();
    requestAnimationFrame(refit);
    setTimeout(refit, 260);
  }

  // rescale the current game to whatever space the stage now has
  function refit(){ if (activeGame && activeGame.fit) activeGame.fit(); }

  $('#againBtn').addEventListener('click',()=>{ restart(); mountEl.focus({preventScroll:true}); });
  $('#help').addEventListener('click',()=>{ if(current){ const h=HOWTO[current.id]; if(h) showHow(current); } });
  $('#back').addEventListener('click',close);
  $('#scrim').addEventListener('click',close);
  $('#reload').addEventListener('click',restart);
  $('#full').addEventListener('click',()=>{
    if (document.fullscreenElement) document.exitFullscreen();
    else if (sheet.requestFullscreen) sheet.requestFullscreen().catch(()=>{});
  });
  // when entering or leaving fullscreen the stage changes size — refit after it
  document.addEventListener('fullscreenchange',()=>{ audit(); setTimeout(()=>{audit();refit();},50); setTimeout(refit,300); });
  document.addEventListener('webkitfullscreenchange',()=>{ audit(); setTimeout(refit,60); });
  document.addEventListener('visibilitychange',audit);
  // and on any window resize while a game is open
  let rz=null;
  window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(refit,120); });

  window.addEventListener('keydown',e=>{
    if (e.key==='Escape' && current){ close(); return; }
    if (e.key==='/' && !current && document.activeElement!==qEl){ e.preventDefault(); qEl.focus(); qEl.select(); }
  });

  paint();
})();
</script>
</body>
</html>
