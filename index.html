k<car.len;k++){\n   const r=car.h?nr:nr+k, c=car.h?nc+k:nc;\n   if(r<0||c<0||r>=N||c>=N) return false;\n   if(g[r][c]!==-1 && g[r][c]!==car.id) return false;\n  }\n  return true;\n }\n function move(car,dr,dc){\n  if(won) return false;\n  const nr=car.r+dr, nc=car.c+dc;\n  if(!canPlace(car,nr,nc)) return false;\n  car.r=nr; car.c=nc; moves++; $('mv').textContent=moves;\n  check(); draw(); return true;\n }\n function check(){\n  const red=cars[0];\n  if(red.h && red.r===EXIT_ROW && red.c+red.len>=N){\n   won=true;\n   const key='grid.best.'+lvl, prev=store.get(key);\n   let nb='';\n   if(prev===null||prev===undefined||moves<prev){ store.set(key,moves); nb=' \u00b7 best!'; }\n   $('msg').textContent='Out in '+moves+' moves'+nb;\n   if(lvl<LEVELS.length-1) setTimeout(()=>load(lvl+1),1100);\n   else $('msg').textContent='All 8 levels cleared! \ud83c\udf89';\n  }\n }\n\n function draw(){\n  const c=ctx;\n  c.clearRect(0,0,cv.width,cv.height);\n  c.fillStyle='#1b1436'; c.fillRect(0,0,cv.width,cv.height);\n  // grid\n  c.strokeStyle='rgba(255,255,255,.09)'; c.lineWidth=1;\n  for(let i=0;i<=N;i++){\n   c.beginPath(); c.moveTo(i*CS,0); c.lineTo(i*CS,cv.height); c.stroke();\n   c.beginPath(); c.moveTo(0,i*CS); c.lineTo(cv.width,i*CS); c.stroke();\n  }\n  // exit\n  c.fillStyle='rgba(141,255,90,.22)';\n  c.fillRect(cv.width-5,EXIT_ROW*CS+4,5,CS-8);\n  c.fillStyle='#8dff5a'; c.font='700 10px Outfit,system-ui,sans-serif'; c.textAlign='right';\n  c.fillText('EXIT',cv.width-8,EXIT_ROW*CS+CS/2+3);\n  // cars\n  cars.forEach((car,i)=>{\n   const x=car.c*CS+4, y=car.r*CS+4;\n   const w=(car.h?car.len:1)*CS-8, h=(car.h?1:car.len)*CS-8;\n   const hue = i===0? 350 : (i*67)%360;\n   const g=c.createLinearGradient(x,y,x+w,y+h);\n   g.addColorStop(0,'hsl('+hue+' '+(i===0?92:64)+'% '+(i===0?62:56)+'%)');\n   g.addColorStop(1,'hsl('+((hue+24)%360)+' '+(i===0?88:60)+'% '+(i===0?44:38)+'%)');\n   c.fillStyle=g;\n   rr(c,x,y,w,h,7); c.fill();\n   if(drag&&drag.car===car){ c.strokeStyle='#fff'; c.lineWidth=2.4; c.stroke(); }\n   c.fillStyle='rgba(255,255,255,.28)';\n   if(car.h) rr(c,x+7,y+5,w-14,h*0.26,4); else rr(c,x+5,y+7,w*0.26,h-14,4);\n   c.fill();\n   if(i===0){\n    c.fillStyle='#fff'; c.font='800 12px Outfit,system-ui,sans-serif'; c.textAlign='center';\n    c.fillText('\u2192',x+w/2,y+h/2+4);\n   }\n  });\n }\n function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}\n\n function cellAt(e){\n  const r=cv.getBoundingClientRect();\n  const x=(e.clientX-r.left)*(cv.width/r.width), y=(e.clientY-r.top)*(cv.height/r.height);\n  return {c:Math.floor(x/CS), r:Math.floor(y/CS)};\n }\n cv.addEventListener('pointerdown',e=>{\n  e.preventDefault();\n  const p=cellAt(e);\n  const g=occupied();\n  if(p.r<0||p.c<0||p.r>=N||p.c>=N) return;\n  const id=g[p.r][p.c];\n  if(id===-1) return;\n  drag={car:cars[id], start:p, last:p};\n  try{ cv.setPointerCapture(e.pointerId); }catch(_){}\n  draw();\n });\n cv.addEventListener('pointermove',e=>{\n  if(!drag) return;\n  const p=cellAt(e);\n  const car=drag.car;\n  if(car.h){\n   let d=p.c-drag.last.c;\n   while(d!==0){ const step=d>0?1:-1; if(!move(car,0,step)) break; drag.last={r:drag.last.r,c:drag.last.c+step}; d-=step; }\n  } else {\n   let d=p.r-drag.last.r;\n   while(d!==0){ const step=d>0?1:-1; if(!move(car,step,0)) break; drag.last={r:drag.last.r+step,c:drag.last.c}; d-=step; }\n  }\n });\n function endDrag(){ if(drag){ drag=null; draw(); } }\n cv.addEventListener('pointerup',endDrag);\n cv.addEventListener('pointercancel',endDrag);\n window.addEventListener('pointerup',endDrag);\n\n $('retry').addEventListener('click',()=>load(lvl));\n $('next').addEventListener('click',()=>load(Math.min(LEVELS.length-1,lvl+1)));\n load(0);\n" },
  "mahjong": { css: "\n :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.6);--line:rgba(255,255,255,.16);--sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n *{box-sizing:border-box}\n body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n .wrap{width:100%;max-width:400px;text-align:center}\n header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap}\n h1{margin:0;font-size:18px;font-weight:800;white-space:nowrap}\n .hud{display:flex;gap:12px;font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap}\n .board{position:relative;width:100%;aspect-ratio:1/0.92;border-radius:16px;background:rgba(155,92,255,.08);border:1px solid var(--line);overflow:hidden}\n .tile{position:absolute;border-radius:6px;background:linear-gradient(160deg,#fdfaf2,#e2dbc8);\n  border:1px solid rgba(0,0,0,.32);box-shadow:0 2px 0 rgba(0,0,0,.35);cursor:pointer;\n  display:grid;place-items:center;font-size:17px;font-weight:700;color:#221a3a;user-select:none;\n  transition:transform .12s,box-shadow .12s}\n .tile.locked{filter:brightness(.6) saturate(.6);cursor:default;box-shadow:none}\n .tile.sel{outline:3px solid #ffc23d;outline-offset:-3px;transform:translateY(-2px);z-index:99!important}\n .tile.gone{display:none}\n .status{min-height:20px;font-size:13px;font-weight:750;margin-top:10px}\n .bar{display:flex;gap:8px;justify-content:center;margin-top:8px}\n .bar button{font:inherit;font-size:12px;font-weight:700;cursor:pointer;border-radius:999px;padding:8px 16px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink)}\n .bar .primary{background:linear-gradient(135deg,#9b5cff,#31e1ff);color:#0a0a1a;border-color:transparent}\n .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.45;padding:0 6px}\n", body: "<main class=\"wrap\">\n <header><h1>Tile Match</h1><div class=\"hud\"><span>LEFT <span id=\"left\">0</span></span><span>MOVES <span id=\"mv\">0</span></span></div></header>\n <div class=\"board\" id=\"board\"></div>\n <div class=\"status\" id=\"status\">Match two free tiles that show the same symbol</div>\n <div class=\"bar\"><button type=\"button\" id=\"hint\">Hint</button><button type=\"button\" class=\"primary\" id=\"again\">New layout</button></div>\n <p class=\"hint\">A tile is free if nothing sits on top of it and one side is open \u00b7 dimmed tiles are blocked</p>\n</main>", js: "\n 'use strict';\n const $=id=>document.getElementById(id);\n const SYMS=['\ud83c\udf51','\ud83c\udf4b','\ud83c\udf47','\ud83c\udf49','\ud83e\udd5d','\ud83c\udf52','\ud83c\udf36','\ud83e\udd51','\ud83c\udf44','\ud83c\udf3b','\u2b50','\ud83d\udd37','\ud83d\udd36','\ud83c\udf40','\ud83d\udc1a','\ud83c\udfb2'];\n const COLS=8, ROWS=6;\n let tiles, sel, moves, boardEl;\n boardEl=$('board');\n\n // three stacked layers, each smaller and offset, so tiles overlap like mahjong\n const LAYERS=[\n  {cols:8, rows:6, ox:0,   oy:0},\n  {cols:6, rows:4, ox:1,   oy:1},\n  {cols:4, rows:2, ox:2,   oy:2}\n ];\n\n function build(){\n  // collect every slot across the layers\n  const slots=[];\n  LAYERS.forEach((L,z)=>{\n   for(let r=0;r<L.rows;r++)for(let c=0;c<L.cols;c++) slots.push({z,r:r+L.oy,c:c+L.ox});\n  });\n  // must be an even number of slots so every tile can pair\n  if(slots.length%2) slots.pop();\n  // deal symbols in pairs\n  const syms=[];\n  for(let i=0;i<slots.length/2;i++){ const s=SYMS[i%SYMS.length]; syms.push(s,s); }\n  for(let i=syms.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [syms[i],syms[j]]=[syms[j],syms[i]]; }\n  tiles=slots.map((s,i)=>({...s, sym:syms[i], gone:false, id:i}));\n  sel=null; moves=0;\n  render();\n }\n\n const at=(z,r,c)=>tiles.find(t=>!t.gone&&t.z===z&&t.r===r&&t.c===c);\n function free(t){\n  if(t.gone) return false;\n  // blocked if a tile sits directly above it on a higher layer\n  for(let z=t.z+1;z<LAYERS.length;z++){\n   for(let dr=-1;dr<=0;dr++)for(let dc=-1;dc<=0;dc++){\n    const o=at(z,t.r+dr,t.c+dc);\n    if(o) return false;\n   }\n  }\n  // needs a clear left or right neighbour on its own layer\n  const l=at(t.z,t.r,t.c-1), rt=at(t.z,t.r,t.c+1);\n  return !l||!rt;\n }\n\n function render(){\n  boardEl.innerHTML='';\n  const bw=boardEl.clientWidth||360, bh=boardEl.clientHeight||330;\n  const tw=bw/(COLS+1.4), th=bh/(ROWS+1.4);\n  for(const t of tiles){\n   if(t.gone) continue;\n   const el=document.createElement('div');\n   el.className='tile'+(free(t)?'':' locked')+(sel&&sel.id===t.id?' sel':'');\n   el.textContent=t.sym;\n   el.style.width=tw+'px'; el.style.height=th+'px';\n   el.style.left=(t.c*tw*0.98 + t.z*5 + tw*0.2)+'px';\n   el.style.top=(t.r*th*0.96 - t.z*5 + th*0.3)+'px';\n   el.style.zIndex=String(t.z*100 + t.r);\n   el.style.fontSize=Math.max(12,Math.min(22,tw*0.5))+'px';\n   el.addEventListener('click',()=>pick(t));\n   boardEl.appendChild(el);\n  }\n  $('left').textContent=tiles.filter(t=>!t.gone).length;\n  $('mv').textContent=moves;\n }\n\n function pick(t){\n  if(!free(t)) { $('status').textContent='That tile is blocked'; return; }\n  if(sel&&sel.id===t.id){ sel=null; render(); return; }\n  if(!sel){ sel=t; render(); return; }\n  if(sel.sym===t.sym){\n   sel.gone=true; t.gone=true; sel=null; moves++;\n   render();\n   const left=tiles.filter(x=>!x.gone).length;\n   if(left===0) $('status').textContent='\ud83c\udf89 Cleared in '+moves+' moves!';\n   else if(!anyMove()) $('status').textContent='No free matches left \u2014 try a new layout';\n   else $('status').textContent='Matched!';\n  } else {\n   sel=t; render(); $('status').textContent='Not a pair';\n  }\n }\n function anyMove(){\n  const f=tiles.filter(t=>!t.gone&&free(t));\n  for(let i=0;i<f.length;i++)for(let j=i+1;j<f.length;j++) if(f[i].sym===f[j].sym) return true;\n  return false;\n }\n $('hint').addEventListener('click',()=>{\n  const f=tiles.filter(t=>!t.gone&&free(t));\n  for(let i=0;i<f.length;i++)for(let j=i+1;j<f.length;j++){\n   if(f[i].sym===f[j].sym){ sel=f[i]; render(); $('status').textContent='Try the '+f[i].sym+' pair'; return; }\n  }\n  $('status').textContent='No free matches \u2014 start a new layout';\n });\n $('again').addEventListener('click',()=>{ build(); $('status').textContent='Match two free tiles that show the same symbol'; });\n window.addEventListener('resize',render);\n setTimeout(build,30);\n" },
  "nonogram": { css: "\n :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.58);--line:rgba(255,255,255,.14);\n   --fill:#31e1ff;--cross:rgba(246,243,255,.34);--cell:rgba(255,255,255,.05);\n   --sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n *{box-sizing:border-box}\n body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n .wrap{width:100%;max-width:640px;margin:0 auto}\n header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}\n h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}\n .modes{display:flex;gap:7px;flex:none}\n button{font:inherit;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.06);\n   border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;\n   transition:background .15s,transform .1s}\n button:hover{background:rgba(255,255,255,.13)}\n button:active{transform:scale(.96)}\n button[aria-pressed=\"true\"]{background:#f2f2f2;color:#0a0a1a;border-color:#fff}\n button.primary{background:linear-gradient(135deg,#31e1ff,#8dff5a);color:#04202b;border-color:transparent}\n button:focus-visible{outline:2px solid #fff;outline-offset:2px}\n\n .topbar{display:flex;align-items:center;gap:14px;margin-bottom:12px}\n .grow{flex:1}\n .stat{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n .stat b{font-family:var(--mono);font-size:15px;color:var(--ink);margin-left:5px;letter-spacing:0}\n\n /* clue gutters sit outside the grid, so the puzzle reads like a printed one */\n .boardwrap{position:relative;display:grid;gap:6px;justify-content:center;\n   grid-template-columns:var(--gutter) auto;grid-template-rows:var(--gutter) auto}\n .corner{grid-area:1/1}\n .colclues{grid-area:1/2;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--gap)}\n .rowclues{grid-area:2/1;display:grid;grid-template-rows:repeat(var(--n),1fr);gap:var(--gap)}\n .cells{grid-area:2/2;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--gap);\n   touch-action:none;position:relative}\n\n .cc,.rc{display:flex;font-family:var(--mono);font-size:var(--clue);font-weight:700;color:var(--muted);\n   line-height:1.15;user-select:none;-webkit-user-select:none}\n .cc{flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:3px;gap:1px}\n .rc{flex-direction:row;align-items:center;justify-content:flex-end;padding-right:5px;gap:4px}\n .cc.done,.rc.done{color:rgba(141,255,90,.42)}\n .cc.band,.rc.band{color:rgba(246,243,255,.75)}\n .cc.band.done,.rc.band.done{color:rgba(141,255,90,.55)}\n\n .cell{aspect-ratio:1;border:0;padding:0;border-radius:3px;background:var(--cell);cursor:pointer;\n   position:relative;transition:background .07s}\n .cell:hover{background:rgba(255,255,255,.12)}\n .cell.on{background:var(--fill);box-shadow:0 0 10px rgba(49,225,255,.35)}\n .cell.off::before,.cell.off::after{content:\"\";position:absolute;left:50%;top:50%;width:44%;height:2px;\n   background:var(--cross);border-radius:2px}\n .cell.off::before{transform:translate(-50%,-50%) rotate(45deg)}\n .cell.off::after{transform:translate(-50%,-50%) rotate(-45deg)}\n /* every fifth line gets a heavier edge so you can count without losing your place */\n .cell.bl{margin-left:2px}\n .cell.bt{margin-top:2px}\n\n .won{position:absolute;inset:-10px;display:grid;place-items:center;text-align:center;border-radius:16px;\n   background:rgba(10,10,26,.86);z-index:3}\n .won.hidden{display:none}\n .won h2{margin:0 0 6px;font-size:28px;font-weight:800}\n .won p{margin:0 0 16px;font-size:14px;color:var(--muted);font-weight:650}\n .won button{padding:11px 26px;font-size:14px}\n\n .hint{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:14px;line-height:1.6;text-align:center}\n .hint b{color:var(--ink)}\n", body: "<main class=\"wrap\">\n <header>\n  <h1>Grid Logic</h1>\n  <div class=\"modes\" role=\"group\" aria-label=\"Size\">\n   <button type=\"button\" id=\"s10\" aria-pressed=\"true\">10 &times; 10</button>\n   <button type=\"button\" id=\"s15\" aria-pressed=\"false\">15 &times; 15</button>\n  </div>\n </header>\n\n <div class=\"topbar\">\n  <span class=\"stat\">Time <b id=\"time\">0:00</b></span>\n  <span class=\"stat\">Best <b id=\"best\">&mdash;</b></span>\n  <span class=\"grow\"></span>\n  <button type=\"button\" id=\"newp\">New puzzle</button>\n </div>\n\n <div class=\"boardwrap\">\n  <div class=\"corner\"></div>\n  <div class=\"colclues\" id=\"cols\"></div>\n  <div class=\"rowclues\" id=\"rows\"></div>\n  <div class=\"cells board\" id=\"cells\"></div>\n  <div class=\"won hidden\" id=\"won\">\n   <div>\n    <h2>Solved</h2>\n    <p id=\"wonSub\">&nbsp;</p>\n    <button type=\"button\" id=\"again\" class=\"primary\">Another one</button>\n   </div>\n  </div>\n </div>\n\n <p class=\"hint\">Every clue is the run of filled squares in that line, in order. <b>Click</b> to fill, <b>right-click</b> to rule a square out. Drag to paint a run. No puzzle here ever needs a guess.</p>\n</main>\n", js: "\n 'use strict';\n const $=id=>document.getElementById(id);\n const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n   return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n   catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n\n let N=10, sol, rowClues, colClues, marks, cellEls, started, t0, tick, solved;\n\n /* ---------------- clues ---------------- */\n function cluesOf(line){\n   const out=[]; let run=0;\n   for(const v of line){ if(v){run++;} else if(run){out.push(run);run=0;} }\n   if(run) out.push(run);\n   return out.length?out:[0];\n }\n\n /* ---------------- line solver ----------------\n    Enumerates every arrangement of a line's runs that is still consistent with\n    what is already known, then keeps whatever all of them agree on. Running this\n    to completion is how the generator proves a puzzle can be finished by pure\n    deduction — no puzzle here ever needs a coin flip. */\n function arrangements(clues, len, known, out, cap){\n   const runs=clues[0]===0?[]:clues;\n   const res=[];\n   const place=(i,pos,acc)=>{\n     if(res.length>cap) return;\n     if(i===runs.length){\n       const line=acc.slice();\n       for(let k=pos;k<len;k++) line[k]=0;\n       for(let k=0;k<len;k++) if(known[k]!==-1 && known[k]!==line[k]) return;\n       res.push(line); return;\n     }\n     const remain=runs.slice(i).reduce((a,b)=>a+b,0)+(runs.length-i-1);\n     for(let s=pos;s+remain<=len;s++){\n       const line=acc.slice();\n       let ok=true;\n       for(let k=pos;k<s;k++){ if(known[k]===1){ok=false;break;} line[k]=0; }\n       if(!ok) break;\n       for(let k=s;k<s+runs[i] && ok;k++){ if(known[k]===0) ok=false; else line[k]=1; }\n       if(!ok) continue;\n       let next=s+runs[i];\n       if(next<len){ if(known[next]===1) continue; line[next]=0; next++; }\n       place(i+1,next,line);\n       if(res.length>cap) return;\n     }\n   };\n   place(0,0,new Array(len).fill(-1));\n   return res;\n }\n function solveByLogic(rc,cc,n){\n   const g=Array.from({length:n},()=>new Array(n).fill(-1));\n   for(let pass=0;pass<n*4;pass++){\n     let changed=false;\n     for(let r=0;r<n;r++){\n       const known=g[r];\n       const arr=arrangements(rc[r],n,known,null,4000);\n       if(!arr.length) return null;\n       if(arr.length>4000) continue;\n       for(let c=0;c<n;c++){\n         const v=arr[0][c];\n         if(arr.every(a=>a[c]===v) && g[r][c]===-1){ g[r][c]=v; changed=true; }\n       }\n     }\n     for(let c=0;c<n;c++){\n       const known=g.map(row=>row[c]);\n       const arr=arrangements(cc[c],n,known,null,4000);\n       if(!arr.length) return null;\n       if(arr.length>4000) continue;\n       for(let r=0;r<n;r++){\n         const v=arr[0][r];\n         if(arr.every(a=>a[r]===v) && g[r][c]===-1){ g[r][c]=v; changed=true; }\n       }\n     }\n     if(!changed) break;\n     if(g.every(row=>row.every(v=>v!==-1))) return g;\n   }\n   return g.every(row=>row.every(v=>v!==-1)) ? g : null;\n }\n\n /* ---------------- generation ---------------- */\n function build(n){\n   for(let attempt=0;attempt<160;attempt++){\n     const density=0.48+Math.random()*0.14;\n     const g=Array.from({length:n},()=>Array.from({length:n},()=>Math.random()<density?1:0));\n     // a completely empty line is legal but dull, and an entirely full one is free\n     let dull=false;\n     for(let i=0;i<n;i++){\n       const rs=g[i].reduce((a,b)=>a+b,0);\n       let cs=0; for(let r=0;r<n;r++) cs+=g[r][i];\n       if(rs===0||cs===0||rs===n||cs===n){ dull=true; break; }\n     }\n     if(dull) continue;\n     const rc=g.map(cluesOf);\n     const cc=[]; for(let c=0;c<n;c++) cc.push(cluesOf(g.map(r=>r[c])));\n     const done=solveByLogic(rc,cc,n);\n     if(!done) continue;\n     let same=true;\n     for(let r=0;r<n&&same;r++)for(let c=0;c<n;c++) if(done[r][c]!==g[r][c]){ same=false; break; }\n     if(!same) continue;\n     return {g,rc,cc};\n   }\n   return null;\n }\n\n /* ---------------- rendering ---------------- */\n function layout(){\n   const wrap=document.querySelector('.boardwrap');\n   const cellPx = N===10 ? 34 : 24;\n   const gap = N===10 ? 3 : 2;\n   wrap.style.setProperty('--n',N);\n   wrap.style.setProperty('--gap',gap+'px');\n   wrap.style.setProperty('--gutter',(N===10?96:92)+'px');\n   wrap.style.setProperty('--clue',(N===10?13:11)+'px');\n   $('cells').style.width=(N*cellPx+(N-1)*gap)+'px';\n   document.querySelector('.colclues').style.width=$('cells').style.width;\n   document.querySelector('.rowclues').style.height=(N*cellPx+(N-1)*gap)+'px';\n }\n function render(){\n   layout();\n   const cc=$('cols'), rc=$('rows'), cs=$('cells');\n   cc.innerHTML=''; rc.innerHTML=''; cs.innerHTML=''; cellEls=[];\n   for(let c=0;c<N;c++){\n     const d=document.createElement('div');\n     d.className='cc'+(c%5===0?' band':''); d.dataset.c=c;\n     for(const v of colClues[c]){ const s=document.createElement('span'); s.textContent=v; d.appendChild(s); }\n     cc.appendChild(d);\n   }\n   for(let r=0;r<N;r++){\n     const d=document.createElement('div');\n     d.className='rc'+(r%5===0?' band':''); d.dataset.r=r;\n     for(const v of rowClues[r]){ const s=document.createElement('span'); s.textContent=v; d.appendChild(s); }\n     rc.appendChild(d);\n   }\n   for(let i=0;i<N*N;i++){\n     const r=Math.floor(i/N), c=i%N;\n     const b=document.createElement('button');\n     b.type='button';\n     b.className='cell'+(c%5===0&&c?' bl':'')+(r%5===0&&r?' bt':'');\n     b.dataset.i=i;\n     b.setAttribute('aria-label','row '+(r+1)+' column '+(c+1));\n     cs.appendChild(b); cellEls.push(b);\n   }\n   paint();\n }\n function paint(){\n   for(let i=0;i<N*N;i++){\n     const m=marks[i];\n     cellEls[i].className='cell'+(m===1?' on':m===2?' off':'')\n       +((i%N)%5===0&&i%N?' bl':'')+((Math.floor(i/N))%5===0&&Math.floor(i/N)?' bt':'');\n   }\n   // grey out a clue once its line is finished, which is most of the fun\n   for(let r=0;r<N;r++){\n     const line=[]; for(let c=0;c<N;c++) line.push(marks[r*N+c]===1?1:0);\n     $('rows').children[r].classList.toggle('done', same(cluesOf(line),rowClues[r]));\n   }\n   for(let c=0;c<N;c++){\n     const line=[]; for(let r=0;r<N;r++) line.push(marks[r*N+c]===1?1:0);\n     $('cols').children[c].classList.toggle('done', same(cluesOf(line),colClues[c]));\n   }\n }\n const same=(a,b)=>a.length===b.length&&a.every((v,i)=>v===b[i]);\n\n /* ---------------- play ---------------- */\n function check(){\n   for(let i=0;i<N*N;i++){\n     const want=sol[Math.floor(i/N)][i%N];\n     if(want===1 && marks[i]!==1) return;\n     if(want===0 && marks[i]===1) return;\n   }\n   win();\n }\n function win(){\n   solved=true; clearInterval(tick);\n   const secs=elapsed();\n   const key='nono.best.'+N, prev=store.get(key);\n   let sub='Finished in '+fmt(secs);\n   if(prev===null||secs<prev){ store.set(key,secs); sub+=' \\u2014 new best'; }\n   showBest();\n   $('wonSub').textContent=sub;\n   $('won').classList.remove('hidden');\n }\n const elapsed=()=>started?Math.floor((Date.now()-t0)/1000):0;\n const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');\n function showBest(){ const b=store.get('nono.best.'+N); $('best').textContent = b===null||b===undefined?'\\u2014':fmt(b); }\n function startClock(){\n   if(started) return;\n   started=true; t0=Date.now();\n   tick=setInterval(()=>{ if(!solved) $('time').textContent=fmt(elapsed()); },500);\n }\n\n /* drag painting: the mode is decided by the first cell you touch, then held for\n    the whole stroke, so sweeping across a row never toggles cells back and forth */\n let painting=null;\n function apply(i,mode){\n   if(solved) return;\n   if(marks[i]===mode) return;\n   marks[i]=mode; startClock(); paint(); check();\n }\n function cellFrom(e){\n   const el=document.elementFromPoint(e.clientX,e.clientY);\n   if(!el||!el.classList||!el.classList.contains('cell')) return -1;\n   return +el.dataset.i;\n }\n $('cells').addEventListener('pointerdown',e=>{\n   if(solved) return;\n   const el=e.target.closest?e.target.closest('.cell'):null;\n   if(!el) return;\n   e.preventDefault();\n   const i=+el.dataset.i;\n   const right = e.button===2 || e.ctrlKey || e.metaKey;\n   const cur=marks[i];\n   painting = right ? (cur===2?0:2) : (cur===1?0:1);\n   apply(i,painting);\n   try{ $('cells').setPointerCapture(e.pointerId); }catch(_){}\n });\n $('cells').addEventListener('pointermove',e=>{\n   if(painting===null) return;\n   const i=cellFrom(e);\n   if(i>=0) apply(i,painting);\n });\n const stop=()=>{ painting=null; };\n $('cells').addEventListener('pointerup',stop);\n $('cells').addEventListener('pointercancel',stop);\n window.addEventListener('pointerup',stop);\n $('cells').addEventListener('contextmenu',e=>e.preventDefault());\n\n /* ---------------- shell ---------------- */\n function newPuzzle(){\n   clearInterval(tick);\n   started=false; solved=false; $('time').textContent='0:00';\n   $('won').classList.add('hidden');\n   let p=build(N);\n   if(!p){ N=10; p=build(10); }\n   sol=p.g; rowClues=p.rc; colClues=p.cc;\n   marks=new Array(N*N).fill(0);\n   showBest(); render();\n }\n function setSize(n){\n   N=n;\n   $('s10').setAttribute('aria-pressed',String(n===10));\n   $('s15').setAttribute('aria-pressed',String(n===15));\n   newPuzzle();\n }\n $('s10').addEventListener('click',()=>setSize(10));\n $('s15').addEventListener('click',()=>setSize(15));\n $('newp').addEventListener('click',newPuzzle);\n $('again').addEventListener('click',newPuzzle);\n setSize(10);\n" },
  "blockfit": { css: "\n :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.58);--line:rgba(255,255,255,.14);\n   --hole:rgba(255,255,255,.045);--band:rgba(255,255,255,.075);\n   --sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n *{box-sizing:border-box}\n body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n .wrap{width:100%;max-width:640px;margin:0 auto;position:relative}\n header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}\n h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}\n .hud{display:flex;gap:16px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n .hud b{display:block;font-family:var(--mono);font-size:22px;color:var(--ink);letter-spacing:0;margin-top:1px}\n .hud .dim b{color:var(--muted);font-size:18px}\n\n .area{display:flex;gap:22px;align-items:flex-start;justify-content:center}\n .left{flex:none}\n .side{width:176px;flex:none;display:flex;flex-direction:column;gap:11px;text-align:left}\n .lab{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}\n\n /* the 3x3 boxes are banded rather than outlined — clearer at small sizes */\n .board{display:grid;grid-template-columns:repeat(9,34px);grid-template-rows:repeat(9,34px);\n   gap:2px;padding:5px;border-radius:12px;background:rgba(255,255,255,.03);touch-action:none}\n .sq{border-radius:4px;background:var(--hole);position:relative;transition:background .09s}\n .sq.band{background:var(--band)}\n .sq.on{box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}\n .sq.ghost{outline:2px solid rgba(255,255,255,.6);outline-offset:-2px}\n .sq.bad{outline:2px solid rgba(255,77,110,.75);outline-offset:-2px}\n .sq.pop{animation:pop .26s ease}\n @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22);filter:brightness(1.7)}100%{transform:scale(1)}}\n\n .tray{display:flex;flex-direction:column;gap:8px}\n .piece{border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.04);\n   padding:9px;cursor:pointer;display:grid;place-items:center;min-height:62px;transition:background .14s,border-color .14s}\n .piece:hover{background:rgba(255,255,255,.1)}\n .piece.sel{border-color:#fff;background:rgba(255,255,255,.15)}\n .piece.used{opacity:.2;pointer-events:none}\n .piece.stuck{border-color:rgba(255,77,110,.5)}\n .pgrid{display:grid;gap:2px}\n .pc{width:13px;height:13px;border-radius:3px}\n .pc.e{background:transparent}\n\n .combo{min-height:17px;font-size:12px;font-weight:800;color:#8dff5a;letter-spacing:.02em}\n button{font:inherit;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.06);\n   border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700}\n button:hover{background:rgba(255,255,255,.13)}\n button.primary{background:linear-gradient(135deg,#ffc23d,#8dff5a);color:#182b06;border-color:transparent;padding:11px 26px;font-size:14px}\n button:focus-visible{outline:2px solid #fff;outline-offset:2px}\n .note{margin:0;font-size:11px;color:var(--muted);font-weight:600;line-height:1.55}\n\n .over{position:absolute;inset:-8px;display:grid;place-items:center;text-align:center;\n   background:rgba(10,10,26,.88);border-radius:18px;z-index:5}\n .over.hidden{display:none}\n .over h2{margin:0 0 6px;font-size:28px;font-weight:800}\n .over p{margin:0 0 16px;font-size:14px;color:var(--muted);font-weight:650}\n\n .hint{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:14px;line-height:1.6;text-align:center}\n .hint b{color:var(--ink)}\n\n @media (max-width:700px){\n   .area{flex-direction:column;align-items:center}\n   .side{width:min(92vw,320px)}\n   .tray{flex-direction:row}\n   .piece{flex:1;min-height:58px}\n   .board{grid-template-columns:repeat(9,min(9vw,34px));grid-template-rows:repeat(9,min(9vw,34px))}\n }\n", body: "<main class=\"wrap\">\n <header>\n  <h1>Block Fit</h1>\n  <div class=\"hud\">\n   <span>Score <b id=\"score\">0</b></span>\n   <span class=\"dim\">Best <b id=\"best\">0</b></span>\n  </div>\n </header>\n\n <div class=\"area\">\n  <div class=\"left\">\n   <div class=\"board\" id=\"board\"></div>\n  </div>\n  <div class=\"side\">\n   <div class=\"lab\">Next three</div>\n   <div class=\"tray\" id=\"tray\"></div>\n   <div class=\"combo\" id=\"combo\">&nbsp;</div>\n   <button type=\"button\" id=\"restart\">New game</button>\n   <p class=\"note\">No timer, no gravity. Every piece has to go somewhere, so think two moves ahead.</p>\n  </div>\n </div>\n\n <div class=\"over hidden\" id=\"over\">\n  <div>\n   <h2>No room left</h2>\n   <p id=\"overSub\">&nbsp;</p>\n   <button type=\"button\" id=\"again\" class=\"primary\">Play again</button>\n  </div>\n </div>\n\n <p class=\"hint\">Tap a piece, then tap the board to drop it. Fill a <b>row</b>, a <b>column</b> or a <b>3&times;3 box</b> to clear it &mdash; clear several at once for a combo.</p>\n</main>\n", js: "\n 'use strict';\n const $=id=>document.getElementById(id);\n const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n   return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n   catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n\n const N=9;\n const COLOURS=['#31e1ff','#8dff5a','#ffc23d','#ff7ae0','#9b5cff','#ff7a4d','#4d9dff'];\n\n /* Shapes as [row,col] offsets. Weight decides how often each is dealt: the\n    single square is a get-out-of-jail card, so it stays rare, and the 3x3 block\n    is brutal late on, so it stays rare too. */\n const SHAPES=[\n   {w:2,  c:[[0,0]]},\n   {w:9,  c:[[0,0],[0,1]]},\n   {w:9,  c:[[0,0],[1,0]]},\n   {w:8,  c:[[0,0],[0,1],[0,2]]},\n   {w:8,  c:[[0,0],[1,0],[2,0]]},\n   {w:4,  c:[[0,0],[0,1],[0,2],[0,3]]},\n   {w:4,  c:[[0,0],[1,0],[2,0],[3,0]]},\n   {w:2,  c:[[0,0],[0,1],[0,2],[0,3],[0,4]]},\n   {w:2,  c:[[0,0],[1,0],[2,0],[3,0],[4,0]]},\n   {w:8,  c:[[0,0],[0,1],[1,0],[1,1]]},\n   {w:6,  c:[[0,0],[1,0],[1,1]]},\n   {w:6,  c:[[0,1],[1,0],[1,1]]},\n   {w:6,  c:[[0,0],[0,1],[1,0]]},\n   {w:6,  c:[[0,0],[0,1],[1,1]]},\n   {w:4,  c:[[0,0],[1,0],[2,0],[2,1]]},\n   {w:4,  c:[[0,1],[1,1],[2,0],[2,1]]},\n   {w:4,  c:[[0,0],[0,1],[0,2],[1,0]]},\n   {w:4,  c:[[0,0],[0,1],[0,2],[1,2]]},\n   {w:4,  c:[[0,0],[0,1],[1,1],[1,2]]},\n   {w:4,  c:[[0,1],[0,2],[1,0],[1,1]]},\n   {w:4,  c:[[0,0],[0,1],[0,2],[1,1]]},\n   {w:3,  c:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]]},\n   {w:3,  c:[[0,0],[0,1],[1,0],[1,1],[2,0],[2,1]]},\n   {w:2,  c:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]]}\n ];\n const BAG=[]; SHAPES.forEach((s,i)=>{ for(let k=0;k<s.w;k++) BAG.push(i); });\n\n let grid, cells, hand, sel, score, best, over, hoverAt;\n best=store.get('blockfit.best')||0;\n\n const boxBand=(r,c)=>((Math.floor(r/3)+Math.floor(c/3))%2)===0;\n\n function buildBoard(){\n   const b=$('board'); b.innerHTML=''; cells=[];\n   for(let i=0;i<N*N;i++){\n     const r=Math.floor(i/N), c=i%N;\n     const d=document.createElement('div');\n     d.className='sq'+(boxBand(r,c)?' band':'');\n     d.dataset.i=i;\n     b.appendChild(d); cells.push(d);\n   }\n }\n\n function deal(){\n   hand=[];\n   for(let k=0;k<3;k++){\n     const s=SHAPES[BAG[Math.random()*BAG.length|0]];\n     hand.push({cells:s.c, colour:COLOURS[Math.random()*COLOURS.length|0], used:false});\n   }\n   sel=null;\n   drawTray();\n }\n\n function shapeBox(cs){\n   let mr=0,mc=0; for(const [r,c] of cs){ if(r>mr)mr=r; if(c>mc)mc=c; }\n   return [mr+1,mc+1];\n }\n function drawTray(){\n   const t=$('tray'); t.innerHTML='';\n   hand.forEach((p,i)=>{\n     const el=document.createElement('div');\n     el.className='piece'+(p.used?' used':'')+(sel===i?' sel':'')+(!p.used&&!canPlaceAnywhere(p)?' stuck':'');\n     el.dataset.i=i;\n     const [rows,colsN]=shapeBox(p.cells);\n     const g=document.createElement('div');\n     g.className='pgrid';\n     g.style.gridTemplateColumns='repeat('+colsN+',13px)';\n     const set=new Set(p.cells.map(([r,c])=>r*10+c));\n     for(let r=0;r<rows;r++)for(let c=0;c<colsN;c++){\n       const d=document.createElement('div');\n       const on=set.has(r*10+c);\n       d.className='pc'+(on?'':' e');\n       if(on) d.style.background=p.colour;\n       g.appendChild(d);\n     }\n     el.appendChild(g);\n     el.addEventListener('click',()=>{ if(p.used) return; sel=(sel===i?null:i); drawTray(); });\n     t.appendChild(el);\n   });\n }\n\n function fits(p,r0,c0){\n   for(const [dr,dc] of p.cells){\n     const r=r0+dr, c=c0+dc;\n     if(r<0||c<0||r>=N||c>=N) return false;\n     if(grid[r*N+c]) return false;\n   }\n   return true;\n }\n function canPlaceAnywhere(p){\n   const [rows,colsN]=shapeBox(p.cells);\n   for(let r=0;r<=N-rows;r++)for(let c=0;c<=N-colsN;c++) if(fits(p,r,c)) return true;\n   return false;\n }\n\n function place(p,r0,c0){\n   for(const [dr,dc] of p.cells) grid[(r0+dr)*N+(c0+dc)]=p.colour;\n   score+=p.cells.length;\n   const cleared=clearLines();\n   if(cleared){\n     // 1 line = 18, 2 = 54, 3 = 108... clearing several at once is where the\n     // score actually comes from, which is what makes setting them up worth it\n     score += 9*cleared*(cleared+1);\n     $('combo').textContent = cleared===1 ? 'Line clear +18'\n       : cleared+' at once  +'+(9*cleared*(cleared+1))+'!';\n   } else $('combo').innerHTML='&nbsp;';\n   p.used=true; sel=null;\n   if(hand.every(x=>x.used)) deal();\n   sync(); paint(); drawTray();\n   checkDead();\n }\n\n function clearLines(){\n   const full=new Set();\n   for(let r=0;r<N;r++){ let f=true; for(let c=0;c<N;c++) if(!grid[r*N+c]){f=false;break;}\n     if(f) for(let c=0;c<N;c++) full.add(r*N+c); }\n   for(let c=0;c<N;c++){ let f=true; for(let r=0;r<N;r++) if(!grid[r*N+c]){f=false;break;}\n     if(f) for(let r=0;r<N;r++) full.add(r*N+c); }\n   for(let br=0;br<3;br++)for(let bc=0;bc<3;bc++){\n     let f=true;\n     for(let r=0;r<3&&f;r++)for(let c=0;c<3;c++) if(!grid[(br*3+r)*N+(bc*3+c)]){f=false;break;}\n     if(f) for(let r=0;r<3;r++)for(let c=0;c<3;c++) full.add((br*3+r)*N+(bc*3+c));\n   }\n   if(!full.size) return 0;\n   // count how many distinct lines went, not how many squares\n   let lines=0;\n   for(let r=0;r<N;r++){ let f=true; for(let c=0;c<N;c++) if(!grid[r*N+c]){f=false;break;} if(f) lines++; }\n   for(let c=0;c<N;c++){ let f=true; for(let r=0;r<N;r++) if(!grid[r*N+c]){f=false;break;} if(f) lines++; }\n   for(let br=0;br<3;br++)for(let bc=0;bc<3;bc++){\n     let f=true;\n     for(let r=0;r<3&&f;r++)for(let c=0;c<3;c++) if(!grid[(br*3+r)*N+(bc*3+c)]){f=false;break;}\n     if(f) lines++;\n   }\n   for(const i of full){ grid[i]=0; cells[i].classList.add('pop'); }\n   setTimeout(()=>{ for(const i of full) cells[i].classList.remove('pop'); },280);\n   return lines;\n }\n\n function checkDead(){\n   const live=hand.filter(p=>!p.used);\n   if(live.some(canPlaceAnywhere)) return;\n   over=true;\n   if(score>best){ best=score; store.set('blockfit.best',best); }\n   $('overSub').textContent='Score '+score+(score>=best?'  \\u00b7  new best':'  \\u00b7  best '+best);\n   $('over').classList.remove('hidden');\n   sync();\n }\n\n function sync(){ $('score').textContent=score; $('best').textContent=best; }\n function paint(){\n   for(let i=0;i<N*N;i++){\n     const r=Math.floor(i/N), c=i%N, el=cells[i];\n     const keepPop=el.classList.contains('pop');\n     el.className='sq'+(boxBand(r,c)?' band':'')+(grid[i]?' on':'')+(keepPop?' pop':'');\n     el.style.background = grid[i] || '';\n   }\n   if(hoverAt!==null&&hoverAt!==undefined&&sel!==null&&!over){\n     const p=hand[sel];\n     const r0=Math.floor(hoverAt/N), c0=hoverAt%N;\n     const ok=fits(p,r0,c0);\n     for(const [dr,dc] of p.cells){\n       const r=r0+dr, c=c0+dc;\n       if(r<0||c<0||r>=N||c>=N) continue;\n       cells[r*N+c].classList.add(ok?'ghost':'bad');\n       if(ok) cells[r*N+c].style.background=p.colour+'66';\n     }\n   }\n }\n\n $('board').addEventListener('pointermove',e=>{\n   const el=e.target.closest?e.target.closest('.sq'):null;\n   const i=el?+el.dataset.i:null;\n   if(i===hoverAt) return;\n   hoverAt=i; paint();\n });\n $('board').addEventListener('pointerleave',()=>{ hoverAt=null; paint(); });\n $('board').addEventListener('click',e=>{\n   if(over||sel===null) return;\n   const el=e.target.closest?e.target.closest('.sq'):null;\n   if(!el) return;\n   const i=+el.dataset.i, r=Math.floor(i/N), c=i%N;\n   const p=hand[sel];\n   if(!fits(p,r,c)) return;\n   hoverAt=null;\n   place(p,r,c);\n });\n\n function reset(){\n   grid=new Array(N*N).fill(0);\n   score=0; over=false; hoverAt=null;\n   $('over').classList.add('hidden'); $('combo').innerHTML='&nbsp;';\n   buildBoard(); deal(); sync(); paint();\n }\n $('restart').addEventListener('click',reset);\n $('again').addEventListener('click',reset);\n reset();\n" },
  "ultimate": { css: "\n :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.58);--line:rgba(255,255,255,.14);\n   --x:#ff4d9d;--o:#31e1ff;\n   --sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n *{box-sizing:border-box}\n body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n .wrap{width:100%;max-width:660px;margin:0 auto}\n header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:8px}\n h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}\n .modes{display:flex;gap:7px;flex:none}\n button{font:inherit;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.06);\n   border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;\n   transition:background .15s,transform .1s}\n button:hover{background:rgba(255,255,255,.13)}\n button:active{transform:scale(.96)}\n button[aria-pressed=\"true\"]{background:#f2f2f2;color:#0a0a1a;border-color:#fff}\n button:focus-visible{outline:2px solid #fff;outline-offset:2px}\n .status{margin:0 0 12px;font-size:15px;font-weight:700;min-height:21px}\n\n .area{display:flex;gap:22px;align-items:flex-start;justify-content:center}\n .side{width:168px;flex:none;display:flex;flex-direction:column;gap:10px;text-align:left}\n .side button{width:100%}\n .lab{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}\n .score{display:flex;gap:7px}\n .s{flex:1;border:1px solid var(--line);border-radius:11px;padding:8px 4px;text-align:center;background:rgba(255,255,255,.035)}\n .k{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n .v{display:block;font-family:var(--mono);font-size:21px;font-weight:800;margin-top:2px}\n .v.x{color:var(--x)} .v.o{color:var(--o)}\n .note{margin:0;font-size:11px;color:var(--muted);font-weight:600;line-height:1.55}\n\n /* mega board: nine small boards, gapped enough that they read as separate */\n .mega{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:396px;flex:none;\n   padding:7px;border-radius:14px;background:rgba(255,255,255,.03)}\n .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:5px;border-radius:9px;\n   background:rgba(255,255,255,.035);position:relative;transition:background .18s,box-shadow .18s}\n .mini.live{background:rgba(255,255,255,.11);box-shadow:0 0 0 2px rgba(255,255,255,.5)}\n .mini.done{background:rgba(255,255,255,.02)}\n .cell{aspect-ratio:1;border:0;padding:0;border-radius:5px;background:rgba(255,255,255,.05);\n   cursor:pointer;font-family:var(--sans);font-size:22px;font-weight:300;line-height:1;\n   display:grid;place-items:center;transition:background .1s}\n .mini.live .cell:hover:not(:disabled){background:rgba(255,255,255,.2)}\n .cell:disabled{cursor:default}\n .cell.x{color:var(--x);text-shadow:0 0 14px rgba(255,77,157,.6)}\n .cell.o{color:var(--o);text-shadow:0 0 14px rgba(49,225,255,.6)}\n .cell.last{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}\n\n /* a claimed board gets a big translucent mark laid over the top */\n .claim{position:absolute;inset:0;display:grid;place-items:center;font-size:74px;font-weight:250;\n   line-height:1;pointer-events:none;border-radius:9px}\n .claim.x{color:var(--x);background:rgba(255,77,157,.14)}\n .claim.o{color:var(--o);background:rgba(49,225,255,.14)}\n .claim.d{color:var(--muted);background:rgba(255,255,255,.05);font-size:34px}\n\n .hint{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:14px;line-height:1.6;text-align:center}\n .hint b{color:var(--ink)}\n\n @media (max-width:700px){\n   .area{flex-direction:column;align-items:center}\n   .mega{width:min(94vw,396px)}\n   .side{width:min(94vw,396px)}\n   .note{text-align:center}\n }\n", body: "<main class=\"wrap\">\n <header>\n  <h1>Nine Boards</h1>\n  <div class=\"modes\" role=\"group\" aria-label=\"Mode\">\n   <button type=\"button\" id=\"mai\" aria-pressed=\"true\">vs AI</button>\n   <button type=\"button\" id=\"m2p\" aria-pressed=\"false\">2P</button>\n  </div>\n </header>\n\n <p class=\"status\" id=\"status\">Your move &mdash; play anywhere</p>\n\n <div class=\"area\">\n  <div class=\"mega\" id=\"mega\"></div>\n  <div class=\"side\">\n   <div class=\"lab\">Score</div>\n   <div class=\"score\">\n    <div class=\"s\"><span class=\"k\" id=\"kx\">You</span><span class=\"v x\" id=\"sx\">0</span></div>\n    <div class=\"s\"><span class=\"k\">Draws</span><span class=\"v\" id=\"sd\">0</span></div>\n    <div class=\"s\"><span class=\"k\" id=\"ko\">AI</span><span class=\"v o\" id=\"so\">0</span></div>\n   </div>\n   <button type=\"button\" id=\"newg\">New game</button>\n   <button type=\"button\" id=\"reset\">Reset score</button>\n   <p class=\"note\">The square you play in decides which board your opponent must play in next. Send them somewhere useless.</p>\n  </div>\n </div>\n\n <p class=\"hint\">Win a small board to claim it. Claim <b>three small boards in a line</b> to win the match. A highlighted board is the only one in play.</p>\n</main>\n", js: "\n 'use strict';\n const $=id=>document.getElementById(id);\n const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n   return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n   catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n\n const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];\n const MARK={1:'\\u2715',2:'\\u25ef'};\n\n let mode='ai';            // 'ai' | '2p'\n let cell,                 // 81 squares: 0 empty, 1 = X, 2 = O\n     won,                  // per small board: 0 open, 1 X, 2 O, 3 drawn\n     turn, forced, over, lastMove, thinking;\n let score={x:0,o:0,d:0};\n score=store.get('nine.score')||score;\n\n /* ---------------- board helpers ---------------- */\n const idx=(b,c)=>b*9+c;\n function winnerOf(nine){\n   for(const [a,b,c] of LINES) if(nine[a]&&nine[a]===nine[b]&&nine[a]===nine[c]) return nine[a];\n   return nine.every(v=>v)?3:0;\n }\n function boardArr(b){ return cell.slice(b*9,b*9+9); }\n function legal(){\n   const out=[];\n   for(let b=0;b<9;b++){\n     if(won[b]) continue;\n     if(forced!==null && forced!==b) continue;\n     for(let c=0;c<9;c++) if(!cell[idx(b,c)]) out.push([b,c]);\n   }\n   return out;\n }\n function apply(b,c,who){\n   cell[idx(b,c)]=who;\n   const w=winnerOf(boardArr(b));\n   if(w) won[b]=w;\n   forced = won[c] ? null : c;      // sent to a finished board? play anywhere\n   lastMove=idx(b,c);\n }\n function matchWinner(){\n   const meta=won.map(v=>v===3?0:v);\n   for(const [a,b,c] of LINES) if(meta[a]&&meta[a]===meta[b]&&meta[a]===meta[c]) return meta[a];\n   if(won.every(v=>v)) {\n     const x=won.filter(v=>v===1).length, o=won.filter(v=>v===2).length;\n     return x>o?1:o>x?2:3;\n   }\n   return 0;\n }\n\n /* ---------------- the computer ----------------\n    Negamax with alpha-beta over the whole nine-board position. The evaluation is\n    what does the real work: owning a small board is worth a lot, owning the\n    centre board more, and handing your opponent a free choice of board is a\n    genuine cost — that last term is the whole strategy of this game. */\n const BW=[1.4,1.0,1.4, 1.0,1.75,1.0, 1.4,1.0,1.4];   // corner and centre boards matter most\n function lineScore(v,me,opp){\n   let s=0;\n   for(const [a,b,c] of LINES){\n     const t=[v[a],v[b],v[c]];\n     const m=t.filter(x=>x===me).length, o=t.filter(x=>x===opp).length;\n     if(m&&o) continue;\n     if(m===2) s+=6; else if(m===1) s+=1;\n     if(o===2) s-=6; else if(o===1) s-=1;\n   }\n   return s;\n }\n function evaluate(me){\n   const opp=me===1?2:1;\n   let s=0;\n   const meta=won.map(v=>v===3?0:v);\n   for(let b=0;b<9;b++){\n     if(won[b]===me) s+=55*BW[b];\n     else if(won[b]===opp) s-=55*BW[b];\n     else if(!won[b]) s+=lineScore(boardArr(b),me,opp)*BW[b]*0.9;\n   }\n   s+=lineScore(meta,me,opp)*22;\n   if(forced===null) s-= (turn===me? 0 : 14);     // a free choice is worth something\n   return s;\n }\n let deadline=0, nodes=0;\n function negamax(depth, alpha, beta, me){\n   if((++nodes & 511)===0 && performance.now()>deadline) throw 'timeup';\n   const w=matchWinner();\n   if(w===me) return 100000+depth;\n   if(w && w!==3) return -100000-depth;\n   if(w===3) return 0;\n   if(depth===0) return evaluate(me);\n   const moves=legal();\n   if(!moves.length) return 0;\n   // try the middles first — better ordering means deeper search in the same time\n   moves.sort((p,q)=>(q[1]===4?1:0)-(p[1]===4?1:0));\n   let best=-Infinity;\n   for(const [b,c] of moves){\n     const savedWon=won[b], savedForced=forced, savedLast=lastMove;\n     const who=turn;\n     apply(b,c,who);\n     turn = who===1?2:1;\n     const v=-negamax(depth-1,-beta,-alpha, me===1?2:1);\n     cell[idx(b,c)]=0; won[b]=savedWon; forced=savedForced; lastMove=savedLast; turn=who;\n     if(v>best) best=v;\n     if(best>alpha) alpha=best;\n     if(alpha>=beta) break;\n   }\n   return best;\n }\n function aiMove(){\n   const me=turn;\n   const moves=legal();\n   if(!moves.length) return null;\n   let bestMove=moves[0], bestVal=-Infinity, localSecond=null;\n   // 600ms buys one more ply, which is the difference between the computer\n   // losing three games in four and it being an even match. The status line says\n   // \"Thinking\" while it does, so the wait reads as deliberate rather than slow.\n   deadline=performance.now()+600;\n   nodes=0;\n   for(let depth=2; depth<=8; depth++){\n     let localBest=null, localVal=-Infinity, aborted=false;\n     try{\n       localSecond=null; let secondVal=-Infinity;\n       for(const [b,c] of moves){\n         if(performance.now()>deadline){ aborted=true; break; }\n         const savedWon=won[b], savedForced=forced, savedLast=lastMove;\n         apply(b,c,me);\n         turn = me===1?2:1;\n         let v;\n         try{ v=-negamax(depth-1,-Infinity,Infinity, me===1?2:1); }\n         finally{ cell[idx(b,c)]=0; won[b]=savedWon; forced=savedForced; lastMove=savedLast; turn=me; }\n         if(v>localVal){ secondVal=localVal; localSecond=localBest; localVal=v; localBest=[b,c]; }\n         else if(v>secondVal){ secondVal=v; localSecond=[b,c]; }\n       }\n     }catch(e){ if(e!=='timeup') throw e; aborted=true; }\n     if(localBest && !aborted){ bestMove=localBest; bestVal=localVal; }\n     if(performance.now()>deadline) break;\n     if(bestVal>90000) break;                      // forced win found, stop looking\n   }\n   return bestMove;\n }\n\n /* ---------------- rendering ---------------- */\n let miniEls=[], cellEls=[];\n function build(){\n   const m=$('mega'); m.innerHTML=''; miniEls=[]; cellEls=[];\n   for(let b=0;b<9;b++){\n     const mini=document.createElement('div');\n     mini.className='mini';\n     for(let c=0;c<9;c++){\n       const btn=document.createElement('button');\n       btn.type='button'; btn.className='cell';\n       btn.dataset.b=b; btn.dataset.c=c;\n       btn.setAttribute('aria-label','board '+(b+1)+' square '+(c+1));\n       btn.addEventListener('click',()=>play(b,c));\n       mini.appendChild(btn); cellEls.push(btn);\n     }\n     const claim=document.createElement('div');\n     claim.className='claim'; claim.style.display='none';\n     mini.appendChild(claim);\n     m.appendChild(mini); miniEls.push(mini);\n   }\n }\n function paint(){\n   const playable=new Set(legal().map(([b,c])=>idx(b,c)));\n   for(let b=0;b<9;b++){\n     const mini=miniEls[b];\n     mini.className='mini'+(won[b]?' done':'')+((!over && !won[b] && (forced===null||forced===b))?' live':'');\n     const claim=mini.querySelector('.claim');\n     if(won[b]){\n       claim.style.display='grid';\n       claim.className='claim '+(won[b]===1?'x':won[b]===2?'o':'d');\n       claim.textContent = won[b]===3 ? 'DRAW' : MARK[won[b]];\n     } else claim.style.display='none';\n     for(let c=0;c<9;c++){\n       const v=cell[idx(b,c)], el=cellEls[idx(b,c)];\n       el.textContent = v?MARK[v]:'';\n       el.className='cell'+(v===1?' x':v===2?' o':'')+(idx(b,c)===lastMove?' last':'');\n       el.disabled = over || thinking || !playable.has(idx(b,c));\n     }\n   }\n   $('sx').textContent=score.x; $('so').textContent=score.o; $('sd').textContent=score.d;\n   $('kx').textContent = mode==='ai'?'You':'X';\n   $('ko').textContent = mode==='ai'?'AI':'O';\n }\n function say(t){ $('status').textContent=t; }\n\n /* ---------------- play ---------------- */\n function play(b,c){\n   if(over||thinking) return;\n   if(!legal().some(([bb,cc])=>bb===b&&cc===c)) return;\n   const who=turn;\n   apply(b,c,who);\n   turn = who===1?2:1;\n   if(finish()) return;\n   paint();\n   if(mode==='ai' && turn===2){\n     thinking=true; paint(); say('Thinking\\u2026');\n     setTimeout(()=>{\n       const mv=aiMove();\n       thinking=false;\n       if(mv){ apply(mv[0],mv[1],2); turn=1; }\n       if(finish()) return;\n       paint(); prompt();\n     },60);\n   } else prompt();\n }\n function prompt(){\n   const who = turn===1?'X':'O';\n   const whose = mode==='ai' ? (turn===1?'Your move':'AI') : ('Player '+who);\n   say(whose + (forced===null ? ' \\u2014 play in any open board' : ' \\u2014 must play in the highlighted board'));\n }\n function finish(){\n   const w=matchWinner();\n   if(!w) return false;\n   over=true;\n   if(w===1) score.x++; else if(w===2) score.o++; else score.d++;\n   store.set('nine.score',score);\n   paint();\n   say(w===3 ? 'Drawn match' : (mode==='ai' ? (w===1?'You win the match':'The AI wins') : ('Player '+(w===1?'X':'O')+' wins')));\n   return true;\n }\n\n function newGame(){\n   cell=new Array(81).fill(0);\n   won=new Array(9).fill(0);\n   turn=1; forced=null; over=false; lastMove=-1; thinking=false;\n   paint(); prompt();\n }\n function setMode(m){\n   mode=m;\n   $('mai').setAttribute('aria-pressed',String(m==='ai'));\n   $('m2p').setAttribute('aria-pressed',String(m==='2p'));\n   newGame();\n }\n $('mai').addEventListener('click',()=>setMode('ai'));\n $('m2p').addEventListener('click',()=>setMode('2p'));\n $('newg').addEventListener('click',newGame);\n $('reset').addEventListener('click',()=>{ score={x:0,o:0,d:0}; store.set('nine.score',score); paint(); });\n\n build();\n setMode('ai');\n" },
  "bubbles": { css: "\n :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.58);--line:rgba(255,255,255,.14);\n   --sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n *{box-sizing:border-box}\n body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n .wrap{width:100%;max-width:430px;text-align:center;margin:0 auto}\n header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}\n h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}\n .hud{display:flex;gap:14px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right}\n .hud b{display:block;font-family:var(--mono);font-size:20px;color:var(--ink);letter-spacing:0}\n .hud .dim b{color:var(--muted);font-size:16px}\n\n .rowbar{display:flex;align-items:center;gap:9px;margin-bottom:8px}\n .tag{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}\n .pips{display:flex;gap:4px;flex:1}\n .pip{height:5px;flex:1;border-radius:3px;background:rgba(255,255,255,.1)}\n .pip.on{background:linear-gradient(90deg,#ffc23d,#ff4d6d)}\n\n canvas{display:block;width:100%;aspect-ratio:1000/1120;border-radius:14px;\n   background:radial-gradient(120% 80% at 50% 0%,#1a1638 0%,#0b0a1c 70%);\n   touch-action:none;cursor:crosshair}\n .hint{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.55}\n .hint b{color:var(--ink)}\n", body: "<main class=\"wrap\">\n <header>\n  <h1>Bubble Pop</h1>\n  <div class=\"hud\">\n   <span>Score <b id=\"score\">0</b></span>\n   <span class=\"dim\">Best <b id=\"best\">0</b></span>\n  </div>\n </header>\n <div class=\"rowbar\">\n  <span class=\"tag\">Shots until the ceiling drops</span>\n  <div class=\"pips\" id=\"pips\"></div>\n </div>\n <canvas id=\"c\" width=\"1000\" height=\"1120\"></canvas>\n <p class=\"hint\">Aim with the mouse or <b>&larr; &rarr;</b>, fire with <b>click</b> or <b>Space</b>. Three touching bubbles of a colour pop &mdash; anything left hanging falls too, and falling bubbles are worth double.</p>\n</main>\n", js: "\n 'use strict';\n const $=id=>document.getElementById(id);\n const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n   return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n   catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n\n const cv=$('c'), ctx=cv.getContext('2d');\n const W=cv.width, H=cv.height;\n const COLS=12, R=W/(COLS*2), RH=R*Math.sqrt(3);   // R = bubble radius, RH = row pitch\n const ROWS=Math.floor((H-R*4)/RH);\n const DEADLINE=ROWS-2;                             // reach this row and it is over\n const DROP_EVERY=6;                                // shots between ceiling drops\n const PALETTE=['#ff4d6d','#31e1ff','#8dff5a','#ffc23d','#c07aff','#ff8ad4'];\n\n // odd rows are offset half a bubble, which is what makes the packing hexagonal\n const rowOffset=r=>(r%2)?R:0;\n const cellsIn=r=>(r%2)?COLS-1:COLS;\n const cx=(r,c)=>rowOffset(r)+R+c*2*R;\n const cy=r=>R+2+r*RH;\n\n let grid, shooter, flying, next, score, best, shots, over, won, raf, pops, aim, lastT;\n best=store.get('bubbles.best')||0;\n\n const key=(r,c)=>r+','+c;\n function get(r,c){ return (grid[r]&&grid[r][c]!==undefined)?grid[r][c]:null; }\n function neighbours(r,c){\n   const odd=r%2;\n   const out=[[r,c-1],[r,c+1],[r-1,c-(odd?0:1)],[r-1,c+(odd?1:0)],[r+1,c-(odd?0:1)],[r+1,c+(odd?1:0)]];\n   return out.filter(([rr,ccv])=>rr>=0&&rr<ROWS&&ccv>=0&&ccv<cellsIn(rr));\n }\n function liveColours(){\n   const s=new Set();\n   for(let r=0;r<ROWS;r++)for(let c=0;c<cellsIn(r);c++) if(grid[r][c]) s.add(grid[r][c]);\n   return s.size?[...s]:PALETTE.slice(0,3);\n }\n function pick(){ const l=liveColours(); return l[Math.random()*l.length|0]; }\n\n function reset(){\n   grid=[];\n   for(let r=0;r<ROWS;r++) grid.push(new Array(cellsIn(r)).fill(null));\n   const startRows=5, pal=PALETTE.slice(0,4);\n   for(let r=0;r<startRows;r++)\n     for(let c=0;c<cellsIn(r);c++)\n       grid[r][c]=pal[Math.random()*pal.length|0];\n   score=0; shots=0; over=false; won=false; pops=[]; flying=null; aim=-Math.PI/2;\n   shooter=pick(); next=pick();\n   sync(); lastT=0;\n   cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);\n }\n function sync(){\n   $('score').textContent=score; $('best').textContent=best;\n   const p=$('pips');\n   if(p.children.length!==DROP_EVERY){\n     p.innerHTML='';\n     for(let i=0;i<DROP_EVERY;i++){ const d=document.createElement('div'); d.className='pip'; p.appendChild(d); }\n   }\n   const used=shots%DROP_EVERY;\n   for(let i=0;i<DROP_EVERY;i++) p.children[i].classList.toggle('on', i<used);\n }\n\n /* ---------------- firing ---------------- */\n function fire(){\n   if(over||flying) return;\n   const a=Math.max(-Math.PI+0.28, Math.min(-0.28, aim));\n   flying={x:W/2, y:H-R*2.4, vx:Math.cos(a)*R*0.95, vy:Math.sin(a)*R*0.95, col:shooter};\n   shooter=next; next=pick();\n }\n // walk the flying bubble forward in small steps so it can never tunnel through\n function stepFly(){\n   for(let i=0;i<8 && flying;i++){\n     flying.x+=flying.vx/8; flying.y+=flying.vy/8;\n     if(flying.x<R){ flying.x=R; flying.vx=Math.abs(flying.vx); }\n     if(flying.x>W-R){ flying.x=W-R; flying.vx=-Math.abs(flying.vx); }\n     if(flying.y<R+2){ snap(); return; }\n     for(let r=0;r<ROWS;r++)for(let c=0;c<cellsIn(r);c++){\n       if(!grid[r][c]) continue;\n       const dx=flying.x-cx(r,c), dy=flying.y-cy(r);\n       if(dx*dx+dy*dy < (R*1.86)*(R*1.86)){ snap(); return; }\n     }\n   }\n }\n function snap(){\n   // drop it into the nearest free cell\n   let bestR=0,bestC=0,bd=Infinity;\n   for(let r=0;r<ROWS;r++)for(let c=0;c<cellsIn(r);c++){\n     if(grid[r][c]) continue;\n     if(r>0 && !neighbours(r,c).some(([rr,cc])=>grid[rr][cc])) continue;  // must touch something\n     const d=(flying.x-cx(r,c))**2+(flying.y-cy(r))**2;\n     if(d<bd){ bd=d; bestR=r; bestC=c; }\n   }\n   grid[bestR][bestC]=flying.col;\n   const col=flying.col;\n   flying=null;\n   shots++;\n   resolve(bestR,bestC,col);\n   if(!over && shots%DROP_EVERY===0) dropCeiling();\n   sync();\n }\n\n function resolve(r,c,col){\n   // 1. the cluster of matching colours the new bubble joined\n   const seen=new Set([key(r,c)]), stack=[[r,c]], group=[[r,c]];\n   while(stack.length){\n     const [a,b]=stack.pop();\n     for(const [nr,nc] of neighbours(a,b)){\n       if(seen.has(key(nr,nc))||grid[nr][nc]!==col) continue;\n       seen.add(key(nr,nc)); stack.push([nr,nc]); group.push([nr,nc]);\n     }\n   }\n   if(group.length<3){ checkLose(); return; }\n   for(const [a,b] of group){ burst(a,b,grid[a][b]); grid[a][b]=null; }\n   score+=group.length*10;\n\n   // 2. anything no longer hanging from the ceiling comes down with it\n   score+=dropFloaters()*20;\n   let empty=true;\n   for(let rr=0;rr<ROWS&&empty;rr++)for(let cc=0;cc<cellsIn(rr);cc++) if(grid[rr][cc]){ empty=false; break; }\n   if(empty){ score+=500; won=true; finish(); return; }\n   checkLose();\n }\n // Sweeping the field for bubbles with no path back to the ceiling. Called after\n // a pop, and again after the ceiling drops: shifting every row down flips the\n // hex stagger, which can quietly break a chain and leave bubbles floating.\n function dropFloaters(){\n   const anchored=new Set();\n   for(let cc=0;cc<cellsIn(0);cc++) if(grid[0][cc]) flood(0,cc,anchored);\n   let dropped=0;\n   for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<cellsIn(rr);cc++){\n     if(grid[rr][cc] && !anchored.has(key(rr,cc))){\n       burst(rr,cc,grid[rr][cc],true); grid[rr][cc]=null; dropped++;\n     }\n   }\n   return dropped;\n }\n function flood(r,c,seen){\n   const st=[[r,c]]; seen.add(key(r,c));\n   while(st.length){\n     const [a,b]=st.pop();\n     for(const [nr,nc] of neighbours(a,b)){\n       if(seen.has(key(nr,nc))||!grid[nr][nc]) continue;\n       seen.add(key(nr,nc)); st.push([nr,nc]);\n     }\n   }\n }\n function dropCeiling(){\n   for(let r=ROWS-1;r>0;r--){\n     for(let c=0;c<cellsIn(r);c++) grid[r][c] = c<cellsIn(r-1) ? grid[r-1][c] : null;\n   }\n   const pal=liveColours();\n   for(let c=0;c<cellsIn(0);c++) grid[0][c]=pal[Math.random()*pal.length|0];\n   dropFloaters();          // no score for these — the shift caused them, not the player\n   checkLose();\n }\n function checkLose(){\n   for(let c=0;c<cellsIn(DEADLINE);c++) if(grid[DEADLINE][c]){ over=true; finish(); return; }\n }\n function finish(){\n   over=true;\n   if(score>best){ best=score; store.set('bubbles.best',best); }\n   sync();\n }\n\n function burst(r,c,col,fall){\n   const x=cx(r,c), y=cy(r);\n   for(let i=0;i<(fall?4:7);i++){\n     const a=Math.random()*Math.PI*2, sp=1+Math.random()*4;\n     pops.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(fall?0:2),life:1,col});\n   }\n }\n\n /* ---------------- loop ---------------- */\n function loop(t){\n   raf=requestAnimationFrame(loop);\n   if(flying) stepFly();\n   for(let i=pops.length-1;i>=0;i--){\n     const p=pops[i];\n     p.x+=p.vx; p.y+=p.vy; p.vy+=0.45; p.life-=0.03;\n     if(p.life<=0) pops.splice(i,1);\n   }\n   draw();\n }\n\n function ball(c,x,y,col,r){\n   const g=c.createRadialGradient(x-r*0.34,y-r*0.38,r*0.12,x,y,r);\n   g.addColorStop(0,'#ffffff'); g.addColorStop(0.22,col); g.addColorStop(1,shade(col,-40));\n   c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill();\n }\n function shade(hex,amt){\n   const n=parseInt(hex.slice(1),16);\n   const cl=v=>Math.max(0,Math.min(255,v));\n   return '#'+[cl((n>>16)+amt),cl(((n>>8)&255)+amt),cl((n&255)+amt)]\n     .map(v=>v.toString(16).padStart(2,'0')).join('');\n }\n\n function draw(){\n   const c=ctx;\n   c.clearRect(0,0,W,H);\n\n   // danger line\n   const dy=cy(DEADLINE)-R;\n   c.strokeStyle=over?'rgba(255,77,110,.85)':'rgba(255,77,110,.4)';\n   c.setLineDash([14,12]); c.lineWidth=3;\n   c.beginPath(); c.moveTo(0,dy); c.lineTo(W,dy); c.stroke(); c.setLineDash([]);\n\n   for(let r=0;r<ROWS;r++)for(let cc=0;cc<cellsIn(r);cc++){\n     if(grid[r][cc]) ball(c,cx(r,cc),cy(r),grid[r][cc],R-1.5);\n   }\n\n   for(const p of pops){\n     c.globalAlpha=Math.max(0,p.life);\n     c.fillStyle=p.col;\n     c.beginPath(); c.arc(p.x,p.y,R*0.28,0,7); c.fill();\n   }\n   c.globalAlpha=1;\n\n   // aim guide, bounced once off the wall so the angles are readable\n   if(!over && !flying){\n     const a=Math.max(-Math.PI+0.28,Math.min(-0.28,aim));\n     let x=W/2, y=H-R*2.4, vx=Math.cos(a)*R*0.8, vy=Math.sin(a)*R*0.8, bounced=0;\n     c.strokeStyle='rgba(255,255,255,.32)'; c.lineWidth=3; c.setLineDash([9,13]);\n     c.beginPath(); c.moveTo(x,y);\n     for(let i=0;i<90;i++){\n       x+=vx; y+=vy;\n       if(x<R||x>W-R){ if(bounced++) break; vx=-vx; c.lineTo(x,y); }\n       if(y<R+2) break;\n       let hit=false;\n       for(let r=0;r<ROWS&&!hit;r++)for(let cc=0;cc<cellsIn(r);cc++){\n         if(!grid[r][cc]) continue;\n         if((x-cx(r,cc))**2+(y-cy(r))**2 < (R*1.86)**2){ hit=true; break; }\n       }\n       if(hit) break;\n       c.lineTo(x,y);\n     }\n     c.stroke(); c.setLineDash([]);\n   }\n\n   if(flying) ball(c,flying.x,flying.y,flying.col,R-1.5);\n\n   // launcher\n   const bx=W/2, by=H-R*2.4;\n   c.fillStyle='rgba(255,255,255,.09)';\n   c.beginPath(); c.arc(bx,by,R*2.1,0,7); c.fill();\n   if(!flying) ball(c,bx,by,shooter,R-1.5);\n   ball(c,bx+R*3.4,by+R*0.5,next,R*0.66);\n   c.fillStyle='rgba(246,243,255,.45)';\n   c.font='700 22px Outfit,system-ui,sans-serif'; c.textAlign='left';\n   c.fillText('next',bx+R*2.3,by-R*0.9);\n\n   if(over){\n     c.fillStyle='rgba(8,8,22,.82)'; c.fillRect(0,0,W,H);\n     c.textAlign='center'; c.fillStyle='#fff';\n     c.font='800 62px Outfit,system-ui,sans-serif';\n     c.fillText(won?'Board cleared':'Bubbles reached the line',W/2,H/2-20);\n     c.font='600 34px Outfit,system-ui,sans-serif'; c.fillStyle='rgba(255,255,255,.75)';\n     c.fillText('Score '+score+(score>=best?'  \\u00b7  new best':''),W/2,H/2+30);\n     c.font='600 28px Outfit,system-ui,sans-serif'; c.fillStyle='rgba(255,255,255,.5)';\n     c.fillText('click or press space to play again',W/2,H/2+82);\n   }\n }\n\n /* ---------------- input ---------------- */\n function toBoard(e){\n   const r=cv.getBoundingClientRect();\n   return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};\n }\n cv.addEventListener('pointermove',e=>{\n   if(over) return;\n   const p=toBoard(e);\n   aim=Math.atan2(p.y-(H-R*2.4), p.x-W/2);\n });\n cv.addEventListener('pointerdown',e=>{\n   e.preventDefault();\n   if(over){ reset(); return; }\n   const p=toBoard(e);\n   aim=Math.atan2(p.y-(H-R*2.4), p.x-W/2);\n   fire();\n });\n window.addEventListener('keydown',e=>{\n   const k=e.key;\n   if(k==='ArrowLeft'){ e.preventDefault(); aim=Math.max(-Math.PI+0.28,aim-0.05); }\n   else if(k==='ArrowRight'){ e.preventDefault(); aim=Math.min(-0.28,aim+0.05); }\n   else if(k===' '||k==='Enter'){ e.preventDefault(); if(over) reset(); else fire(); }\n });\n\n reset();\n" },
