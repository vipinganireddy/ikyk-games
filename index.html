nt-numeric:tabular-nums;\n    color:var(--ink);\n    margin:14px 0 2px;\n  }\n  .overlay .go{margin-top:22px;font-size:11px;letter-spacing:.14em;color:var(--ink)}\n  .roster{\n    display:inline-grid;\n    grid-template-columns:auto auto;\n    gap:5px 12px;\n    margin-top:16px;\n    font-size:9.5px;\n    letter-spacing:.1em;\n    color:var(--dim);\n    text-align:left;\n  }\n  .roster i{font-style:normal}\n  .blink{animation:blink 1.15s steps(1,end) infinite}\n  @keyframes blink{50%{opacity:.2}}\n\n  .keys{margin-top:9px;font-size:10px;line-height:1.8;letter-spacing:.07em;color:var(--dim)}\n  kbd{font:inherit;font-size:9.5px;color:var(--ink);border:1px solid #26333c;padding:1px 5px}\n\n  @media (prefers-reduced-motion:reduce){ .blink{animation:none} }", body: "<main class=\"cab\">\n    <div class=\"hud\">\n      <div>\n        <div class=\"lab\">Score</div>\n        <div class=\"val\" id=\"score\">0</div>\n      </div>\n      <div class=\"mid\">\n        <div class=\"lab\">Wave</div>\n        <div class=\"val\" id=\"wave\">1</div>\n      </div>\n      <div class=\"right\">\n        <div class=\"lab\">Ships</div>\n        <div class=\"ships\" id=\"ships\"></div>\n      </div>\n    </div>\n\n    <div class=\"screen\">\n      <canvas id=\"game\" width=\"600\" height=\"720\" aria-label=\"Space shooter\"></canvas>\n\n      <div class=\"overlay\" id=\"ovMenu\">\n        <div>\n          <h2>Vector Run</h2>\n          <p>Hold the line. Every wave sends more.</p>\n          <div class=\"roster\">\n            <i style=\"color:#b6ff5a\">Drone</i><span>drifts in, dies fast</span>\n            <i style=\"color:#ff5f7e\">Hunter</i><span>turns to chase you</span>\n            <i style=\"color:#ffb84d\">Gunner</i><span>hangs back and shoots</span>\n            <i style=\"color:#c98bff\">Hulk</i><span>takes three hits, splits in two</span>\n          </div>\n          <p class=\"go blink\">Press space to launch</p>\n        </div>\n      </div>\n\n      <div class=\"overlay hidden\" id=\"ovEnd\">\n        <div>\n          <h2>Signal lost</h2>\n          <p class=\"big\" id=\"endScore\">0</p>\n          <p id=\"endSub\">Final score</p>\n          <p class=\"go blink\">Press space to fly again</p>\n        </div>\n      </div>\n\n      <div class=\"overlay hidden\" id=\"ovPause\">\n        <div>\n          <h2>Paused</h2>\n          <p class=\"go\">Press <kbd>P</kbd> to resume</p>\n        </div>\n      </div>\n    </div>\n\n    <p class=\"keys\">\n      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows to fly &nbsp;\u00b7&nbsp;\n      <kbd>Space</kbd> fire &nbsp;\u00b7&nbsp; mouse aims and fires &nbsp;\u00b7&nbsp;\n      <kbd>P</kbd> pause &nbsp;\u00b7&nbsp; <kbd>R</kbd> restart\n    </p>\n  </main>", js: "\n  'use strict';\n\n  const W = 600, H = 720;\n  const PHYS_DT = 1 / 120;\n\n  /* ---------------- caps (hard limits, enforced at spawn) ---------------- */\n  const MAX_BULLETS = 40, MAX_EBULLETS = 60, MAX_ENEMIES = 34, MAX_BITS = 260;\n\n  /* ---------------- player ---------------- */\n  const P_ACC = 3400, P_MAX = 340, P_DRAG = 7.5, P_R = 11;\n  const FIRE_CD = 0.145;               // seconds between shots, holding included\n  const B_SPEED = 760, B_LIFE = 1.15, B_R = 3;\n  const INVULN = 1.8, LIVES0 = 3;\n\n  /* ---------------- enemy roster ----------------\n     Every enemy is one entry here: shape, size, health, points, spawn cost,\n     the wave it unlocks on, a per-frame behaviour, and an optional onDeath.\n     Adding a new enemy (a boss included) means adding one entry. */\n  const SHAPES = {\n    player: [[0,-1],[.7,.8],[.28,.52],[-.28,.52],[-.7,.8]],\n    drone:  [[0,1],[.9,-.6],[.35,-.95],[-.35,-.95],[-.9,-.6]],\n    hunter: [[0,1],[.85,-.25],[.4,-.95],[-.4,-.95],[-.85,-.25]],\n    gunner: [[-.9,-.45],[-.35,-1],[.35,-1],[.9,-.45],[.55,.85],[-.55,.85]],\n    hulk:   [[0,-1],[.75,-.7],[1,0],[.7,.75],[0,1],[-.7,.75],[-1,0],[-.75,-.7]],\n    shard:  [[0,-1],[.85,.7],[-.85,.7]]\n  };\n\n  const ENEMIES = {\n    drone: {\n      shape:'drone', r:15, hp:1, points:25, cost:1, unlock:1, color:'#b6ff5a',\n      init(e){ e.vx = (Math.random()*2-1)*70; e.vy = 92 + Math.random()*40; },\n      step(e, dt){ e.rot += dt * 1.4; }\n    },\n    hunter: {\n      shape:'hunter', r:14, hp:1, points:45, cost:2, unlock:2, color:'#ff5f7e',\n      init(e){ e.vy = 120; e.turn = 2.1; },\n      step(e, dt, g){\n        const a = Math.atan2(g.player.y - e.y, g.player.x - e.x);\n        const cur = Math.atan2(e.vy, e.vx);\n        const d = Math.atan2(Math.sin(a - cur), Math.cos(a - cur));\n        const na = cur + clamp(d, -e.turn * dt, e.turn * dt);\n        const sp = 165 * g.diff;\n        e.vx = Math.cos(na) * sp; e.vy = Math.sin(na) * sp;\n        e.rot = na - Math.PI / 2;\n      }\n    },\n    gunner: {\n      shape:'gunner', r:17, hp:2, points:70, cost:3, unlock:3, color:'#ffb84d',\n      init(e){ e.vy = 90; e.hold = 90 + Math.random() * 150; e.cd = .9 + Math.random(); },\n      step(e, dt, g){\n        e.vy = e.y < e.hold ? 90 : 0;\n        e.vx = Math.sin(g.clock * 1.3 + e.seed) * 70;\n        e.cd -= dt;\n        if (e.y >= e.hold - 4 && e.cd <= 0) {\n          e.cd = 1.5 + Math.random() * 0.9 - g.diff * 0.2;\n          const a = Math.atan2(g.player.y - e.y, g.player.x - e.x);\n          fireEnemy(e.x, e.y, a, 260 + g.diff * 20);\n        }\n      }\n    },\n    hulk: {\n      shape:'hulk', r:30, hp:3, points:120, cost:4, unlock:4, color:'#c98bff',\n      init(e){ e.vy = 58; e.vx = (Math.random()*2-1)*30; },\n      step(e, dt){ e.rot += dt * .6; },\n      onDeath(e, g){                      // breaks into two shards\n        for (const s of [-1, 1]) {\n          const child = spawnAt('shard', e.x + s * 14, e.y);\n          if (child) { child.vx = s * 130 + e.vx; child.vy = e.vy + 60; }\n        }\n      }\n    },\n    shard: {\n      shape:'shard', r:9, hp:1, points:20, cost:0, unlock:99, color:'#d9b0ff',\n      init(e){ e.vy = 200; },\n      step(e, dt){ e.rot += dt * 5; }\n    }\n  };\n\n  /* ---------------- dom ---------------- */\n  const canvas = document.getElementById('game');\n  const ctx    = canvas.getContext('2d');\n  const elScore= document.getElementById('score');\n  const elWave = document.getElementById('wave');\n  const elShips= document.getElementById('ships');\n  const ovMenu = document.getElementById('ovMenu');\n  const ovEnd  = document.getElementById('ovEnd');\n  const ovPause= document.getElementById('ovPause');\n\n  function fitBackingStore() {\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    canvas.width = W * dpr; canvas.height = H * dpr;\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n  }\n  fitBackingStore();\n  window.addEventListener('resize', fitBackingStore);\n\n  const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);\n  const rnd = (a, b) => a + Math.random() * (b - a);\n\n  /* ---------------- state ---------------- */\n  const g = {};                                   // shared context handed to behaviours\n  let player, bullets, ebullets, enemies, bits, stars;\n  let score, lives, wave, state, clock, shake, banner, bannerT;\n  let budget, spawnCD, breather, fireCD, invuln, mouse, mouseAim;\n\n  function resetGame() {\n    player = { x: W / 2, y: H - 120, vx: 0, vy: 0, aim: -Math.PI / 2 };\n    bullets = []; ebullets = []; enemies = []; bits = [];\n    score = 0; lives = LIVES0; wave = 1; clock = 0; shake = 0;\n    banner = ''; bannerT = 0;\n    budget = waveBudget(1); spawnCD = 1.1; breather = 0;\n    fireCD = 0; invuln = 1.2;\n    mouse = { x: W / 2, y: H / 2, down: false };\n    mouseAim = false;\n    g.player = player; g.clock = 0; g.diff = 1;\n    if (!stars) {\n      stars = [];\n      for (let i = 0; i < 90; i++)\n        stars.push({ x: Math.random()*W, y: Math.random()*H,\n                     v: i < 60 ? rnd(16, 30) : rnd(52, 80), s: i < 60 ? 1 : 1.6 });\n    }\n    syncHud();\n  }\n\n  function syncHud() {\n    elScore.textContent = score;\n    elWave.textContent = wave;\n    elShips.innerHTML = '';\n    for (let i = 0; i < LIVES0; i++) {\n      const d = document.createElement('div');\n      d.className = 'ship' + (i < lives ? '' : ' spent');\n      elShips.appendChild(d);\n    }\n  }\n\n  function setState(s) {\n    state = s;\n    ovMenu.classList.toggle('hidden', s !== 'menu');\n    ovEnd.classList.toggle('hidden', s !== 'over');\n    ovPause.classList.toggle('hidden', s !== 'paused');\n  }\n\n  /* ---------------- input ---------------- */\n  const held = Object.create(null);\n  window.addEventListener('keydown', e => {\n    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code) >= 0) e.preventDefault();\n    if (e.repeat) return;\n    held[e.code] = true;\n    if (e.code === 'Space' || e.code === 'Enter') {\n      if (state === 'menu') { resetGame(); setState('play'); }\n      else if (state === 'over') { resetGame(); setState('play'); }\n      else if (state === 'paused') setState('play');\n      return;\n    }\n    if (e.code === 'KeyP' || e.code === 'Escape') {\n      if (state === 'play') setState('paused');\n      else if (state === 'paused') setState('play');\n    }\n    if (e.code === 'KeyR' && state !== 'menu') { resetGame(); setState('play'); }\n  });\n  window.addEventListener('keyup', e => { held[e.code] = false; });\n  window.addEventListener('blur', () => { for (const k in held) held[k] = false; mouse.down = false; });\n\n  function toBoard(e) {\n    const r = canvas.getBoundingClientRect();\n    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };\n  }\n  canvas.addEventListener('pointermove', e => {\n    const p = toBoard(e); mouse.x = p.x; mouse.y = p.y; mouseAim = true;\n  });\n  canvas.addEventListener('pointerdown', e => {\n    const p = toBoard(e); mouse.x = p.x; mouse.y = p.y; mouseAim = true; mouse.down = true;\n    if (state === 'menu' || state === 'over') { resetGame(); setState('play'); }\n  });\n  window.addEventListener('pointerup', () => { mouse.down = false; });\n\n  /* ---------------- spawning ---------------- */\n  function waveBudget(n) { return 5 + n * 3; }\n  function spawnInterval() { return Math.max(0.28, 1.15 - wave * 0.055); }\n\n  function rosterFor(n) {\n    const out = [];\n    for (const k in ENEMIES) {\n      const t = ENEMIES[k];\n      if (t.unlock <= n && t.cost > 0 && t.cost <= budget) out.push(k);\n    }\n    return out;\n  }\n\n  function spawnAt(kind, x, y) {\n    if (enemies.length >= MAX_ENEMIES) return null;\n    const t = ENEMIES[kind];\n    const e = { kind, t, x, y, vx: 0, vy: 0, r: t.r, hp: t.hp, rot: 0,\n                flash: 0, seed: Math.random() * 6.283, boss: !!t.boss };\n    if (t.init) t.init(e, g);\n    enemies.push(e);\n    return e;\n  }\n\n  function spawnEdge(kind) {\n    const t = ENEMIES[kind];\n    const e = spawnAt(kind, rnd(t.r + 12, W - t.r - 12), -t.r - 10);\n    if (e && kind === 'hunter' && Math.random() < 0.35) {   // hunters may sweep in from a side\n      e.x = Math.random() < 0.5 ? -t.r : W + t.r;\n      e.y = rnd(60, 240);\n    }\n    return e;\n  }\n\n  function director(dt) {\n    if (breather > 0) {                      // between waves\n      breather -= dt;\n      if (breather <= 0) {\n        wave++;\n        g.diff = Math.min(2.4, 1 + (wave - 1) * 0.05);\n        budget = waveBudget(wave);\n        spawnCD = 0.5;\n        banner = 'Wave ' + wave; bannerT = 1.8;\n        syncHud();\n      }\n      return;\n    }\n\n    if (budget > 0) {\n      spawnCD -= dt;\n      if (spawnCD <= 0) {\n        const pool = rosterFor(wave);\n        if (pool.length) {\n          const kind = pool[(Math.random() * pool.length) | 0];\n          if (spawnEdge(kind)) budget -= ENEMIES[kind].cost;\n        }\n        spawnCD = spawnInterval() * rnd(0.75, 1.3);\n      }\n      return;\n    }\n\n    if (enemies.length === 0) {              // wave cleared\n      score += wave * 50;\n      banner = 'Wave ' + wave + ' clear  +' + wave * 50; bannerT = 1.6;\n      breather = 1.7;\n      syncHud();\n    }\n  }\n\n  /* ---------------- shooting ---------------- */\n  function firePlayer() {\n    if (bullets.length >= MAX_BULLETS) return;\n    const a = player.aim;\n    const nx = player.x + Math.cos(a) * 16, ny = player.y + Math.sin(a) * 16;\n    bullets.push({ x: nx, y: ny, px: nx, py: ny,\n                   vx: Math.cos(a) * B_SPEED + player.vx * .25,\n                   vy: Math.sin(a) * B_SPEED + player.vy * .25, life: B_LIFE });\n    burstLine(nx, ny, a, '#eaf9ff', 3);\n  }\n  function fireEnemy(x, y, a, sp) {\n    if (ebullets.length >= MAX_EBULLETS) return;\n    ebullets.push({ x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 4, r: 4 });\n  }\n\n  /* ---------------- debris (vector shards) ---------------- */\n  function explode(x, y, shape, r, color, rot) {\n    const pts = SHAPES[shape];\n    for (let i = 0; i < pts.length && bits.length < MAX_BITS; i++) {\n      const a = pts[i], b = pts[(i + 1) % pts.length];\n      const c = Math.cos(rot || 0), s = Math.sin(rot || 0);\n      const rx = (p) => ({ x: (p[0]*c - p[1]*s) * r, y: (p[0]*s + p[1]*c) * r });\n      const A = rx(a), B = rx(b);\n      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;\n      const dir = Math.atan2(my, mx) + rnd(-.4, .4);\n      const sp = rnd(60, 210);\n      bits.push({ x: x + mx, y: y + my,\n                  ax: A.x - mx, ay: A.y - my, bx: B.x - mx, by: B.y - my,\n                  vx: Math.cos(dir) * sp, vy: Math.sin(dir) * sp,\n                  spin: rnd(-5, 5), rot: 0, life: rnd(.5, .95), age: 0, c: color });\n    }\n  }\n  function burstLine(x, y, a, color, n) {\n    for (let i = 0; i < n && bits.length < MAX_BITS; i++) {\n      const d = a + rnd(-.5, .5), sp = rnd(70, 190);\n      bits.push({ x, y, ax: -3, ay: 0, bx: 3, by: 0,\n                  vx: Math.cos(d)*sp, vy: Math.sin(d)*sp, spin: rnd(-8,8), rot: d,\n                  life: rnd(.12,.28), age: 0, c: color });\n    }\n  }\n\n  /* ---------------- damage ---------------- */\n  function hurtEnemy(e, dmg) {\n    e.hp -= dmg;\n    e.flash = 0.09;\n    if (e.hp > 0) return false;\n    const i = enemies.indexOf(e);\n    if (i >= 0) enemies.splice(i, 1);\n    score += e.t.points;\n    explode(e.x, e.y, e.t.shape, e.r, e.t.color, e.rot);\n    shake = Math.min(1, shake + (e.boss ? 1 : e.r / 90));\n    if (e.t.onDeath) e.t.onDeath(e, g);\n    syncHud();\n    return true;\n  }\n\n  function hurtPlayer() {\n    if (invuln > 0) return;\n    lives--;\n    invuln = INVULN;\n    shake = 1;\n    ebullets.length = 0;\n    explode(player.x, player.y, 'player', 16, '#6ef2ff', player.aim + Math.PI/2);\n    player.x = W / 2; player.y = H - 120; player.vx = player.vy = 0;\n    syncHud();\n    if (lives <= 0) {\n      document.getElementById('endScore').textContent = score;\n      document.getElementById('endSub').textContent = 'Final score \\u00b7 reached wave ' + wave;\n      setState('over');\n    }\n  }\n\n  /* ---------------- update ---------------- */\n  function update(dt) {\n    clock += dt; g.clock = clock;\n    if (bannerT > 0) bannerT -= dt;\n    if (shake > 0) shake = Math.max(0, shake - dt * 2.6);\n    if (invuln > 0) invuln -= dt;\n\n    for (const s of stars) { s.y += s.v * dt; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }\n\n    // ship\n    const ax = (held.ArrowRight || held.KeyD ? 1 : 0) - (held.ArrowLeft || held.KeyA ? 1 : 0);\n    const ay = (held.ArrowDown  || held.KeyS ? 1 : 0) - (held.ArrowUp   || held.KeyW ? 1 : 0);\n    const m = Math.hypot(ax, ay) || 1;\n    player.vx += (ax / m) * P_ACC * dt;\n    player.vy += (ay / m) * P_ACC * dt;\n    const drag = Math.exp(-P_DRAG * dt);\n    if (!ax) player.vx *= drag;\n    if (!ay) player.vy *= drag;\n    const sp = Math.hypot(player.vx, player.vy);\n    if (sp > P_MAX) { player.vx = player.vx / sp * P_MAX; player.vy = player.vy / sp * P_MAX; }\n    player.x = clamp(player.x + player.vx * dt, P_R, W - P_R);\n    player.y = clamp(player.y + player.vy * dt, P_R, H - P_R);\n    if (player.x <= P_R || player.x >= W - P_R) player.vx = 0;\n    if (player.y <= P_R || player.y >= H - P_R) player.vy = 0;\n\n    player.aim = mouseAim ? Math.atan2(mouse.y - player.y, mouse.x - player.x) : -Math.PI / 2;\n\n    // firing, rate limited whether the key is tapped or held\n    fireCD -= dt;\n    if ((held.Space || mouse.down) && fireCD <= 0) { firePlayer(); fireCD = FIRE_CD; }\n\n    director(dt);\n\n    // player bullets: swept segment test so nothing is skipped at 760 px/s\n    for (let i = bullets.length - 1; i >= 0; i--) {\n      const b = bullets[i];\n      b.px = b.x; b.py = b.y;\n      b.x += b.vx * dt; b.y += b.vy * dt;\n      b.life -= dt;\n      if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) { bullets.splice(i, 1); continue; }\n      let hit = null, bestT = 2;\n      for (const e of enemies) {\n        const t = segCircle(b.px, b.py, b.x, b.y, e.x, e.y, e.r + B_R);\n        if (t >= 0 && t < bestT) { bestT = t; hit = e; }\n      }\n      if (hit) {\n        bullets.splice(i, 1);\n        burstLine(b.px + (b.x - b.px) * bestT, b.py + (b.y - b.py) * bestT,\n                  Math.atan2(-b.vy, -b.vx), hit.t.color, 3);\n        hurtEnemy(hit, 1);\n      }\n    }\n\n    // enemies\n    for (let i = enemies.length - 1; i >= 0; i--) {\n      const e = enemies[i];\n      if (e.flash > 0) e.flash -= dt;\n      if (e.t.step) e.t.step(e, dt, g);\n      e.x += e.vx * dt; e.y += e.vy * dt;\n      if (e.y > H + e.r + 30 || e.x < -e.r - 60 || e.x > W + e.r + 60) { enemies.splice(i, 1); continue; }\n      if (invuln <= 0 && dist2(e.x, e.y, player.x, player.y) < (e.r + P_R) * (e.r + P_R)) {\n        if (!e.boss) hurtEnemy(e, 999); else e.flash = .12;\n        hurtPlayer();\n      }\n    }\n\n    // enemy bullets\n    for (let i = ebullets.length - 1; i >= 0; i--) {\n      const b = ebullets[i];\n      b.px = b.x; b.py = b.y;\n      b.x += b.vx * dt; b.y += b.vy * dt;\n      b.life -= dt;\n      if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) { ebullets.splice(i, 1); continue; }\n      if (invuln <= 0 && segCircle(b.px, b.py, b.x, b.y, player.x, player.y, P_R + b.r) >= 0) {\n        ebullets.splice(i, 1);\n        hurtPlayer();     // this clears every enemy shot, so stop walking the list\n        break;\n      }\n    }\n\n    // debris\n    for (let i = bits.length - 1; i >= 0; i--) {\n      const p = bits[i];\n      p.age += dt;\n      if (p.age >= p.life) { bits.splice(i, 1); continue; }\n      p.x += p.vx * dt; p.y += p.vy * dt;\n      p.vx *= Math.exp(-1.2 * dt); p.vy *= Math.exp(-1.2 * dt);\n      p.rot += p.spin * dt;\n    }\n  }\n\n  function dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx*dx + dy*dy; }\n\n  // nearest point on segment AB to circle centre C; returns t in [0,1] if it grazes, else -1\n  function segCircle(ax, ay, bx, by, cx, cy, r) {\n    const dx = bx - ax, dy = by - ay;\n    const len2 = dx*dx + dy*dy;\n    let t = len2 > 0 ? ((cx - ax) * dx + (cy - ay) * dy) / len2 : 0;\n    t = clamp(t, 0, 1);\n    const px = ax + dx * t, py = ay + dy * t;\n    return dist2(px, py, cx, cy) <= r * r ? t : -1;\n  }\n\n  /* ---------------- render ---------------- */\n  function line(pts, x, y, rot, r, color, width, alpha) {\n    const c = Math.cos(rot), s = Math.sin(rot);\n    ctx.beginPath();\n    for (let i = 0; i < pts.length; i++) {\n      const px = x + (pts[i][0]*c - pts[i][1]*s) * r;\n      const py = y + (pts[i][0]*s + pts[i][1]*c) * r;\n      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);\n    }\n    ctx.closePath();\n    ctx.globalAlpha = alpha * 0.3; ctx.lineWidth = width * 3.2; ctx.strokeStyle = color; ctx.stroke();\n    ctx.globalAlpha = alpha;       ctx.lineWidth = width;       ctx.stroke();\n    ctx.globalAlpha = 1;\n  }\n\n  function render() {\n    ctx.save();\n    if (shake > 0) ctx.translate(rnd(-1,1) * 6 * shake, rnd(-1,1) * 6 * shake);\n\n    ctx.fillStyle = '#000';\n    ctx.fillRect(-10, -10, W + 20, H + 20);\n\n    // starfield\n    f he water &nbsp;\u00b7&nbsp; <kbd>P</kbd> pause\n    </p>\n  </main>", js: "\n  'use strict';\n\n  /* ---------------- field ---------------- */\n  const W = 440, H = 640;\n  const FLOOR_H = 78;                 // sand band at the bottom\n  const SKY = H - FLOOR_H;            // swimmable height\n  const PHYS_DT = 1 / 120;\n\n  /* ---------------- physics ----------------\n     One flap sets a fixed upward velocity, so every tap is worth exactly the\n     same climb no matter what the fish was doing beforehand. */\n  const GRAV     = 1500;              // px/s^2\n  const FLAP     = -430;              // px/s, assigned (not added) on every tap\n  const MAX_FALL = 620;               // px/s terminal velocity\n  const FISH_R   = 13;                // collision radius\n  const FISH_X   = 132;               // the fish holds this column of the screen\n\n  /* ---------------- obstacles ---------------- */\n  const COL_W    = 62;\n  const SPACING  = 210;               // horizontal distance between columns\n  const GAP_0    = 168, GAP_MIN = 118, GAP_STEP = 1.6;   // gap shrinks per point\n  const SPD_0    = 132, SPD_MAX = 190, SPD_STEP = 0.9;   // and the water speeds up\n  const MARGIN_T = 46, MARGIN_B = 34; // keep a gap off the surface and the sand\n  const REACH    = 0.5;               // fraction of the best possible climb we allow\n  const MAX_BUBBLES = 90;\n\n  /* ---------------- storage (memory fallback if it is blocked) ---------------- */\n  const store = (function () {\n    const KEY = 'shallows.best';\n    try {\n      localStorage.setItem('__t', '1'); localStorage.removeItem('__t');\n      return { get: () => Number(localStorage.getItem(KEY)) || 0,\n               set: v => { try { localStorage.setItem(KEY, String(v)); } catch (e) {} } };\n    } catch (e) {\n      let mem = 0;\n      return { get: () => mem, set: v => { mem = v; } };\n    }\n  })();\n\n  /* ---------------- dom ---------------- */\n  const canvas = document.getElementById('game');\n  const ctx    = canvas.getContext('2d');\n  const elBest = document.getElementById('best');\n  const ovStart= document.getElementById('ovStart');\n  const ovEnd  = document.getElementById('ovEnd');\n\n  function fitBackingStore() {\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    canvas.width = W * dpr; canvas.height = H * dpr;\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n  }\n  fitBackingStore();\n  window.addEventListener('resize', fitBackingStore);\n\n  const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);\n  const rnd = (a, b) => a + Math.random() * (b - a);\n  const FONT = getComputedStyle(document.body).fontFamily;\n\n  /* ---------------- state ---------------- */\n  let fish, cols, bubbles, reef, score, best, state, clock, speed, gap;\n  let shake, scorePop, deathT, lockT, paused, worldX, justBeat;\n\n  best = store.get();\n\n  function reset() {\n    fish = { y: SKY * 0.42, vy: 0, rot: 0, wag: 0 };\n    cols = [];\n    bubbles = [];\n    score = 0; clock = 0; shake = 0; scorePop = 0; deathT = 0; lockT = 0;\n    speed = SPD_0; gap = GAP_0; worldX = 0; justBeat = false;\n    if (!reef) {\n      reef = [];\n      for (let i = 0; i < 14; i++)\n        reef.push({ x: i * 70 + rnd(-14, 14), w: rnd(46, 96), h: rnd(26, 74) });\n    }\n    addColumn(W + 190, SKY * 0.5);      // first column is a long glide away\n    syncHud();\n  }\n\n  function syncHud() { elBest.textContent = best; }\n\n  function setState(s) {\n    state = s;\n    ovStart.classList.toggle('hidden', s !== 'ready');\n    ovEnd.classList.toggle('hidden', s !== 'over');\n  }\n\n  /* ---------------- obstacle generation ----------------\n     Two rules keep every gap passable:\n       1. the gap centre stays inside the screen margins, and\n       2. it never moves further from the previous centre than the fish can\n          actually climb in the time it takes to cross the spacing.        */\n  function reachableRise() {\n    // the honest window is from clearing one column to reaching the next, which is\n    // a column width shorter than the spacing\n    const travel = (SPACING - COL_W) / speed;\n    return (-FLAP) * 0.5 * travel * REACH;   // best sustained climb is half the flap speed\n  }\n\n  function nextGapY(prevY) {\n    const rise = reachableRise();\n    const lo = Math.max(MARGIN_T + gap / 2, prevY - rise);\n    const hi = Math.min(SKY - MARGIN_B - gap / 2, prevY + rise * 1.35);  // sinking is cheap\n    return hi <= lo ? clamp(prevY, MARGIN_T + gap / 2, SKY - MARGIN_B - gap / 2) : rnd(lo, hi);\n  }\n\n  function addColumn(x, y) {\n    cols.push({ x, y, gap, scored: false, hue: cols.length % 2 });\n  }\n\n  function maintainColumns() {\n    while (cols.length && cols[0].x + COL_W < -20) cols.shift();\n    const last = cols[cols.length - 1];\n    if (!last || last.x < W - SPACING + COL_W) {\n      const prevY = last ? last.y : SKY / 2;\n      addColumn((last ? last.x : W) + SPACING, nextGapY(prevY));\n    }\n  }\n\n  /* ---------------- input ---------------- */\n  function tap() {\n    if (paused) { paused = false; return; }\n    if (state === 'ready') { setState('play'); flap(); return; }\n    if (state === 'play') { flap(); return; }\n    if (state === 'over' && lockT <= 0) { reset(); setState('ready'); }\n  }\n  function flap() {\n    fish.vy = FLAP;\n    fish.wag = 1;\n    for (let i = 0; i < 5 && bubbles.length < MAX_BUBBLES; i++)\n      bubbles.push({ x: FISH_X - 12 + rnd(-4, 4), y: fish.y + rnd(-5, 5),\n                     r: rnd(1.6, 4), vx: rnd(-42, -14), vy: rnd(-26, 6),\n                     life: rnd(.5, 1.1), age: 0 });\n  }\n\n  window.addEventListener('keydown', e => {\n    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {\n      e.preventDefault();\n      if (!e.repeat) tap();\n      return;\n    }\n    if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') paused = !paused; }\n  });\n  canvas.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });\n  ovStart.addEventLi for (let i = 0; i < 22; i++) {\n      const x = (i * 97 + 31) % W, y = SKY + 22 + ((i * 53) % (FLOOR_H - 30));\n      ctx.fillRect(x, y, 3, 2);\n    }\n  }\n\n  function drawFish() {\n    ctx.save();\n    ctx.translate(FISH_X, fish.y);\n    ctx.rotate(fish.rot);\n    const wag = Math.sin(clock * (14 + fish.wag * 22)) * (3 + fish.wag * 5);\n\n    // ---- clownfish: orange body, three white bands with black edging ----\n    // tail fin\n    ctx.fillStyle = '#f26722';\n    ctx.beginPath();\n    ctx.moveTo(-13, 0);\n    ctx.quadraticCurveTo(-22, -11 + wag, -27, -13 + wag);\n    ctx.quadraticCurveTo(-23, 0, -27, 13 + wag);\n    ctx.quadraticCurveTo(-22, 11 + wag, -13, 0);\n    ctx.closePath(); ctx.fill();\n    ctx.strokeStyle = '#1c1c22'; ctx.lineWidth = 1.6; ctx.stroke();\n\n    // pectoral fin (behind body)\n    ctx.fillStyle = '#e0561c';\n    ctx.beginPath();\n    ctx.ellipse(-1, 7, 7, 4.5, 0.5 + fish.wag * 0.2, 0, Math.PI * 2);\n    ctx.fill();\n\n    // dorsal fin\n    ctx.fillStyle = '#f26722';\n    ctx.beginPath();\n    ctx.moveTo(-6, -10);\n    ctx.quadraticCurveTo(0, -19 - fish.wag * 3, 9, -8);\n    ctx.closePath(); ctx.fill();\n    ctx.strokeStyle = '#1c1c22'; ctx.lineWidth = 1.4; ctx.stroke();\n\n    // body\n    const grad = ctx.createLinearGradient(0, -12, 0, 12);\n    grad.addColorStop(0, '#ff8a3d');\n    grad.addColorStop(0.55, '#f26722');\n    grad.addColorStop(1, '#d94f18');\n    ctx.fillStyle = grad;\n    ctx.beginPath();\n    ctx.ellipse(0, 0, 18, 12.5, 0, 0, Math.PI * 2);\n    ctx.fill();\n\n    // three signature white bands, clipped to the body\n    ctx.save();\n    ctx.beginPath();\n    ctx.ellipse(0, 0, 18, 12.5, 0, 0, Math.PI * 2);\n    ctx.clip();\n    const bands = [[-9, 5.5], [2, 6.5], [12, 4.5]];\n    for (const [bx, bw] of bands) {\n      ctx.fillStyle = '#1c1c22';\n      ctx.fillRect(bx - bw / 2 - 1.6, -14, bw + 3.2, 28);\n      ctx.fillStyle = '#fdf7ef';\n      ctx.fillRect(bx - bw / 2, -14, bw, 28);\n    }\n    ctx.restore();\n\n    // bo \"><div class=\"k\">Score</div><div class=\"v\" id=\"score\">0</div></div>\n        <div class=\"box\"><div class=\"k\">Best</div><div class=\"v\" id=\"best\">0</div></div>\n      </div>\n    </header>\n\n    <div class=\"toolbar\">\n      <p class=\"hint\" id=\"hint\">Arrow keys or <b>WASD</b> to move &middot; swipe on touch</p>\n      <button id=\"newGame\" type=\"button\">New game</button>\n    </div>\n\n    <div class=\"board\" id=\"board\" tabindex=\"0\" role=\"application\"\n         aria-label=\"2048 board. Use the arrow keys to slide tiles.\">\n      <div class=\"cells\" aria-hidden=\"true\">\n        <div class=\"cell\"></div><div class=\"cell\"></div><div class=\"cell\"></div><div class=\"cell\"></div>\n        <div class=\"cell\"></div><div class=\"cell\"></div><div class=\"cell\"></div><div class=\"cell\"></div>\n        <div class=\"cell\"></div><div class=\"cell\"></div><div class=\"cell\"></div><div class=\"cell\"></div>\n        <div class=\"cell\"></div><div class=\"cell\"></div><div class=\"cell\"></div><div class=\"cell\"></div>\n      </div>\n      <div class=\"tiles\" id=\"tiles\"></div>\n\n      <div class=\"overlay hidden\" id=\"ovWin\">\n        <div>\n          <h2>2048</h2>\n          <p>You made it. Want to push further?</p>\n          <div class=\"row\">\n            <button type=\"button\" id=\"keepGoing\">Keep going</button>\n            <button type=\"button\" class=\"ghost\" id=\"winNew\">New game</button>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"overlay hidden\" id=\"ovLose\">\n        <div>\n          <h2>No moves left</h2>\n          <p id=\"loseSub\">Final score 0</p>\n          <div class=\"row\"><button type=\"button\" id=\"loseNew\">New game</button></div>\n        </div>\n      </div>\n    </div>\n\n    <p class=\"sr\" id=\"live\" role=\"status\" aria-live=\"polite\"></p>\n  </main>", js: "\n  'use strict';\n\n  const N = 4;\n  const WIN = 2048;\n  const SLIDE_MS = 110;                 // must match the CSS transition on .tile\n\n  /* ---------------- storage with an in-memory fallback ---------------- */\n  const store = (function () {\n    const KEY = '2048.best';\n    try {\n      localStorage.setItem('__t', '1'); localStorage.removeItem('__t');\n      return { get: () => Number(localStorage.getItem(KEY)) || 0,\n               set: v => { try { localStorage.setItem(KEY, String(v)); } catch (e) {} } };\n    } catch (e) { let m = 0; return { get: () => m, set: v => { m = v; } }; }\n  })();\n\n  /* ---------------- dom ---------------- */\n  const boardEl = document.getElementById('board');\n  const tilesEl = document.getElementById('tiles');\n  const scoreEl = document.getElementById('score');\n  const bestEl  = document.getElementById('best');\n  const liveEl  = document.getElementById('live');\n  const ovWin   = document.getElementById('ovWin');\n  const ovLose  = document.getElementById('ovLose');\n\n  /* ---------------- state ---------------- */\n  let grid;              // N x N of tile objects or null\n  let score, best, won, over, nextId;\n  let pending = null;    // merge cleanup waiting on the slide transition\n  let timer = null;\n\n  best = store.get();\n\n  function emptyGrid() {\n    const g = [];\n    for (let r = 0; r < N; r++) g.push(new Array(N).fill(null));\n    return g;\n  }\n\n  function newTile(r, c, v) {\n    const t = { id: nextId++, v, r, c, el: null };\n    grid[r][c] = t;\n    return t;\n  }\n\n  function freeCells() {\n    const out = [];\n    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) out.push([r, c]);\n    return out;\n  }\n\n  function spawn() {\n    const free = freeCells();\n    if (!free.length) return null;\n    const [r, c] = free[(Math.random() * free.length) | 0];\n    const t = newTile(r, c, Math.random() < 0.9 ? 2 : 4);\n    t.fresh = true;\n    return t;\n  }\n\n  function newGame() {\n    flush();\n    grid = emptyGrid();\n    score = 0; won = false; over = false; nextId = 1;\n    tilesEl.innerHTML = '';\n    spawn(); spawn();\n    ovWin.classList.add('hidden');\n    ovLose.classList.add('hidden');\n    render(true);\n    say('New game started.');\n  }\n\n  /* ---------------- the move ----------------\n     One pass per line. `mergedInto` marks a tile that has already absorbed\n     something on THIS move, so it can never absorb twice. */\n  const VECTORS = {\n    left:  { dr: 0, dc: -1 }, right: { dr: 0, dc: 1 },\n    up:    { dr: -1, dc: 0 }, down:  { dr: 1, dc: 0 }\n  };\n\n  function lineCells(dir, i) {\n    // cells of line i, ordered from the leading edge (the direction of travel) backwards\n    const cells = [];\n    for (let k = 0; k < N; k++) {\n      if (dir === 'left')  cells.push([i, k]);\n      if (dir === 'right') cells.push([i, N - 1 - k]);\n      if (dir === 'up')    cells.push([k, i]);\n      if (dir === 'down')  cells.push([N - 1 - k, i]);\n    }\n    return cells;\n  }\n\n  function move(dir) {\n    if (over || !VECTORS[dir]) return false;\n    flush();                                  // settle any half-finished merge first\n\n    const next = emptyGrid();\n    const absorbed = [];\n    let changed = false, gained = 0, madeWin = false;\n\n    for (let i = 0; i < N; i++) {\n      const cells = lineCells(dir, i);\n      const out = [];                          // survivors, packed against the leading edge\n\n      for (const [r, c] of cells) {\n        const t = grid[r][c];\n        if (!t) continue;\n        const last = out[out.length - 1];\n\n        if (last && !last.mergedInto && last.v === t.v) {\n          last.v *= 2;\n          last.mergedInto = true;              // this tile is now spent for the rest of the move\n          last.justMerged = true;\n          gained += last.v;\n          if (last.v >= WIN) madeWin = true;\n          const [tr, tc] = cells[out.length - 1];\n          t.r = tr; t.c = tc;                  // the absorbed tile slides under the survivor\n          absorbed.push(t);\n          changed = true;\n          continue;\n        }\n        out.push(t);\n        const [tr, tc] = cells[out.length - 1];\n        if (t.r !== tr || t.c !== tc) changed = true;\n        t.r = tr; t.c = tc;\n        next[tr][tc] = t;\n      }\n    }\n\n    if (!changed) {\n      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {\n        const t = grid[r][c];\n        if (t) { t.mergedInto = false; t.justMerged = false; }\n      }\n      return false;\n    }\n\n    grid = next;\n    score += gained;\n    if (score > best) { best = score; store.set(best); }\n\n    // the absorbed tiles are still on screen sliding home; retire them once they land\n    pending = { absorbed, win: madeWin && !won };\n    spawn();\n    render();\n    timer = setTimeout(flush, SLIDE_MS + 10);\n\n    say((gained ? 'Merged for ' + gained + ' points. ' : '') + 'Score ' + score + '.');\n    return true;\n  }\n\n  function flush() {\n    if (timer) { clearTimeout(timer); timer = null; }\n    if (!pending) return;\n    const p = pending;\n    pending = null;\n    for (const t of p.absorbed) if (t.el && t.el.parentNode) t.el.parentNode.removeChild(t.el);\n    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {\n      const t = grid[r][c];\n      if (!t) continue;\n      t.mergedInto = false; t.justMerged = false;\n      if (t.el && t.el.textContent !== String(t.v)) paint(t, t.el);   // settle any pending face\n    }\n    if (p.win && !won) { won = true; ovWin.classList.remove('hidden'); say('You reached 2048.'); }\n    checkOver();\n  }\n\n  function canMove() {\n    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {\n      const t = grid[r][c];\n      if (!t) return true;\n      if (c + 1 < N && grid[r][c + 1] && grid[r][c + 1].v === t.v) return true;\n      if (r + 1 < N && grid[r + 1][c] && grid[r + 1][c].v === t.v) return true;\n    }\n    return false;\n  }\n\n  function checkOver() {\n    if (canMove()) return;\n    over = true;\n    document.getElementById('loseSub').textContent = 'Final score ' + score;\n    ovLose.classList.remove('hidden');\n    say('No moves left. Final score ' + score + '.');\n  }\n\n  /* ---------------- render ---------------- */\n  function tileEl(t) {\n    if (t.el) return t.el;\n    const el = document.createElement('div');\n    el.className = 'tile';\n    t.el = el;\n    tilesEl.appendChild(el);\n    return el;\n  }\n\n  function paint(t, el) {\n    const s = String(t.v);\n    el.textContent = s;\n    el.dataset.v = s;\n    el.dataset.len = String(Math.min(5, s.length));\n    if (t.v > 8192) el.classList.add('big'); else el.classList.remove('big');\n    el.style.setProperty('--r', t.r);\n    el.style.setProperty('--c', t.c);\n  }\n\n  function render(hard) {\n    const seen = [];\n    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {\n      const t = grid[r][c];\n      if (!t) continue;\n      seen.push(t);\n      const el = tileEl(t);\n      const isNew = !el.dataset.v;\n\n      // a merged tile keeps its old face until it has finished sliding, then pops\n      if (t.justMerged && !hard) {\n        el.style.setProperty('--r', t.r);\n        el.style.setProperty('--c', t.c);\n        const val = t.v;\n        setTimeout(function () {\n          if (t.v !== val || !t.el) return;    // superseded by a later move\n          paint(t, t.el);\n          t.el.classList.remove('merged');\n          void t.el.offsetWidth;\n          t.el.classList.add('merged');\n        }, SLIDE_MS);\n      } else {\n        paint(t, el);\n      }\n\n      if (isNew || (t.fresh && !hard)) { el.classList.add('spawn'); }\n      else if (!t.fresh) el.classList.remove('spawn');\n      t.fresh = false;\n    }\n    // absorbed tiles slide beneath the survivor\n    if (pending) for (const t of pending.absorbed) {\n      const el = tileEl(t);\n      el.classList.add('dying');\n      el.style.setProperty('--r', t.r);\n      el.style.setProperty('--c', t.c);\n    }\n    scoreEl.textContent = score;\n    bestEl.textContent = best;\n  }\n\n  function say(msg) { liveEl.textContent = msg; }\n\n  /* ---------------- input ---------------- */\n  const KEYS = {\n    ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',\n    ArrowUp:'up',     KeyW:'up',   ArrowDown:'down',   KeyS:'down'\n  };\n\n  window.addEventListener('keydown', e => {\n    const dir = KEYS[e.code];\n    if (!dir) return;\n    if (e.metaKey || e.ctrlKey || e.altKey) return;\n    e.preventDefault();\n    doMove(dir);\n  });\n\n  function doMove(dir) {\n    if (over) return;\n    move(dir);\n  }\n\n  let sx = 0, sy = 0, tracking = false;\n  boardEl.addEventListener('pointerdown', e => {\n    if (e.target.closest && e.target.closest('button')) return;\n    tracking = true; sx = e.clientX; sy = e.clientY;\n  });\n  boardEl.addEventListener('pointerup', e => {\n    if (!tracking) return;\n    tracking = false;\n    const dx = e.clientX - sx, dy = e.clientY - sy;\n    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;\n    doMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));\n  });\n  boardEl.addEventListener('pointercancel', () => { tracking = false; });\n\n  document.getElementById('newGame').addEventListener('click', newGame);\n  document.getElementById('winNew').addEventListener('click', newGame);\n  document.getElementById('loseNew').addEventListener('click', newGame);\n  document.getElementById('keepGoing').addEventListener('click', () => {\n    ovWin.classList.add('hidden');\n    boardEl.focus();\n  });\n\n  newGame();\n" },
  "memory": { css: "\n  :root{\n    --felt:#1f5147;\n    --felt-deep:#163b34;\n    --cream:#f7f0e0;\n    --card:#fbf6ea;\n    --ink:#22406f;\n    --ink-soft:#3d5f92;\n    --gold:#d9a441;\n    --text:#0f2b26;\n    --sans:ui-rounded,\"SF Pro Rounded\",\"Segoe UI Variable\",\"Segoe UI\",system-ui,-apple-system,sans-serif;\n    --gap:12px;\n  }\n  *{box-sizing:border-box}\n  body{\n    margin:0;\n    min-height:100vh;\n    background:\n      radial-gradient(120% 80% at 50% 0%, #2a6055 0%, var(--felt) 45%, var(--felt-deep) 100%),\n      var(--felt);\n    color:var(--cream);\n    font-family:var(--sans);\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    padding:20px 16px;\n    -webkit-tap-highlight-color:transparent;\n  }\n  .table{\n    width:auto;max-width:none;margin:0 auto;\n    display:grid;grid-template-columns:196px minmax(0,1fr);\n    gap:6px 20px;align-items:start;justify-content:center;\n  }\n  .table > header{grid-column:1;grid-row:1;align-self:end}\n  .table > .toolbar{grid-column:1;grid-row:2}\n  .table > .stage{grid-column:2;grid-row:1/5;width:470px}\n  .table > .hint{grid-column:1;grid-row:3;text-align:left;margin-top:2px}\n  .table > .sr{grid-column:1;grid-row:4}\n\n  header{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:6px;text-align:left}\n  h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}\n  .sub{margin:3px 0 0;font-size:11px;font-weight:600;color:#bcdcd2}\n  .stats{display:flex;gap:8px;flex:none;width:100%}\n  .stat{\n    flex:1;\n    background:rgba(6,28,24,.42);\n    border:1px solid rgba(247,240,224,.16);\n    border-radius:8px;\n    padding:6px 12px 7px;\n    text-align:center;\n    min-width:70px;\n  }\n  .stat .k{font-size:8.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#bcdcd2}\n  .stat .v{white-space:nowrap;font-size:19px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}\n\n  .toolbar{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:8px;text-align:left}\n  .best{font-size:11.5px;font-weight:600;color:#bcdcd2}\n  .best b{color:var(--cream)}\n  button{\n    width:100%;\n    font:inherit;\n    font-size:12.5px;\n    font-weight:700;\n    color:var(--text);\n    background:var(--cream);\n    border:none;\n    border-radius:7px;\n    padding:9px 15px;\n    cursor:pointer;\n  }\n  button:hover{background:#fff}\n  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}\n\n  .stage{position:relative}\n  .board{\n    display:grid;\n    grid-template-columns:repeat(var(--cols),1fr);\n    gap:var(--gap);\n    perspective:1200px;\n  }\n\n  .card{\n    all:unset;\n    display:block;\n    position:relative;\n    aspect-ratio:5/7;\n    border-radius:9px;\n    cursor:pointer;\n    -webkit-tap-highlight-color:transparent;\n  }\n  .card:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:9px}\n  .card[aria-disabled=\"true\"]{cursor:default}\n\n  .inner{\n    position:absolute;\n    inset:0;\n    transform-style:preserve-3d;\n    transition:transform 340ms cubic-bezier(.2,.8,.3,1);\n    border-radius:9px;\n  }\n  .card.up .inner,.card.done .inner{transform:rotateY(180deg)}\n\n  .face{\n    position:absolute;\n    inset:0;\n    display:grid;\n    place-items:center;\n    border-radius:9px;\n    backface-visibility:hidden;\n    -webkit-backface-visibility:hidden;\n    box-shadow:0 2px 0 rgba(0,0,0,.22),0 6px 14px rgba(0,0,0,.22);\n  }\n\n  /* card back: a two-tone lattice, drawn entirely with gradients */\n  .back{\n    background:\n      repeating-linear-gradient(45deg, var(--ink) 0 3px, transparent 3px 11px),\n      repeating-linear-gradient(-45deg, var(--ink-soft) 0 3px, transparent 3px 11px),\n      var(--card);\n    border:3px solid var(--card);\n  }\n  .back::after{\n    content:\"\";\n    position:absolute;\n    inset:7px;\n    border-radius:4px;\n    border:2px solid rgba(251,246,234,.9);\n    box-shadow:inset 0 0 0 2px var(--ink);\n  }\n\n  .front{\n    transform:rotateY(180deg);\n    background:var(--card);\n    border:2px solid rgba(34,64,111,.16);\n    font-size:46px;\n    line-height:1;\n  }\n  .front::before{\n    content:\"\";\n    position:absolute;\n    inset:0;\n    border-radius:7px;\n    background:var(--tint,transparent);\n    opacity:.2;\n  }\n  .front span{position:relative}\n\n  .card.done .front{\n    border-color:var(--gold);\n    box-shadow:0 0 0 3px rgba(217,164,65,.55),0 2px 0 rgba(0,0,0,.18);\n  }\n  .card.done{animation:settle 420ms ease-out}\n  @keyframes settle{40%{transform:scale(1.05)}100%{transform:scale(1)}}\n  .card.miss .inner{animation:shake 380ms ease-in-out}\n  @keyframes shake{\n    20%{transform:rotateY(180deg) translateX(-5px)}\n    50%{transform:rotateY(180deg) translateX(5px)}\n    80%{transform:rotateY(180deg) translateX(-3px)}\n    100%{transform:rotateY(180deg) translateX(0)}\n  }\n\n  .overlay{\n    position:absolute;\n    inset:-10px;\n    display:grid;\n    place-items:center;\n    text-align:center;\n    border-radius:12px;\n    background:rgba(15,43,38,.9);\n    z-index:5;\n  }\n  .overlay.hidden{display:none}\n  .overlay h2{margin:0 0 6px;font-size:24px;font-weight:800}\n  .overlay .line{margin:0;font-size:12.5px;font-weight:600;color:#bcdcd2;line-height:1.9}\n  .overlay .line b{color:var(--cream);font-variant-numeric:tabular-nums}\n  .overlay .flag{\n    display:inline-block;\n    margin:10px 0 2px;\n    background:var(--gold);\n    color:#241a05;\n    font-size:9.5px;\n    font-weight:800;\n    letter-spacing:.16em;\n    text-transform:uppercase;\n    padding:4px 9px;\n    border-radius:4px;\n  }\n  .overlay button{margin-top:16px}\n  .hidden{display:none}\n\n  .hint{margin:0;font-size:11px;font-weight:600;color:#bcdcd2;line-height:1.7}\n  kbd{\n    font:inherit;font-size:10px;font-weight:700;color:var(--cream);\n    border:1px solid rgba(247,240,224,.35);border-radius:4px;padding:1px 5px;\n  }\n  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}\n\n  @media (max-width:760px){\n    .table{display:block;width:100%;max-width:440px}\n    .table > .stage{width:auto}\n    header{flex-direction:row;align-items:flex-end;justify-content:space-between;margin-bottom:12px}\n    .stats{width:auto}\n    .toolbar{flex-direction:row;align-items:center;justify-content:space-between;margin-bottom:12px}\n    button{width:auto}\n    .hint{margin-top:12px;text-align:center}\n  }\n  @media (prefers-reduced-motion:reduce){\n    .inner{transition:none}\n    .card.done,.card.miss .inner{animation:none}\n  }", body: "<main class=\"table\">\n    <header>\n      <div>\n        <h1>Memory Match</h1>\n        <p class=\"sub\" id=\"sub\">Find all 8 pairs</p>\n      </div>\n      <div class=\"stats\">\n        <div class=\"stat\"><div class=\"k\">Moves</div><div class=\"v\" id=\"moves\">0</div></div>\n        <div class=\"stat\"><div class=\"k\">Time</div><div class=\"v\" id=\"time\">0:00</div></div>\n      </div>\n    </header>\n\n    <div class=\"toolbar\">\n      <p class=\"best\" id=\"best\">Best <b>&mdash;</b></p>\n      <button id=\"restart\" type=\"button\">New deal</button>\n    </div>\n\n    <div class=\"stage\">\n      <div class=\"board\" id=\"board\" role=\"group\" aria-label=\"Memory board\"></div>\n\n      <div class=\"overlay hidden\" id=\"ovWin\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"winTitle\">\n      <div>\n        <h2 id=\"winTitle\">All matched</h2>\n        <p class=\"line\">Moves <b id=\"winMoves\">0</b> &nbsp;·&nbsp; Time <b id=\"winTime\">0:00</b></p>\n        <p class=\"line\" id=\"winBest\">Best 0 moves</p>\n        <div><span class=\"flag hidden\" id=\"winFlag\">New best</span></div>\n        <div><button id=\"again\" type=\"button\">Play again</button></div>\n        </div>\n      </div>\n    </div>\n\n    <p class=\"hint\">\n      Click a card, or <kbd>Tab</kbd> to the grid and use <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd>,\n      then <kbd>Enter</kbd> to turn it over.\n    </p>\n\n    <p class=\"sr\" id=\"live\" role=\"status\" aria-live=\"polite\"></p>\n  </main>", js: "\n  'use strict';\n\n  /* ---------------- deck ---------------- */\n  const FACES = [\n    { g:'🚀', n:'rocket',    t:'#3b6fd4' }, { g:'🐙', n:'octopus',   t:'#c2568f' },\n    { g:'🍕', n:'pizza',     t:'#e08a2e' }, { g:'🌵', n:'cactus',    t:'#3f9160' },\n    { g:'🦊', n:'fox',       t:'#e0722c' }, { g:'⚡', n:'lightning', t:'#d8b21f' },\n    { g:'🌙', n:'moon',      t:'#6b6cc4' }, { g:'🎩', n:'top hat',   t:'#4a4a55' },\n    { g:'🐝', n:'bee',       t:'#c9a227' }, { g:'🍄', n:'mushroom',  t:'#cf4a4a' },\n    { g:'🔔', n:'bell',      t:'#b8892b' }, { g:'🪁', n:'kite',      t:'#2f9bb5' },\n    { g:'🐳', n:'whale',     t:'#3d7fb8' }, { g:'🧊', n:'ice cube',  t:'#5ba8c4' },\n    { g:'🌻', n:'sunflower', t:'#d9a12a' }, { g:'🎸', n:'guitar',    t:'#a4562f' },\n    { g:'🦖', n:'dinosaur',  t:'#4f9b4a' }, { g:'🍋', n:'lemon',     t:'#cbb020' }\n  ];\n\n  /* ---------------- levels ----------------\n     One entry per grid. rows * cols must be even, and pairs must not exceed\n     the number of faces above. Add a bigger grid by adding an entry here. */\n  const LEVELS = {\n    classic: { cols: 4, rows: 4, label: '4 × 4' }\n  };\n  const DEFAULT_LEVEL = 'classic';\n\n  const MISMATCH_MS = 750;          // how long a wrong pair stays visible\n\n  /* ---------------- storage (memory fallback if blocked) ---------------- */\n  const store = (function () {\n    try {\n      localStorage.setItem('__t', '1'); localStorage.removeItem('__t');\n      return { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },\n               set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };\n    } catch (e) {\n      const m = {};\n      return { get: k => (k in m ? m[k] : null), set: (k, v) => { m[k] = v; } };\n    }\n  })();\n\n  /* ---------------- dom ---------------- */\n  const boardEl = document.getElementById('board');\n  const movesEl = document.getElementById('moves');\n  const timeEl  = document.getElementById('time');\n  const bestEl  = document.getElementById('best');\n  const subEl   = document.getElementById('sub');\n  const liveEl  = document.getElementById('live');\n  const ovWin   = document.getElementById('ovWin');\n\n  /* ---------------- state ---------------- */\n  let level, cards, faceUp, moves, matched, locked, startedAt, endedAt, ticker, unlockTimer;\n\n  const bestKey = () => 'memory.best.' + level.cols + 'x' + level.rows;\n\n  /* Fisher-Yates: walk from the end, swap each item with a uniformly chosen\n     index at or before it. Every permutation is equally likely. */\n  function shuffle(a) {\n    for (let i = a.length - 1; i > 0; i--) {\n      const j = Math.floor(Math.random() * (i + 1));\n      const t = a[i]; a[i] = a[j]; a[j] = t;\n    }\n    return a;\n  }\n\n  function buildDeck() {\n    const pairs = (level.cols * level.rows) / 2;\n    const deck = [];\n    for (let i = 0; i < pairs; i++) deck.push(FACES[i], FACES[i]);\n    return shuffle(deck);\n  }\n\n  function newGame(keepLevel) {\n    if (!keepLevel) level = LEVELS[DEFAULT_LEVEL];\n    clearTimeout(unlockTimer); unlockTimer = null;\n    clearInterval(ticker); ticker = null;\n\n    const deck = buildDeck();\n    cards = [];\n    faceUp = [];\n    moves = 0; matched = 0; locked = false;\n    startedAt = 0; endedAt = 0;\n\n    boardEl.style.setProperty('--cols', level.cols);\n    boardEl.innerHTML = '';\n    deck.forEach((face, i) => {\n      const el = document.createElement('button');\n      el.type = 'button';\n      el.className = 'card';\n      el.dataset.i = String(i);\n      el.tabIndex = i === 0 ? 0 : -1;\n      el.innerHTML =\n        '<span class=\"inner\">' +\n          '<span class=\"face back\" aria-hidden=\"true\"></span>' +\n          '<span class=\"face front\" aria-hidden=\"true\" style=\"--tint:' + face.t + '\"><span>' + face.g + '</span></span>' +\n        '</span>';\n      boardEl.appendChild(el);\n      cards.push({ i, face, el, state: 'down' });\n    });\n    for (const card of cards) label(card);\n\n    subEl.textContent = 'Find all ' + (level.cols * level.rows) / 2 + ' pairs';\n    ovWin.classList.add('hidden');\n    document.getElementById('winFlag').classList.add('hidden');\n    movesEl.textContent = '0';\n    timeEl.textContent = '0:00';\n    showBest();\n    say('New deal. ' + cards.length + ' cards, all face down.');\n  }\n\n  function label(card) {\n    const pos = 'card ' + (card.i + 1) + ' of ' + cards.length;\n    if (card.state === 'down') {\n      card.el.setAttribute('aria-label', 'Face down, ' + pos);\n      card.el.removeAttribute('aria-disabled');\n    } else if (card.state === 'up') {\n      card.el.setAttribute('aria-label', card.face.n + ', face up, ' + pos);\n    } else {\n      card.el.setAttribute('aria-label', card.face.n + ', matched, ' + pos);\n      card.el.setAttribute('aria-disabled', 'true');\n    }\n  }\n\n  /* ---------------- the flip lock ----------------\n     `locked` is true only while a mismatched pair is on show. Every other\n     rejection (already up, already matched, same card twice) is handled by the\n     card's own state, so the lock has exactly one job. */\n  function flip(card) {\n    if (locked) return false;                       // a wrong pair is still showing\n    if (card.state !== 'down') return false;        // already up, or already matched\n    if (faceUp.length >= 2) return false;           // belt and braces: never a third\n\n    if (!startedAt) startClock();\n\n    card.state = 'up';\n    card.el.classList.add('up');\n    label(card);\n    faceUp.push(card);\n    say(card.face.n + ' turned over.');\n\n    if (faceUp.length === 2) {\n      moves++;\n      movesEl.textContent = String(moves);\n      const [a, b] = faceUp;\n      if (a.face === b.face) resolveMatch(a, b);\n      else resolveMiss(a, b);\n    }\n    return true;\n  }\n\n  function resolveMatch(a, b) {\n    faceUp = [];\n    for (const c of [a, b]) {\n      c.state = 'done';\n      c.el.classList.remove('up');\n      c.el.classList.add('done');\n      label(c);\n    }\n    matched++;\n    say('Matched ' + a.face.n + '. ' + matched + ' of ' + cards.length / 2 + ' pairs found.');\n    if (matched === cards.length / 2) win();\n  }\n\n  function resolveMiss(a, b) {\n    locked = true;                                  // the lock goes on here\n    a.el.classList.add('miss');\n    b.el.classList.add('miss');\n    say('No match.');\n    unlockTimer = setTimeout(function () {\n      unlockTimer = null;\n      for (const c of [a, b]) {\n        c.state = 'down';\n        c.el.classList.remove('up', 'miss');\n        label(c);\n      }\n      faceUp = [];\n      locked = false;                               // and comes off only here\n    }, MISMATCH_MS);\n  }\n\n  /* ---------------- clock ---------------- */\n  function startClock() {\n    startedAt = Date.now();\n    ticker = setInterval(function () {\n      if (!endedAt) timeEl.textContent = fmt(elapsed());\n    }, 250);\n  }\n  function elapsed() {\n    if (!startedAt) return 0;\n    return Math.floor(((endedAt || Date.now()) - startedAt) / 1000);\n  }\n  function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }\n\n  /* ---------------- win ---------------- */\n  function better(a, b) {                            // fewer moves wins; ties go to the faster time\n    if (!b) return true;\n    if (a.moves !== b.moves) return a.moves < b.moves;\n    return a.time < b.time;\n  }\n\n  function win() {\n    endedAt = Date.now();\n    clearInterval(ticker); ticker = null;\n    const result = { moves: moves, time: elapsed() };\n    const prev = store.get(bestKey());\n    const isBest = better(result, prev);\n    if (isBest) store.set(bestKey(), result);\n\n    timeEl.textContent = fmt(result.time);\n    document.getElementById('winMoves').textContent = result.moves;\n    document.getElementById('winTime').textContent = fmt(result.time);\n    const b = isBest ? result : prev;\n    document.getElementById('winBest').innerHTML =\n      'Best <b>' + b.moves + '</b> moves in <b>' + fmt(b.time) + '</b>';\n    document.getElementById('winFlag').classList.toggle('hidden', !isBest);\n    ovWin.classList.remove('hidden');\n    showBest();\n    say('All pairs found in ' + result.moves + ' moves and ' + result.time + ' seconds.'\n        + (isBest ? ' That is a new best.' : ''));\n    document.getElementById('again').focus();\n  }\n\n  function showBest() {\n    const b = store.get(bestKey());\n    bestEl.innerHTML = b ? 'Best <b>' + b.moves + '</b> moves · <b>' + fmt(b.time) + '</b>'\n                         : 'Best <b>&mdash;</b>';\n  }\n\n  function say(msg) { liveEl.textContent = msg; }\n\n  /* ---------------- input ---------------- */\n  boardEl.addEventListener('click', function (e) {\n    const el = e.target.closest ? e.target.closest('.card') : null;\n    if (!el) return;\n    const card = cards[Number(el.dataset.i)];\n    if (card) { focusCard(card); flip(card); }\n  });\n\n  boardEl.addEventListener('keydown', function (e) {\n    const el = e.target.closest ? e.target.closest('.card') : null;\n    if (!el) return;\n    const i = Number(el.dataset.i);\n    const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: level.cols, ArrowUp: -level.cols }[e.key];\n\n    if (step !== undefined) {\n      e.preventDefault();\n      let j = i + step;\n      if (e.key === 'ArrowRight' && i % level.cols === level.cols - 1) j = i - (level.cols - 1);\n      if (e.key === 'ArrowLeft'  && i % level.cols === 0)              j = i + (level.cols - 1);\n      if (j < 0 || j >= cards.length) j = i;\n      focusCard(cards[j]);\n      return;\n    }\n    if (e.key === 'Home')  { e.preventDefault(); focusCard(cards[0]); return; }\n    if (e.key === 'End')   { e.preventDefault(); focusCard(cards[cards.length - 1]); return; }\n    // Enter and Space already fire click on a <button>, so nothing to do here\n  });\n\n  function focusCard(card) {\n    for (const c of cards) c.el.tabIndex = c === card ? 0 : -1;\n    card.el.focus();\n  }\n\n  document.getElementById('restart').addEventListener('click', function () { newGame(true); });\n  document.getElementById('again').addEventListener('click', function () {\n    newGame(true);\n    const first = cards[0];\n    if (first) focusCard(first);\n  });\n\n  newGame(false);\n" },
  "minesweeper": { css: "\n  :root{\n    --face:#c0c0c0;\n    --lite:#ffffff;\n    --dark:#7b7b7b;\n    --darker:#5a5a5a;\n    --led-off:#3a0d0d;\n    --led-on:#ff2c2c;\n    --sans:ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",Tahoma,sans-serif;\n  }\n  *{box-sizing:border-box}\n  body{\n    margin:0;\n    min-height:100vh;\n    background:#2e6d70;\n    color:#1a1a1a;\n    font-family:var(--sans);\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    padding:18px 12px;\n    -webkit-tap-highlight-color:transparent;\n  }\n  .app{max-width:100%}\n\n  .levels{display:flex;gap:6px;margin-bottom:10px;justify-content:center}\n  .lvl{\n    font:inherit;font-size:11.5px;font-weight:700;\n    background:var(--face);color:#1a1a1a;\n    border:2px solid;border-color:var(--lite) var(--darker) var(--darker) var(--lite);\n    padding:5px 11px;cursor:pointer;\n  }\n  .lvl[aria-pressed=\"true\"]{\n    border-color:var(--darker) var(--lite) var(--lite) var(--darker);\n    background:#b4b4b4;\n  }\n  .lvl:focus-visible{outline:2px solid #101010;outline-offset:2px}\n\n  .cabinet{\n    background:var(--face);\n    border:3px solid;border-color:var(--lite) var(--darker) var(--darker) var(--lite);\n    padding:6px;\n    max-width:100%;\n  }\n\n  .panel{\n    display:flex;align-items:center;justify-content:space-between;gap:10px;\n    border:3px solid;border-color:var(--dark) var(--lite) var(--lite) var(--dark);\n    padding:5px 6px;margin-bottom:6px;\n  }\n  .led{\n    display:flex;gap:1px;background:#000;padding:2px 3px;\n    border:1px solid;border-color:var(--dark) var(--lite) var(--lite) var(--dark);\n  }\n  .led svg{display:block;height:25px;width:14px}\n  .seg{fill:var(--led-off)}\n  .seg.on{fill:var(--led-on)}\n\n  .facebtn{\n    width:30px;height:30px;padding:0;flex:none;\n    background:var(--face);cursor:pointer;\n    border:2px solid;border-color:var(--lite) var(--darker) var(--darker) var(--lite);\n  }\n  .facebtn:active{border-color:var(--darker) var(--lite) var(--lite) var(--darker)}\n  .facebtn:focus-visible{outline:2px solid #101010;outline-offset:2px}\n  .facebtn svg{display:block;width:100%;height:100%}\n\n  .frame{\n    border:3px solid;border-color:var(--dark) var(--lite) var(--lite) var(--dark);\n    overflow:auto;\n    max-width:100%;\n  }\n  .grid{\n    display:grid;\n    grid-template-columns:repeat(var(--cols),var(--cell));\n    width:max-content;\n  }\n\n  .cell{\n    all:unset;\n    box-sizing:border-box;\n    position:relative;\n    width:var(--cell);\n    height:var(--cell);\n    display:block;\n    background:var(--face);\n    border:2px solid;border-color:var(--lite) var(--dark) var(--dark) var(--lite);\n    cursor:pointer;\n    font-weight:800;\n    font-size:calc(var(--cell) * .62);\n    line-height:1;\n    text-align:center;\n    font-variant-numeric:tabular-nums;\n    user-select:none;\n  }\n  .cell:focus-visible{outline:2px solid #101010;outline-offset:-2px;z-index:2}\n  .cell.open{\n    border:1px solid #9a9a9a;\n    background:var(--face);\n    cursor:default;\n    display:grid;place-items:center;\n  }\n  .cell.boom{background:#e04a3a}\n\n  /* classic number palette, nudged just enough to clear AA on the grey */\n  .n1{color:#0000cc}.n2{color:#005200}.n3{color:#9e0000}.n4{color:#000080}\n  .n5{color:#7a0000}.n6{color:#005252}.n7{color:#000000}.n8{color:#4a4a4a}\n\n  /* flag: pole plus pennant, drawn with CSS only */\n  .cell.flag::before{\n    content:\"\";position:absolute;left:50%;top:22%;\n    width:2px;height:52%;margin-left:2px;background:#1a1a1a;\n  }\n  .cell.flag::after{\n    content:\"\";position:absolute;left:24%;top:20%;\n    border:calc(var(--cell) * .16) solid transparent;\n    border-left-width:0;\n    border-right-color:#d40000;\n  }\n  .cell.flag .base{\n    position:absolute;left:26%;bottom:18%;width:48%;height:3px;background:#1a1a1a;\n  }\n  .cell.wrong::before,.cell.wrong::after{content:\"\";position:absolute;left:50%;top:14%;\n    width:2px;height:72%;margin-left:-1px;background:#c50000;transform-origin:center}\n  .cell.wrong::before{transform:rotate(45deg)}\n  .cell.wrong::after{transform:rotate(-45deg);border:0}\n\n  /* mine: disc with a highlight and crossed spikes */\n  .cell.bomb::before{\n    content:\"\";position:absolute;inset:26%;border-radius:50%;\n    background:#111;box-shadow:inset 2px 2px 0 rgba(255,255,255,.75);\n  }\n  .cell.bomb::after{\n    content:\"\";position:absolute;inset:16%;\n    background:\n      linear-gradient(#111,#111) center/100% 2px no-repeat,\n      linear-gradient(#111,#111) center/2px 100% no-repeat;\n  }\n\n  .status{\n    margin:10px 0 0;text-align:center;font-size:11.5px;font-weight:600;color:#d9efef;\n    line-height:1.6;\n  }\n  kbd{\n    font:inherit;font-size:10px;font-weight:700;color:#eafafa;\n    border:1px solid rgba(234,250,250,.4);border-radius:3px;padding:1px 5px;\n  }\n  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}", body: "<main class=\"app\">\n    <div class=\"levels\" role=\"group\" aria-label=\"Difficulty\">\n      <button class=\"lvl\" type=\"button\" data-lvl=\"beginner\"     aria-pressed=\"true\">Beginner</button>\n      <button class=\"lvl\" type=\"button\" data-lvl=\"intermediate\" aria-pressed=\"false\">Intermediate</button>\n      <button class=\"lvl\" type=\"button\" data-lvl=\"expert\"       aria-pressed=\"false\">Expert</button>\n    </div>\n\n    <div class=\"cabinet\">\n      <div class=\"panel\">\n        <div class=\"led\" id=\"mineLed\" aria-hidden=\"true\"></div>\n        <button class=\"facebtn\" id=\"face\" type=\"button\" aria-label=\"New game\"></button>\n        <div class=\"led\" id=\"timeLed\" aria-hidden=\"true\"></div>\n      </div>\n      <div class=\"frame\">\n        <div class=\"grid\" id=\"grid\" role=\"group\" aria-label=\"Minefield\"></div>\n      </div>\n    </div>\n\n    <p class=\"status\">\n      Left-click reveals &middot; right-click or long-press flags &middot; middle-click a number to chord<br>\n      Keyboard: <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> move,\n      <kbd>Enter</kbd> reveal, <kbd>F</kbd> flag, <kbd>C</kbd> chord\n    </p>\n\n    <p class=\"sr\" id=\"live\" role=\"status\" aria-live=\"polite\"></p>\n  </main>", js: "\n  'use strict';\n\n  const LEVELS = {\n    beginner:     { cols: 9,  rows: 9,  mines: 10, cell: 28 },\n    intermediate: { cols: 16, rows: 16, mines: 40, cell: 25 },\n    expert:       { cols: 30, rows: 16, mines: 99, cell: 22 }\n  };\n\n  /* ---------------- dom ---------------- */\n  const gridEl = document.getElementById('grid');\n  const faceEl = document.getElementById('face');\n  const mineLed = document.getElementById('mineLed');\n  const timeLed = document.getElementById('timeLed');\n  const liveEl = document.getElementById('live');\n\n  /* ---------------- seven-segment LEDs ---------------- */\n  const SEG = { 0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',\n                6:'afgedc',7:'abc',8:'abcdefg',9:'abcfgd','-':'g' };\n  const SEG_RECT = {\n    a:[3,2,14,3], b:[17,4,3,9], c:[17,15,3,9], d:[3,25,14,3],\n    e:[1,15,3,9], f:[1,4,3,9],  g:[3,13,14,3]\n  };\n  function makeDigit() {\n    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n    svg.setAttribute('viewBox', '0 0 21 30');\n    for (const k of 'abcdefg') {\n      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');\n      const [x, y, w, h] = SEG_RECT[k];\n      r.setAttribute('x', x); r.setAttribute('y', y);\n      r.setAttribute('width', w); r.setAttribute('height', h);\n      r.setAttribute('class', 'seg');\n      r.dataset.s = k;\n      svg.appendChild(r);\n    }\n    return svg;\n  }\n  function buildLed(host) {\n    host.innerHTML = '';\n    const digits = [];\n    for (let i = 0; i < 3; i++) { const d = makeDigit(); host.appendChild(d); digits.push(d); }\n    return digits;\n  }\n  function showLed(digits, value) {\n    const clamped = Math.max(-99, Math.min(999, value | 0));\n    const neg = clamped < 0;\n    const text = (neg ? '-' : '') + String(Math.abs(clamped)).padStart(neg ? 2 : 3, '0');\n    for (let i = 0; i < 3; i++) {\n      const on = SEG[text[i]] || '';\n      for (const rect of digits[i].childNodes)\n        rect.setAttribute('class', on.indexOf(rect.dataset.s) >= 0 ? 'seg on' : 'seg');\n    }\n  }\n  const mineDigits = buildLed(mineLed), timeDigits = buildLed(timeLed);\n\n  /* ---------------- faces ---------------- */\n  const FACES = {\n    smile: '<circle cx=\"16\" cy=\"16\" r=\"13\" fill=\"#ffdc00\" stroke=\"#111\" stroke-width=\"2\"/>' +\n           '<circle cx=\"11\" cy=\"13\" r=\"1.8\" fill=\"#111\"/><circle cx=\"21\" cy=\"13\" r=\"1.8\" fill=\"#111\"/>' +\n           '<path d=\"M9 19a7 7 0 0 0 14 0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/>',\n    ooh:   '<circle cx=\"16\" cy=\"16\" r=\"13\" fill=\"#ffdc00\" stroke=\"#111\" stroke-width=\"2\"/>' +\n           '<circle cx=\"11\" cy=\"13\" r=\"1.8\" fill=\"#111\"/><circle cx=\"21\" cy=\"13\" r=\"1.8\" fill=\"#111\"/>' +\n           '<circle cx=\"16\" cy=\"21\" r=\"3.2\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/>',\n    dead:  '<circle cx=\"16\" cy=\"16\" r=\"13\" fill=\"#ffdc00\" stroke=\"#111\" stroke-width=\"2\"/>' +\n           '<path d=\"M8.5 10.5l5 5M13.5 10.5l-5 5M18.5 10.5l5 5M23.5 10.5l-5 5\" stroke=\"#111\" stroke-width=\"2\"/>' +\n           '<path d=\"M9 23a7 7 0 0 1 14 0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/>',\n    win:   '<circle cx=\"16\" cy=\"16\" r=\"13\" fill=\"#ffdc00\" stroke=\"#111\" stroke-width=\"2\"/>' +\n           '<path d=\"M6 12h8v4a2 2 0 0 1-4 0zM18 12h8v4a2 2 0 0 1-4 0z\" fill=\"#111\"/>' +\n           '<path d=\"M14 13h4\" stroke=\"#111\" stroke-width=\"2\"/>' +\n           '<path d=\"M9 19a7 7 0 0 0 14 0\" fill=\"none\" stroke=\"#111\" stroke-width=\"2\"/>'\n  };\n  function setFace(k) {\n    faceEl.innerHTML = '<svg viewBox=\"0 0 32 32\">' + FACES[k] + '</svg>';\n  }\n\n  /* ---------------- state ---------------- */\n  let level, cells, cols, rows, mineCount, placed, flags, revealed, state, startedAt, endedAt, ticker, cursor;\n\n  function idx(r, c) { return r * cols + c; }\n\n  function neighbors(i) {\n    const r = (i / cols) | 0, c = i % cols, out = [];\n    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {\n      if (!dr && !dc) continue;\n      const nr = r + dr, nc = c + dc;\n      if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue;\n      out.push(idx(nr, nc));\n    }\n    return out;\n  }\n\n  function newGame(key) {\n    if (key) level = key;\n    const L = LEVELS[level];\n    cols = L.cols; rows = L.rows; mineCount = L.mines;\n    placed = false; flags = 0; revealed = 0; state = 'ready';\n    startedAt = 0; endedAt = 0;\n    clearInterval(ticker); ticker = null;\n    cursor = 0;\n\n    cells = [];\n    gridEl.style.setProperty('--cols', cols);\n    gridEl.style.setProperty('--cell',\n      'max(16px, min(' + L.cell + 'px, calc((100vw - 54px) / ' + cols + ')))');\n    gridEl.innerHTML = '';\n    for (let i = 0; i < cols * rows; i++) {\n      const el = document.createElement('button');\n      el.type = 'button';\n      el.className = 'cell';\n      el.dataset.i = String(i);\n      el.tabIndex = i === 0 ? 0 : -1;\n      gridEl.appendChild(el);\n      cells.push({ i, mine: false, count: 0, state: 'hidden', el: el });\n    }\n    for (const cell of cells) labelCell(cell);\n\n    setFace('smile');\n    showLed(mineDigits, mineCount);\n    showLed(timeDigits, 0);\n    document.querySelectorAll('.lvl').forEach(function (b) {\n      b.setAttribute('aria-pressed', String(b.dataset.lvl === level));\n    });\n    say('New game. ' + cols + ' by ' + rows + ' with ' + mineCount + ' mines.');\n  }\n\n  function labelCell(cell) {\n    const where = 'row ' + (((cell.i / cols) | 0) + 1) + ' column ' + ((cell.i % cols) + 1);\n    let what;\n    if (cell.state === 'flagged') what = 'flagged'     // covers already-open and flagged\n      openCell(cell);\n      if (cell.count === 0) {\n        const nb = neighbors(i);\n        for (let k = 0; k < nb.length; k++) if (cells[nb[k]].state === 'hidden') stack.push(nb[k]);\n      }\n    }\n  }\n\n  function openCell(cell) {\n    cell.state = 'revealed';\n    revealed++;\n    cell.el.classList.add('open');\n    if (cell.count) {\n      cell.el.textContent = String(cell.count);\n      cell.el.classList.add('n' + cell.count);\n    }\n    labelCell(cell);\n  }\n\n  /* ---------------- actions ---------------- */\n  function reveal(i) {\n    if (state === 'won' || state === 'lost') return;\n    const cell = cells[i];\n    if (cell.state !== 'hidden') return;\n\n    if (!placed) { placeMines(i); startClock(); state = 'playing'; }\n\n    if (cell.mine) { boom(cell); return; }\n    floodOpen(i);\n    say(cell.count ? cell.count + ' adjacent mines.' : 'Opened an empty area.');\n    checkWin();\n  }\n\n  function toggleFlag(i) {\n    if (state === 'won' || state === 'lost') return;\n    const cell = cells[i];\n    if (cell.state === 'revealed') return;\n    if (cell.state === 'flagged') {\n      cell.state = 'hidden';\n      cell.el.classList.remove('flag');\n      cell.el.innerHTML = '';\n      flags--;\n      say('Flag removed.');\n    } else {\n      cell.state = 'flagged';\n      cell.el.classList.add('flag');\n      cell.el.innerHTML = '<span class=\"base\"></span>';\n      flags++;\n      say('Flag placed. ' + (mineCount - flags) + ' left.');\n    }\n    labelCell(cell);\n    showLed(mineDigits, mineCount - flags);\n  }\n\n  function chord(i) {\n    if (state === 'won' || state === 'lost') return;\n    const cell = cells[i];\n    if (cell.state !== 'revealed' || cell.count === 0) return;\n    const nb = neighbors(i);\n    let f = 0;\n    for (const j of nb) if (cells[j].state === 'flagged') f++;\n    if (f !== cell.count) return;\n    for (const j of nb) if (cells[j].state === 'hidden') {\n      if (cells[j].mine) { boom(cells[j]); return; }\n      floodOpen(j);\n    }\n    checkWin();\n  }\n\n  function boom(cell) {\n    state = 'lost';\n    stopClock();\n    setFace('dead');\n    cell.el.classList.add('boom');\n    for (const c of cells) {\n      if (c.mine && c.state !== 'flagged') {\n        c.state = 'revealed';\n        c.el.classList.add('open', 'bomb');\n        c.el.innerHTML = '';\n      } else if (c.state === 'flagged' && !c.mine) {\n        c.el.classList.remove('flag');\n        c.el.classList.add('open', 'wrong');\n        c.el.innerHTML = '';\n      }\n      labelCell(c);\n    }\n    say('You hit a mine. Game over.');\n  }\n\n  function checkWin() {\n    if (revealed !== cells.length - mineCount) return;\n    state = 'won';\n    stopClock();\n    setFace('win');\n    for (const c of cells) if (c.mine && c.state !== 'flagged') {\n      c.state = 'flagged';\n      c.el.classList.add('flag');\n      c.el.innerHTML = '<span class=\"base\"></span>';\n      flags++;\n      labelCell(c);\n    }\n    showLed(mineDigits, mineCount - flags);\n    say('All clear. You win in ' + elapsed() + ' seconds.');\n  }\n\n  /* ---------------- clock ---------------- */\n  function startClock() {\n    startedAt = Date.now(); endedAt = 0;\n    ticker = setInterval(function () { showLed(timeDigits, elapsed()); }, 200);\n  }\n  function stopClock() { clearInterval(ticker); ticker = null; endedAt = Date.now(); showLed(timeDigits, elapsed()); }\n  function elapsed() {\n    if (!startedAt) return 0;\n    return Math.min(999, Math.floor(((endedAt || Date.now()) - startedAt) / 1000));\n  }\n\n  function say(m) { liveEl.textContent = m; }\n\n  /* ---------------- input ---------------- */\n  gridEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });\n\n  let pressTimer = null, longFired = false, chordArmed = false;\n\n  function cellFrom(e) {\n    const el = e.target && e.target.closest ? e.target.closest('.cell') : null;\n    return el ? cells[Number(el.dataset.i)] : null;   "fifteen": { css: "\n  :root{\n    --slate:#161b22;\n    --well:#0e1218;\n    --edge:#252d38;\n    --ink:#e8edf5;\n    --muted:#8b98ab;\n    --gap:clamp(5px,1.6vw,9px);\n    --sans:ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",Roboto,\"Helvetica Neue\",sans-serif;\n  }\n  *{box-sizing:border-box}\n  body{\n    margin:0;\n    min-height:100vh;\n    background:radial-gradient(120% 90% at 50% -10%,#1e2530 0%,var(--slate) 55%,#0d1116 100%);\n    color:var(--ink);\n    font-family:var(--sans);\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    padding:20px 16px;\n    -webkit-tap-highlight-color:transparent;\n  }\n  .wrap{width:100%;max-width:420px}\n\n  header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:12px}\n  h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.015em;line-height:1}\n  .sub{margin:5px 0 0;font-size:11.5px;font-weight:600;color:var(--muted)}\n  .stats{display:flex;gap:8px}\n  .stat{\n    background:rgba(255,255,255,.05);\n    border:1px solid var(--edge);\n    border-radius:9px;\n    padding:6px 12px 7px;\n    text-align:center;\n    min-width:72px;\n  }\n  .stat .k{font-size:8.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}\n  .stat .v{font-size:19px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}\n\n  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}\n  .sizes{display:flex;gap:6px}\n  button{\n    font:inherit;font-size:12px;font-weight:700;\n    color:var(--ink);background:rgba(255,255,255,.07);\n    border:1px solid var(--edge);border-radius:8px;\n    padding:8px 13px;cursor:pointer;\n  }\n  button:hover{background:rgba(255,255,255,.13)}\n  button[aria-pressed=\"true\"]{background:var(--ink);color:#11151b;border-color:var(--ink)}\n  button.primary{background:var(--ink);color:#11151b;border-color:var(--ink)}\n  button.primary:hover{background:#fff}\n  button:focu
