ht, y:cur.y, w:(cur.x+cur.w)-right, hue:cur.hue, vx:1.6, vy:-1.2, spin:0.08, a:0, life:70});\n      }\n      cur.x=left; cur.w=overlap; score+=1;\n    }\n    stack.push({x:cur.x,w:cur.w,y:cur.y,hue:cur.hue});\n    $('score').textContent=score;\n    if(score>best){ best=score; store.set('tower.best',best); $('best').textContent=best; }\n    // scroll the world down so the tower keeps climbing\n    if(stack.length>10){ for(const b of stack) b.y+=BH; }\n    speed=Math.min(6.4, 2.1+stack.length*0.12);\n    spawn();\n  }\n\n  function gameOver(){\n    state='over'; cancelAnimationFrame(raf);\n    draw(); overlay('Missed! '+score+' \u2014 tap to retry');\n  }\n\n  function draw(){\n    const c=ctx; c.clearRect(0,0,W,H);\n    for(const b of stack){\n      if(b.y>H+BH||b.y<-BH) continue;\n      paintBlock(c,b, false);\n    }\n    // debris falls behind the tower\n    for(const d of debris){\n      c.save(); c.translate(d.x+d.w/2, d.y+BH/2); c.rotate(d.a);\n      c.globalAlpha=Math.max(0,Math.min(1,d.life/70));\n      const g=c.createLinearGradient(-d.w/2,0,d.w/2,BH);\n      g.addColorStop(0,'hsl('+d.hue+' 92% 66%)');\n      g.addColorStop(1,'hsl('+((d.hue+28)%360)+' 92% 56%)');\n      c.fillStyle=g; roundRect(c,-d.w/2,-BH/2,d.w,BH-3,5); c.fill();\n      c.globalAlpha=1; c.restore();\n    }\n    if(state!=='over') paintBlock(c,cur, flashT>0);\n    // ground line\n    c.strokeStyle='rgba(255,255,255,.14)'; c.lineWidth=2;\n    c.beginPath(); c.moveTo(0,H-32); c.lineTo(W,H-32); c.stroke();\n  }\n  function paintBlock(c,b,glow){\n    const g=c.createLinearGradient(b.x,b.y,b.x+b.w,b.y+BH);\n    g.addColorStop(0,'hsl('+b.hue+' 92% 66%)');\n    g.addColorStop(1,'hsl('+((b.hue+28)%360)+' 92% 56%)');\n    c.fillStyle=g;\n    if(glow){ c.shadowColor='hsl('+b.hue+' 100% 70%)'; c.shadowBlur=22; }\n    roundRect(c,b.x,b.y,b.w,BH-3,6); c.fill();\n    c.shadowBlur=0;\n    c.fillStyle='rgba(255,255,255,.22)';\n    roundRect(c,b.x+3,b.y+3,Math.max(0,b.w-6),6,3); c.fill();\n  }\n  function roundRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}\n  function overlay(t){\n    const c=ctx; c.fillStyle='rgba(10,6,20,.6)'; c.fillRect(0,0,W,H);\n    c.fillStyle='#fff'; c.font='700 17px Outfit,system-ui,sans-serif'; c.textAlign='center';\n    c.fillText(t,W/2,H/2);\n  }\n\n  cv.addEventListener('pointerdown',e=>{e.preventDefault();drop();});\n  window.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='ArrowDown'){e.preventDefault();drop();} });\n  reset();\n" },
  "taprush": { css: "\n  :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.6);--line:rgba(255,255,255,.16);--sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n  .wrap{width:100%;max-width:360px;text-align:center}\n  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}\n  h1{margin:0;font-size:18px;font-weight:800}\n  .hud{display:flex;gap:14px;font-family:var(--mono);font-weight:700;font-size:14px}\n  canvas{display:block;width:100%;border-radius:16px;background:linear-gradient(180deg,rgba(49,225,255,.08),rgba(155,92,255,.12));border:1px solid var(--line);cursor:pointer;touch-action:none}\n  .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:10px}\n", body: "<main class=\"wrap\">\n  <header><h1>Tap Rush</h1><div class=\"hud\"><span id=\"score\">0</span><span style=\"opacity:.6\">best <span id=\"best\">0</span></span></div></header>\n  <canvas id=\"c\" width=\"340\" height=\"480\"></canvas>\n  <p class=\"hint\">Tap the coloured tile before it reaches the bottom \u00b7 long streaks multiply your score \u00b7 keys A S D F</p>\n</main>", js: "\n  'use strict';\n  const $=id=>document.getElementById(id);\n  const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n    return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n    catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n  const cv=$('c'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;\n  const COLS=4, CW=W/COLS, RH=120;\n  const HUES=[330,266,196,150];\n  let rows, speed, score, best, state, raf, pulse, streak, combo;\n  best=store.get('tap.best')||0; $('best').textContent=best;\n\n  function reset(){\n    rows=[]; speed=2.4; score=0; pulse=0; streak=0; combo=1; state='ready';\n    for(let i=0;i<5;i++) rows.push(mkRow(-i*RH));\n    $('score').textContent='0';\n    draw(); overlay('Tap the coloured tile');\n  }\n  function mkRow(y){ const col=Math.random()*COLS|0; return {y,col,hit:false,hue:HUES[col]}; }\n  function start(){ if(state==='running')return; if(state==='over')reset(); state='running'; last=performance.now(); raf=requestAnimationFrame(loop); }\n\n  let last=0;\n  function loop(now){\n    if(state!=='running')return;\n    const dt=Math.min(2.5,(now-last)/16.67); last=now;\n    speed=Math.min(9,2.4+score*0.045);\n    for(const r of rows) r.y+=speed*dt;\n    if(pulse>0)pulse-=dt;\n    // a row that leaves the bottom un-hit ends the run\n    for(const r of rows){ if(!r.hit && r.y>H){ return gameOver('Missed one!'); } }\n    rows=rows.filter(r=>r.y<H+RH);\n    while(rows.length<5){\n      const top=Math.min(...rows.map(r=>r.y));\n      rows.push(mkRow(top-RH));\n    }\n    draw(); raf=requestAnimationFrame(loop);\n  }\n\n  function tapCol(col){\n    if(state!=='running'){ start(); return; }\n    // the lowest un-hit row is the live one\n    let live=null;\n    for(const r of rows) if(!r.hit && (!live||r.y>live.y)) live=r;\n    if(!live) return;\n    if(live.col===col){\n      live.hit=true; streak++; combo=Math.min(5,1+Math.floor(streak/6));\n      score+=combo; pulse=8;\n      $('score').textContent=score;\n      if(score>best){ best=score; store.set('tap.best',best); $('best').textContent=best; }\n    } else {\n      streak=0; gameOver('Wrong tile!');\n    }\n  }\n  function gameOver(msg){\n    state='over'; cancelAnimationFrame(raf);\n    draw(); overlay(msg+' '+score+' \u2014 tap to retry');\n  }\n\n  function draw(){\n    const c=ctx; c.clearRect(0,0,W,H);\n    // lane guides\n    c.strokeStyle='rgba(255,255,255,.07)'; c.lineWidth=1;\n    for(let i=1;i<COLS;i++){ c.beginPath(); c.moveTo(i*CW,0); c.lineTo(i*CW,H); c.stroke(); }\n    for(const r of rows){\n      const x=r.col*CW+5, y=r.y+4, w=CW-10, h=RH-10;\n      if(r.hit){\n        c.fillStyle='rgba(255,255,255,.08)';\n        roundRect(c,x,y,w,h,12); c.fill();\n      } else {\n        const g=c.createLinearGradient(x,y,x+w,y+h);\n        g.addColorStop(0,'hsl('+r.hue+' 92% 66%)');\n        g.addColorStop(1,'hsl('+((r.hue+30)%360)+' 92% 54%)');\n        c.fillStyle=g; roundRect(c,x,y,w,h,12); c.fill();\n        c.fillStyle='rgba(255,255,255,.2)';\n        roundRect(c,x+6,y+6,w-12,10,5); c.fill();\n      }\n    }\n    if(pulse>0){ c.fillStyle='rgba(255,255,255,'+(pulse/40)+')'; c.fillRect(0,0,W,H); }\n    if(state==='running'&&combo>1){\n      c.fillStyle='rgba(255,255,255,.9)'; c.font='800 15px Outfit,system-ui,sans-serif';\n      c.textAlign='center'; c.fillText('x'+combo, W/2, 26);\n    }\n  }\n  function roundRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}\n  function overlay(t){\n    const c=ctx; c.fillStyle='rgba(10,6,20,.62)'; c.fillRect(0,0,W,H);\n    c.fillStyle='#fff'; c.font='700 16px Outfit,system-ui,sans-serif'; c.textAlign='center';\n    c.fillText(t,W/2,H/2);\n  }\n\n  cv.addEventListener('pointerdown',e=>{\n    e.preventDefault();\n    const r=cv.getBoundingClientRect();\n    const col=Math.floor(((e.clientX-r.left)/r.width)*COLS);\n    tapCol(Math.max(0,Math.min(COLS-1,col)));\n  });\n  window.addEventListener('keydown',e=>{\n    const map={a:0,s:1,d:2,f:3,'1':0,'2':1,'3':2,'4':3};\n    const k=e.key.toLowerCase();\n    if(k in map){ e.preventDefault(); tapCol(map[k]); }\n    else if(e.key===' '){ e.preventDefault(); start(); }\n  });\n  reset();\n" },
  "skyhop": { css: "\n  :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.6);--line:rgba(255,255,255,.16);--sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n  .wrap{width:100%;max-width:360px;text-align:center}\n  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}\n  h1{margin:0;font-size:18px;font-weight:800}\n  .hud{display:flex;gap:14px;font-family:var(--mono);font-weight:700;font-size:14px}\n  canvas{display:block;width:100%;border-radius:16px;background:linear-gradient(180deg,rgba(49,225,255,.1),rgba(155,92,255,.14));border:1px solid var(--line);touch-action:none}\n  .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:10px}\n", body: "<main class=\"wrap\">\n  <header><h1>Sky Hop</h1><div class=\"hud\"><span id=\"score\">0</span><span style=\"opacity:.6\">best <span id=\"best\">0</span></span></div></header>\n  <canvas id=\"c\" width=\"340\" height=\"500\"></canvas>\n  <p class=\"hint\">\u2190 \u2192 or A D to steer \u00b7 green springs launch you higher \u00b7 pale platforms crumble</p>\n</main>", js: "\n  'use strict';\n  const $=id=>document.getElementById(id);\n  const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n    return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n    catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n  const cv=$('c'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;\n  const GRAV=0.34, BOUNCE=-11.2, MOVE=4.2, PW=54, PH=13;\n  let player, plats, score, best, state, raf, keys, camY, hue;\n  best=store.get('hop.best')||0; $('best').textContent=best;\n\n  function reset(){\n    player={x:W/2-14,y:H-120,w:28,h:28,vx:0,vy:BOUNCE};\n    plats=[]; score=0; camY=0; keys={}; hue=190;\n    plats.push({x:W/2-PW/2,y:H-80,w:PW,type:'solid'});\n    let y=H-80;\n    for(let i=0;i<14;i++){ y-=58+Math.random()*34; plats.push(mkPlat(y)); }\n    state='ready'; $('score').textContent='0';\n    draw(); overlay('Press \u2190 \u2192 or tap to start');\n  }\n  function mkPlat(y){\n    const r=Math.random();\n    const type = r<0.13?'move' : r<0.19?'frail' : r<0.25?'spring' : 'solid';\n    return {x:Math.random()*(W-PW), y, w:PW, type, dir:Math.random()<0.5?-1:1, used:false};\n  }\n  function start(){ if(state==='running')return; if(state==='over')reset(); state='running'; last=performance.now(); raf=requestAnimationFrame(loop); }\n\n  let last=0;\n  function loop(now){\n    if(state!=='running')return;\n    const dt=Math.min(2.5,(now-last)/16.67); last=now;\n    update(dt); draw(); raf=requestAnimationFrame(loop);\n  }\n  function update(dt){\n    if(keys.left) player.vx=-MOVE; else if(keys.right) player.vx=MOVE; else player.vx*=0.82;\n    player.x+=player.vx*dt;\n    if(player.x+player.w<0) player.x=W;            // wrap around the sides\n    if(player.x>W) player.x=-player.w;\n    player.vy+=GRAV*dt; player.y+=player.vy*dt;\n    // moving platforms\n    for(const p of plats){ if(p.type==='move'){ p.x+=p.dir*1.5*dt; if(p.x<0){p.x=0;p.dir=1;} if(p.x+p.w>W){p.x=W-p.w;p.dir=-1;} } }\n    // land only when falling\n    if(player.vy>0){\n      for(const p of plats){\n        if(p.broken) continue;\n        if(player.x+player.w>p.x && player.x<p.x+p.w &&\n           player.y+player.h>p.y && player.y+player.h<p.y+PH+player.vy*dt+2){\n          player.vy = p.type==='spring' ? BOUNCE*1.65 : BOUNCE;\n          if(p.type==='frail') p.broken=true;\n          if(p.type==='spring') p.sprung=12;\n          break;\n        }\n      }\n    }\n    // scroll world when you climb past the middle\n    if(player.y<H*0.42){\n      const dy=H*0.42-player.y;\n      player.y+=dy;\n      for(const p of plats) p.y+=dy;\n      score+=Math.round(dy);\n      $('score').textContent=score;\n      hue=(190+score*0.08)%360;\n    }\n    // recycle platforms that fall off the bottom\n    plats=plats.filter(p=>p.y<H+40);\n    while(plats.length<15){\n      const top=Math.min(...plats.map(p=>p.y));\n      plats.push(mkPlat(top-(52+Math.random()*36)));\n    }\n    if(player.y>H+40){\n      if(score>best){ best=score; store.set('hop.best',best); $('best').textContent=best; }\n      state='over'; cancelAnimationFrame(raf); draw(); overlay('Fell! '+score+' \u2014 tap to retry');\n    }\n  }\n\n  function draw(){\n    const c=ctx; c.clearRect(0,0,W,H);\n    for(const p of plats){\n      if(p.broken) continue;\n      const h= p.type==='frail'? 200 : p.type==='move'? 330 : p.type==='spring'? 96 : hue;\n      const g=c.createLinearGradient(p.x,p.y,p.x+p.w,p.y+PH);\n      g.addColorStop(0,'hsl('+h+' 90% 66%)'); g.addColorStop(1,'hsl('+((h+34)%360)+' 90% 56%)');\n      c.fillStyle=g; roundRect(c,p.x,p.y,p.w,PH,6); c.fill();\n      if(p.type==='spring'){\n        // little coil on top so springs read at a glance\n        c.strokeStyle='rgba(255,255,255,.85)'; c.lineWidth=2;\n        const sq=p.sprung>0?4:2;\n        c.beginPath();\n        for(let i=0;i<4;i++){ c.moveTo(p.x+p.w/2-8+i*5, p.y-sq); c.lineTo(p.x+p.w/2-6+i*5, p.y-sq-4); }\n        c.stroke();\n        if(p.sprung>0) p.sprung--;\n      }\n      if(p.type==='move'){\n        c.fillStyle='rgba(255,255,255,.5)';\n        c.fillRect(p.x+3,p.y+PH/2-1,4,2); c.fillRect(p.x+p.w-7,p.y+PH/2-1,4,2);\n      }\n    }\n    // player blob\n    c.fillStyle='hsl('+((hue+180)%360)+' 95% 70%)';\n    c.shadowColor='hsl('+((hue+180)%360)+' 100% 65%)'; c.shadowBlur=16;\n    roundRect(c,player.x,player.y,player.w,player.h,9); c.fill();\n    c.shadowBlur=0;\n    c.fillStyle='#1a0f2b';\n    c.fillRect(player.x+7,player.y+9,5,5); c.fillRect(player.x+16,player.y+9,5,5);\n  }\n  function roundRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}\n  function overlay(t){\n    const c=ctx; c.fillStyle='rgba(10,6,20,.6)'; c.fillRect(0,0,W,H);\n    c.fillStyle='#fff'; c.font='700 15px Outfit,system-ui,sans-serif'; c.textAlign='center';\n    c.fillText(t,W/2,H/2);\n  }\n\n  window.addEventListener('keydown',e=>{\n    const k=e.key.toLowerCase();\n    if(k==='arrowleft'||k==='a'){keys.left=true;start();e.preventDefault();}\n    else if(k==='arrowright'||k==='d'){keys.right=true;start();e.preventDefault();}\n    else if(e.key===' '){start();e.preventDefault();}\n  });\n  window.addEventListener('keyup',e=>{\n    const k=e.key.toLowerCase();\n    if(k==='arrowleft'||k==='a')keys.left=false;\n    else if(k==='arrowright'||k==='d')keys.right=false;\n  });\n  // touch: hold left/right half\n  cv.addEventListener('pointerdown',e=>{\n    e.preventDefault(); start();\n    const r=cv.getBoundingClientRect();\n    if(e.clientX-r.left < r.width/2){keys.left=true;keys.right=false;} else {keys.right=true;keys.left=false;}\n  });\n  window.addEventListener('pointerup',()=>{keys.left=keys.right=false;});\n  reset();\n" },
  "crossing": { css: "\n  :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.6);--line:rgba(255,255,255,.16);--sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n  .wrap{width:100%;max-width:400px;text-align:center}\n  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}\n  h1{margin:0;font-size:18px;font-weight:800}\n  .hud{display:flex;gap:14px;font-family:var(--mono);font-weight:700;font-size:14px}\n  canvas{display:block;width:100%;border-radius:16px;background:linear-gradient(180deg,rgba(141,255,90,.09),rgba(49,225,255,.1));border:1px solid var(--line);touch-action:none}\n  .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:10px}\n", body: "<main class=\"wrap\">\n  <header><h1>Crossing</h1><div class=\"hud\"><span id=\"score\">0</span><span style=\"opacity:.6\">best <span id=\"best\">0</span></span></div></header>\n  <canvas id=\"c\" width=\"380\" height=\"440\"></canvas>\n  <p class=\"hint\">\u2191 to hop forward \u00b7 \u2190 \u2192 to shuffle sideways \u00b7 time the gaps</p>\n</main>", js: "\n  'use strict';\n  const $=id=>document.getElementById(id);\n  const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n    return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n    catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n  const cv=$('c'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;\n  const LANE=44, COLS=10, CW=W/COLS;\n  let lanes, player, score, best, state, raf, offset;\n  best=store.get('cross.best')||0; $('best').textContent=best;\n\n  function reset(){\n    lanes=[]; offset=0; score=0;\n    // row 0 is the player's start (safe grass), rows grow upward\n    for(let i=0;i<14;i++) lanes.push(mkLane(i));\n    player={col:Math.floor(COLS/2), row:0, px:0, py:0};\n    state='ready'; $('score').textContent='0';\n    draw(); overlay('Press \u2191 or tap to hop');\n  }\n  function mkLane(i){\n    if(i===0||i%7===0) return {type:'grass', cars:[]};\n    const speed=(0.9+Math.random()*1.5+Math.min(2.4,i*0.03))*(Math.random()<0.5?-1:1);\n    const cars=[]; const n=1+Math.floor(Math.random()*2);\n    const gap=W/n;\n    for(let k=0;k<n;k++) cars.push({x:k*gap+Math.random()*gap*0.4, w:44+Math.random()*26, hue:(i*47+k*90)%360});\n    return {type:'road', speed, cars};\n  }\n  function start(){ if(state==='running')return; if(state==='over')reset(); state='running'; last=performance.now(); raf=requestAnimationFrame(loop); }\n\n  let last=0;\n  function loop(now){\n    if(state!=='running')return;\n    const dt=Math.min(2.5,(now-last)/16.67); last=now;\n    for(const l of lanes){\n      if(l.type!=='road') continue;\n      for(const car of l.cars){\n        car.x+=l.speed*dt;\n        if(l.speed>0 && car.x>W+60) car.x=-car.w-40-Math.random()*80;\n        if(l.speed<0 && car.x+car.w<-60) car.x=W+40+Math.random()*80;\n      }\n    }\n    // collision on the player's lane\n    const l=lanes[player.row];\n    if(l && l.type==='road'){\n      const px=player.col*CW+4, pw=CW-8;\n      for(const car of l.cars){\n        if(px<car.x+car.w && px+pw>car.x){ return over(); }\n      }\n    }\n    draw(); raf=requestAnimationFrame(loop);\n  }\n  function over(){\n    state='over'; cancelAnimationFrame(raf);\n    if(score>best){ best=score; store.set('cross.best',best); $('best').textContent=best; }\n    draw(); overlay('Squashed! '+score+' \u2014 tap to retry');\n  }\n\n  function hop(dr,dc){\n    if(state!=='running'){ start(); return; }\n    const nc=Math.max(0,Math.min(COLS-1,player.col+dc));\n    const nr=Math.max(0,player.row+dr);\n    player.col=nc;\n    if(nr>player.row){\n      player.row=nr; score++; $('score').textContent=score;\n      // keep the world stocked ahead\n      while(lanes.length < player.row+12) lanes.push(mkLane(lanes.length));\n    } else player.row=nr;\n  }\n\n  function rowY(row){ return H-40-(row-viewBase())*LANE; }\n  function viewBase(){ return Math.max(0, player.row-6); }\n\n  function draw(){\n    const c=ctx; c.clearRect(0,0,W,H);\n    const base=viewBase();\n    for(let r=base; r<base+Math.ceil(H/LANE)+1; r++){\n      const l=lanes[r]; if(!l) continue;\n      const y=rowY(r);\n      if(y>H+LANE||y<-LANE) continue;\n      if(l.type==='grass'){\n        c.fillStyle=r%2? 'rgba(141,255,90,.16)':'rgba(141,255,90,.11)';\n        c.fillRect(0,y,W,LANE);\n      } else {\n        c.fillStyle='rgba(255,255,255,.05)'; c.fillRect(0,y,W,LANE);\n        c.strokeStyle='rgba(255,255,255,.16)'; c.setLineDash([12,12]); c.lineWidth=2;\n        c.beginPath(); c.moveTo(0,y+LANE/2); c.lineTo(W,y+LANE/2); c.stroke(); c.setLineDash([]);\n        for(const car of l.cars){\n          const g=c.createLinearGradient(car.x,y,car.x+car.w,y+LANE);\n          g.addColorStop(0,'hsl('+car.hue+' 90% 65%)'); g.addColorStop(1,'hsl('+((car.hue+30)%360)+' 90% 52%)');\n          c.fillStyle=g; roundRect(c,car.x,y+7,car.w,LANE-14,7); c.fill();\n          c.fillStyle='rgba(255,255,255,.35)';\n          roundRect(c,car.x+(l.speed>0?car.w-13:5),y+12,8,LANE-24,3); c.fill();\n        }\n      }\n    }\n    // player\n    const px=player.col*CW+4, py=rowY(player.row)+6;\n    c.fillStyle='#fff'; c.shadowColor='#8dff5a'; c.shadowBlur=14;\n    roundRect(c,px,py,CW-8,LANE-12,8); c.fill(); c.shadowBlur=0;\n    c.fillStyle='#1a0f2b';\n    c.fillRect(px+6,py+8,4,4); c.fillRect(px+CW-18,py+8,4,4);\n  }\n  function roundRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}\n  function overlay(t){\n    const c=ctx; c.fillStyle='rgba(10,6,20,.6)'; c.fillRect(0,0,W,H);\n    c.fillStyle='#fff'; c.font='700 16px Outfit,system-ui,sans-serif'; c.textAlign='center';\n    c.fillText(t,W/2,H/2);\n  }\n\n  window.addEventListener('keydown',e=>{\n    const k=e.key.toLowerCase();\n    if(k==='arrowup'||k==='w'){e.preventDefault();hop(1,0);}\n    else if(k==='arrowdown'||k==='s'){e.preventDefault();hop(-1,0);}\n    else if(k==='arrowleft'||k==='a'){e.preventDefault();hop(0,-1);}\n    else if(k==='arrowright'||k==='d'){e.preventDefault();hop(0,1);}\n    else if(e.key===' '){e.preventDefault();hop(1,0);}\n  });\n  cv.addEventListener('pointerdown',e=>{\n    e.preventDefault();\n    if(state!=='running'){ start(); return; }\n    const r=cv.getBoundingClientRect();\n    const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;\n    if(y<0.45) hop(1,0);\n    else if(x<0.35) hop(0,-1);\n    else if(x>0.65) hop(0,1);\n    else hop(1,0);\n  });\n  reset();\n" },
  "chain": { css: "\n  :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.6);--line:rgba(255,255,255,.16);--sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n  .wrap{width:100%;max-width:380px;text-align:center}\n  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}\n  h1{margin:0;font-size:18px;font-weight:800}\n  .hud{display:flex;gap:14px;font-family:var(--mono);font-weight:700;font-size:14px}\n  .board{display:grid;gap:6px;margin-bottom:12px}\n  .cell{aspect-ratio:1;border-radius:12px;border:none;cursor:pointer;padding:0;\n    transition:transform .12s cubic-bezier(.34,1.5,.5,1),filter .12s;position:relative}\n  .cell:hover{filter:brightness(1.25)}\n  .cell:active{transform:scale(.9)}\n  .cell.gone{opacity:0;transform:scale(.4);pointer-events:none;transition:all .22s ease}\n  .cell.mark{outline:3px solid #fff;outline-offset:-3px}\n  .msg{min-height:20px;font-size:13px;font-weight:750;margin-bottom:8px}\n  .bar{display:flex;gap:8px;justify-content:center}\n  .bar button{font:inherit;font-size:13px;font-weight:700;cursor:pointer;border-radius:999px;padding:10px 20px;border:none;background:linear-gradient(135deg,#ffc23d,#ff7a4d);color:#2b1400}\n  .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:10px}\n", body: "<main class=\"wrap\">\n  <header><h1>Colour Chain</h1><div class=\"hud\"><span id=\"score\">0</span><span style=\"opacity:.6\">best <span id=\"best\">0</span></span></div></header>\n  <div class=\"board\" id=\"board\"></div>\n  <div class=\"msg\" id=\"msg\"></div>\n  <div class=\"bar\"><button type=\"button\" id=\"again\">New board</button></div>\n  <p class=\"hint\">Tap any group of 2+ touching same-colour tiles \u00b7 bigger groups score way more</p>\n</main>", js: "\n  'use strict';\n  const $=id=>document.getElementById(id);\n  const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n    return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n    catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n  const N=10, TYPES=4;\n  const COLS=['#ff4d9d','#ffc23d','#31e1ff','#8dff5a'];\n  let grid, score, best, cells, over;\n  best=store.get('chain.best')||0; $('best').textContent=best;\n\n  const boardEl=$('board');\n  boardEl.style.gridTemplateColumns='repeat('+N+',1fr)';\n\n  function build(){\n    boardEl.innerHTML=''; cells=[];\n    for(let r=0;r<N;r++){\n      const row=[];\n      for(let c=0;c<N;c++){\n        const b=document.createElement('button');\n        b.className='cell'; b.type='button'; b.dataset.r=r; b.dataset.c=c;\n        b.addEventListener('click',()=>tap(r,c));\n        b.addEventListener('mouseenter',()=>hover(r,c));\n        b.addEventListener('mouseleave',clearMark);\n        boardEl.appendChild(b); row.push(b);\n      }\n      cells.push(row);\n    }\n  }\n\n  function newGame(){\n    grid=Array.from({length:N},()=>Array.from({length:N},()=>Math.random()*TYPES|0));\n    score=0; over=false;\n    $('score').textContent='0'; $('msg').textContent='';\n    paint();\n  }\n\n  function group(r,c){\n    const col=grid[r][c];\n    if(col===-1) return [];\n    const seen=new Set([r+','+c]), out=[[r,c]], q=[[r,c]];\n    while(q.length){\n      const [cr,cc]=q.pop();\n      for(const [nr,nc] of [[cr-1,cc],[cr+1,cc],[cr,cc-1],[cr,cc+1]]){\n        if(nr<0||nc<0||nr>=N||nc>=N) continue;\n        const k=nr+','+nc;\n        if(seen.has(k)||grid[nr][nc]!==col) continue;\n        seen.add(k); out.push([nr,nc]); q.push([nr,nc]);\n      }\n    }\n    return out;\n  }\n\n  function tap(r,c){\n    if(over||grid[r][c]===-1) return;\n    const g=group(r,c);\n    if(g.length<2) return;                 // need at least a pair\n    for(const [rr,cc] of g) grid[rr][cc]=-1;\n    score += g.length*(g.length-1)*5;      // quadratic: big groups pay off\n    $('score').textContent=score;\n    if(score>best){ best=score; store.set('chain.best',best); $('best').textContent=best; }\n    collapse();\n    paint();\n    if(!anyMove()){ finish(); }\n  }\n\n  // tiles fall down, then empty columns slide left\n  function collapse(){\n    for(let c=0;c<N;c++){\n      let write=N-1;\n      for(let r=N-1;r>=0;r--){\n        if(grid[r][c]!==-1){ const v=grid[r][c]; grid[r][c]=-1; grid[write][c]=v; write--; }\n      }\n    }\n    let write=0;\n    for(let c=0;c<N;c++){\n      let empty=true;\n      for(let r=0;r<N;r++) if(grid[r][c]!==-1) empty=false;\n      if(!empty){\n        if(write!==c) for(let r=0;r<N;r++){ grid[r][write]=grid[r][c]; grid[r][c]=-1; }\n        write++;\n      }\n    }\n  }\n  function anyMove(){\n    for(let r=0;r<N;r++)for(let c=0;c<N;c++)\n      if(grid[r][c]!==-1 && group(r,c).length>=2) return true;\n    return false;\n  }\n  function remaining(){ let n=0; for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(grid[r][c]!==-1)n++; return n; }\n\n  function finish(){\n    over=true;\n    const left=remaining();\n    if(left===0){ score+=500; $('score').textContent=score;\n      if(score>best){best=score;store.set('chain.best',best);$('best').textContent=best;}\n      $('msg').textContent='Board cleared! +500 bonus'; }\n    else $('msg').textContent='No moves left \u00b7 '+left+' tiles remain';\n  }\n\n  function paint(){\n    for(let r=0;r<N;r++)for(let c=0;c<N;c++){\n      const el=cells[r][c], v=grid[r][c];\n      el.classList.remove('mark');\n      if(v===-1){ el.classList.add('gone'); el.style.background='transparent'; }\n      else { el.classList.remove('gone'); el.style.background='linear-gradient(150deg,'+COLS[v]+','+shade(COLS[v])+')'; }\n    }\n  }\n  function shade(hex){\n    const n=parseInt(hex.slice(1),16);\n    const r=Math.round(((n>>16)&255)*0.68), g=Math.round(((n>>8)&255)*0.68), b=Math.round((n&255)*0.68);\n    return 'rgb('+r+','+g+','+b+')';\n  }\n  function hover(r,c){\n    clearMark();\n    const g=group(r,c);\n    if(g.length<2) return;\n    for(const [rr,cc] of g) cells[rr][cc].classList.add('mark');\n  }\n  function clearMark(){ for(const row of cells) for(const el of row) el.classList.remove('mark'); }\n\n  $('again').addEventListener('click',newGame);\n  build(); newGame();\n" },
  "gems": { css: "\n  :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.6);--line:rgba(255,255,255,.16);--sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n  .wrap{width:100%;max-width:380px;text-align:center}\n  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}\n  h1{margin:0;font-size:18px;font-weight:800}\n  .hud{display:flex;gap:14px;font-family:var(--mono);font-weight:700;font-size:14px}\n  .barwrap{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-bottom:12px}\n  .barwrap span{display:block;height:100%;background:linear-gradient(90deg,#ffc23d,#ff4d9d);transition:width .3s}\n  canvas{display:block;width:100%;border-radius:16px;background:linear-gradient(180deg,rgba(155,92,255,.1),rgba(49,225,255,.08));border:1px solid var(--line);cursor:pointer;touch-action:none}\n  .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:10px}\n", body: "<main class=\"wrap\">\n  <header><h1>Gem Swap</h1><div class=\"hud\"><span id=\"score\">0</span><span style=\"opacity:.6\">moves <span id=\"moves\">25</span></span></div></header>\n  <div class=\"barwrap\"><span id=\"bar\" style=\"width:100%\"></span></div>\n  <canvas id=\"c\" width=\"360\" height=\"360\"></canvas>\n  <p class=\"hint\">Swap two touching gems to line up 3 or more \u00b7 chains score extra</p>\n</main>", js: "\n  'use strict';\n  const $=id=>document.getElementById(id);\n  const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n    return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n    catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n  const cv=$('c'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;\n  const N=8, CS=W/N, TYPES=6;\n  const HUES=[350,32,58,140,196,282];\n  const START_MOVES=25;\n  let grid, sel, score, moves, busy, anim, raf, best;\n  best=store.get('gems.best')||0;\n\n  // ---- board helpers ------------------------------------------------------\n  function at(g,r,c){ return (r<0||c<0||r>=N||c>=N)?-1:g[r][c]; }\n  function findMatches(g){\n    const hit=new Set();\n    for(let r=0;r<N;r++){\n      let run=1;\n      for(let c=1;c<=N;c++){\n        if(c<N && g[r][c]!==-1 && g[r][c]===g[r][c-1]) run++;\n        else { if(run>=3) for(let k=c-run;k<c;k++) hit.add(r+','+k); run=1; }\n      }\n    }\n    for(let c=0;c<N;c++){\n      let run=1;\n      for(let r=1;r<=N;r++){\n        if(r<N && g[r][c]!==-1 && g[r][c]===g[r-1][c]) run++;\n        else { if(run>=3) for(let k=r-run;k<r;k++) hit.add(k+','+c); run=1; }\n      }\n    }\n    return hit;\n  }\n  function swap(g,a,b){ const t=g[a[0]][a[1]]; g[a[0]][a[1]]=g[b[0]][b[1]]; g[b[0]][b[1]]=t; }\n  function wouldMatch(g,a,b){\n    swap(g,a,b);\n    const ok=findMatches(g).size>0;\n    swap(g,a,b);\n    return ok;\n  }\n  function hasAnyMove(g){\n    for(let r=0;r<N;r++)for(let c=0;c<N;c++){\n      if(c<N-1 && wouldMatch(g,[r,c],[r,c+1])) return true;\n      if(r<N-1 && wouldMatch(g,[r,c],[r+1,c])) return true;\n    }\n    return false;\n  }\n  function newBoard(){\n    let g;\n    do{\n      g=Array.from({length:N},()=>Array.from({length:N},()=>Math.random()*TYPES|0));\n      // clear any starting matches so the player begins on a stable board\n      let guard=0;\n      while(findMatches(g).size && guard++<400){\n        for(const key of findMatches(g)){\n          const [r,c]=key.split(',').map(Number);\n          g[r][c]=Math.random()*TYPES|0;\n        }\n      }\n    } while(findMatches(g).size || !hasAnyMove(g));\n    return g;\n  }\n\n  // ---- game ---------------------------------------------------------------\n  function reset(){\n    grid=newBoard(); sel=null; score=0; moves=START_MOVES; busy=false; anim=[];\n    $('score').textContent='0'; $('moves').textContent=moves; $('bar').style.width='100%';\n    draw();\n  }\n\n  function trySwap(a,b){\n    if(busy) return;\n    if(Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])!==1) return;   // must be adjacent\n    busy=true;\n    swap(grid,a,b);\n    if(findMatches(grid).size===0){\n      // illegal: swap back with a nudge\n      swap(grid,a,b);\n      sel=null; busy=false; draw(); shake(a,b);\n      return;\n    }\n    moves--; $('moves').textContent=moves;\n    $('bar').style.width=(100*moves/START_MOVES)+'%';\n    sel=null;\n    resolve(1);\n  }\n\n  function resolve(chain){\n    const hit=findMatches(grid);\n    if(hit.size===0){\n      busy=false; draw();\n      if(!hasAnyMove(grid)){ grid=newBoard(); draw(); }\n      if(moves<=0) finish();\n      return;\n    }\n    // score: more gems + deeper chain = more points\n    score += hit.size*10*chain;\n    $('score').textContent=score;\n    for(const key of hit){ const [r,c]=key.split(',').map(Number); grid[r][c]=-1; }\n    draw();\n    setTimeout(()=>{ collapse(); draw(); setTimeout(()=>resolve(chain+1),140); },160);\n  }\n\n  function collapse(){\n    for(let c=0;c<N;c++){\n      let write=N-1;\n      for(let r=N-1;r>=0;r--){\n        if(grid[r][c]!==-1){ grid[write][c]=grid[r][c]; if(write!==r) grid[r][c]=-1; write--; }\n      }\n      for(let r=write;r>=0;r--) grid[r][c]=Math.random()*TYPES|0;\n    }\n  }\n\n  function finish(){\n    busy=true;\n    if(score>best){ best=score; store.set('gems.best',best); }\n    draw();\n    const c=ctx; c.fillStyle='rgba(10,6,20,.72)'; c.fillRect(0,0,W,H);\n    c.fillStyle='#fff'; c.textAlign='center';\n    c.font='800 26px Outfit,system-ui,sans-serif'; c.fillText(score,W/2,H/2-6);\n    c.font='600 13px Outfit,system-ui,sans-serif';\n    c.fillStyle='rgba(255,255,255,.75)';\n    c.fillText('final score  \u00b7  best '+best,W/2,H/2+16);\n    c.fillText('click to play again',W/2,H/2+40);\n  }\n\n  let shakeT=null;\n  function shake(a,b){\n    let n=0;\n    clearInterval(shakeT);\n    shakeT=setInterval(()=>{\n      n++; draw();\n      const c=ctx, off=(n%2?2:-2);\n      for(const p of [a,b]){\n        c.strokeStyle='rgba(255,90,120,.9)'; c.lineWidth=2;\n        c.strokeRect(p[1]*CS+3+off,p[0]*CS+3,CS-6,CS-6);\n      }\n      if(n>5){ clearInterval(shakeT); draw(); }\n    },50);\n  }\n\n  function draw(){\n    const c=ctx; c.clearRect(0,0,W,H);\n    for(let r=0;r<N;r++)for(let col=0;col<N;col++){\n      const v=grid[r][col];\n      if(v===-1) continue;\n      gem(c, col*CS, r*CS, v, sel && sel[0]===r && sel[1]===col);\n    }\n  }\n  function gem(c,x,y,v,on){\n    const h=HUES[v], p=6, s=CS-p*2;\n    const g=c.createLinearGradient(x+p,y+p,x+p+s,y+p+s);\n    g.addColorStop(0,'hsl('+h+' 92% 70%)');\n    g.addColorStop(1,'hsl('+((h+26)%360)+' 88% 50%)');\n    c.fillStyle=g;\n    if(on){ c.shadowColor='hsl('+h+' 100% 70%)'; c.shadowBlur=16; }\n    // rounded diamond-ish gem\n    c.beginPath();\n    c.moveTo(x+CS/2, y+p);\n    c.lineTo(x+CS-p, y+CS/2);\n    c.lineTo(x+CS/2, y+CS-p);\n    c.lineTo(x+p, y+CS/2);\n    c.closePath(); c.fill(); c.shadowBlur=0;\n    c.fillStyle='rgba(255,255,255,.45)';\n    c.beginPath();\n    c.moveTo(x+CS/2,y+p+3); c.lineTo(x+CS/2+7,y+CS/2-3); c.lineTo(x+CS/2,y+CS/2); c.closePath(); c.fill();\n    if(on){ c.strokeStyle='#fff'; c.lineWidth=2; c.strokeRect(x+3,y+3,CS-6,CS-6); }\n  }\n\n  function cell(e){\n    const r=cv.getBoundingClientRect();\n    const x=(e.clientX-r.left)*(W/r.width), y=(e.clientY-r.top)*(H/r.height);\n    return [Math.floor(y/CS), Math.floor(x/CS)];\n  }\n  cv.addEventListener('pointerdown',e=>{\n    e.preventDefault();\n    if(moves<=0 && busy){ reset(); return; }\n    if(busy) return;\n    const [r,c]=cell(e);\n    if(r<0||c<0||r>=N||c>=N) return;\n    if(!sel){ sel=[r,c]; draw(); return; }\n    if(sel[0]===r&&sel[1]===c){ sel=null; draw(); return; }\n    if(Math.abs(sel[0]-r)+Math.abs(sel[1]-c)===1) trySwap(sel,[r,c]);\n    else { sel=[r,c]; draw(); }\n  });\n  // drag-to-swap\n  let down=null;\n  cv.addEventListener('pointerdown',e=>{ down=cell(e); });\n  cv.addEventListener('pointerup',e=>{\n    if(!down||busy) return;\n    const up=cell(e);\n    if(Math.abs(down[0]-up[0])+Math.abs(down[1]-up[1])===1){ sel=null; trySwap(down,up); }\n    down=null;\n  });\n  reset();\n" },
  "quickdraw": { css: "\n  :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.6);--line:rgba(255,255,255,.16);--sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n  .wrap{width:100%;max-width:400px;text-align:center}\n  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}\n  h1{margin:0;font-size:18px;font-weight:800}\n  .hud{display:flex;gap:14px;font-family:var(--mono);font-weight:700;font-size:14px}\n  .pad{position:relative;height:250px;border-radius:20px;display:grid;place-items:center;\n    cursor:pointer;user-select:none;border:1px solid var(--line);\n    background:linear-gradient(160deg,rgba(155,92,255,.18),rgba(49,225,255,.12));\n    transition:background .12s}\n  .pad.wait{background:linear-gradient(160deg,rgba(255,77,110,.3),rgba(255,122,77,.2))}\n  .pad.go{background:linear-gradient(160deg,#8dff5a,#31c96b)}\n  .pad.early{background:linear-gradient(160deg,rgba(255,194,61,.35),rgba(255,122,77,.25))}\n  .pad .big{font-size:30px;font-weight:800;letter-spacing:-.02em}\n  .pad .sub{font-size:13px;color:rgba(255,255,255,.75);font-weight:600;margin-top:6px}\n  .pad.go .big,.pad.go .sub{color:#0d2a06}\n  .rounds{display:flex;gap:6px;justify-content:center;margin-top:14px}\n  .dot{width:26px;height:5px;border-radius:3px;background:rgba(255,255,255,.15)}\n  .dot.done{background:linear-gradient(90deg,#31e1ff,#8dff5a)}\n  .list{margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--muted);min-height:20px}\n  .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:10px}\n", body: "<main class=\"wrap\">\n  <header><h1>Reflex</h1><div class=\"hud\"><span id=\"avg\">\u2014</span><span style=\"opacity:.6\">best <span id=\"best\">\u2014</span></span></div></header>\n  <div class=\"pad\" id=\"pad\"><div><div class=\"big\" id=\"big\">Tap to start</div><div class=\"sub\" id=\"sub\">5 rounds \u00b7 react when it turns green</div></div></div>\n  <div class=\"rounds\" id=\"rounds\"></div>\n  <div class=\"list\" id=\"list\"></div>\n  <p class=\"hint\">Wait for green, then tap or press Space as fast as you can</p>\n</main>", js: "\n  'use strict';\n  const $=id=>document.getElementById(id);\n  const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n    return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n    catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n  const ROUNDS=5;\n  let state='idle', round, times, greenAt, timer, best;\n  best=store.get('draw.best')||null;\n  $('best').textContent = best? best+'ms' : '\u2014';\n\n  const dots=$('rounds');\n  function paintDots(){\n    dots.innerHTML='';\n    for(let i=0;i<ROUNDS;i++){\n      const d=document.createElement('div');\n      d.className='dot'+(i<times.length?' done':'');\n      dots.appendChild(d);\n    }\n  }\n\n  function begin(){\n    round=0; times=[]; $('list').textContent='';\n    paintDots(); next();\n  }\n\n  function next(){\n    if(times.length>=ROUNDS) return finish();\n    state='wait';\n    $('pad').className='pad wait';\n    $('big').textContent='Wait\u2026';\n    $('sub').textContent='green in a moment';\n    clearTimeout(timer);\n    const delay=900+Math.random()*2600;\n    timer=setTimeout(()=>{\n      state='go'; greenAt=performance.now();\n      $('pad').className='pad go';\n      $('big').textContent='TAP!';\n      $('sub').textContent='';\n    }, delay);\n  }\n\n  function hit(){\n    if(state==='idle'||state==='done'){ begin(); return; }\n    if(state==='wait'){\n      // jumped the gun\n      clearTimeout(timer);\n      state='early';\n      $('pad').className='pad early';\n      $('big').textContent='Too early!';\n      $('sub').textContent='tap to try that round again';\n      state='earlyWait';\n      return;\n    }\n    if(state==='earlyWait'){ next(); return; }\n    if(state==='go'){\n      const ms=Math.round(performance.now()-greenAt);\n      times.push(ms);\n      paintDots();\n      $('list').textContent=times.join('ms \u00b7 ')+'ms';\n      state='between';\n      $('pad').className='pad';\n      $('big').textContent=ms+'ms';\n      $('sub').textContent = times.length>=ROUNDS? 'tap for results' : 'tap for the next round';\n      return;\n    }\n    if(state==='between'){ next(); return; }\n  }\n\n  function finish(){\n    state='done';\n    const avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);\n    $('avg').textContent=avg+'ms';\n    $('pad').className='pad';\n    $('big').textContent=avg+'ms average';\n    let msg;\n    if(avg<220) msg='Lightning reflexes!';\n    else if(avg<280) msg='Very sharp.';\n    else if(avg<350) msg='Solid.';\n    else msg='Room to sharpen up.';\n    if(best===null||avg<best){ best=avg; store.set('draw.best',best); $('best').textContent=best+'ms'; msg='New best! '+msg; }\n    $('sub').textContent=msg+' Tap to go again.';\n  }\n\n  $('pad').addEventListener('pointerdown',e=>{ e.preventDefault(); hit(); });\n  window.addEventListener('keydown',e=>{ if(e.key===' '){ e.preventDefault(); hit(); } });\n  times=[]; paintDots();\n" },
  "circuit": { css: "\n  :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.6);--line:rgba(255,255,255,.16);--sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n  .wrap{width:100%;max-width:460px;text-align:center;margin:0 auto}\n  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}\n  h1{margin:0;font-size:18px;font-weight:800}\n  .hud{display:flex;gap:14px;font-family:var(--mono);font-weight:700;font-size:14px}\n  .barwrap{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-bottom:12px}\n  .barwrap span{display:block;height:100%;background:linear-gradient(90deg,#31e1ff,#8dff5a);width:100%;transition:width .12s linear}\n  canvas{display:block;width:100%;border-radius:16px;background:linear-gradient(180deg,rgba(49,225,255,.08),rgba(155,92,255,.1));border:1px solid var(--line);cursor:pointer;touch-action:none}\n  .msg{min-height:20px;font-size:13px;font-weight:750;margin-top:10px}\n  .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}\n", body: "<main class=\"wrap\">\n  <header><h1>Pipe Flow</h1><div class=\"hud\"><span>LV <span id=\"lvl\">1</span></span><span id=\"score\">0</span><span style=\"opacity:.6\">best <span id=\"best\">0</span></span></div></header>\n  <div class=\"barwrap\"><span id=\"bar\"></span></div>\n  <canvas id=\"c\" width=\"720\" height=\"720\"></canvas>\n  <div class=\"msg\" id=\"msg\"></div>\n  <p class=\"hint\">Click a pipe to rotate it clockwise, right-click for anti-clockwise · connect the blue source on the left to the green drain on the right</p>\n</main>", js: "\n  'use strict';\n  const $=id=>document.getElementById(id);\n  const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n    return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n    catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n  const cv=$('c'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;\n  ctx.imageSmoothingEnabled=true;\n  const N=6, CS=W/N;\n  // each tile: set of open sides. 0=up 1=right 2=down 3=left\n  // shapes: straight [0,2], elbow [0,1], tee [0,1,2], cross [0,1,2,3]\n  const SHAPES=[[0,2],[0,1],[0,1],[0,1,2]];\n  let grid, level, score, best, timeLeft, timeMax, state, raf, filled, msgT;\n  best=store.get('pipe.best')||0; $('best').textContent=best;\n\n  const rot=(sides,n)=>sides.map(s=>(s+n)%4);\n  const opp=s=>(s+2)%4;\n  const DR=[-1,0,1,0], DC=[0,1,0,-1];\n\n  /* ------------------------------------------------------------------ board\n     The old generator walked from the source to the drain using only \"right\"\n     and \"down\", so every solution was the same diagonal staircase and no pipe\n     ever needed to point up or left. This is a proper self-avoiding random walk\n     instead: it wanders in all four directions, backtracking whenever it paints\n     itself into a corner, so the route genuinely doubles back on itself. */\n  function carvePath(){\n    const seen=Array.from({length:N},()=>Array(N).fill(false));\n    const path=[];\n    const target=(N-1)*N+(N-1);\n    function dfs(r,c){\n      seen[r][c]=true; path.push([r,c]);\n      if(r*N+c===target) return true;\n      // bias towards the drain so runs stay a sensible length, but keep enough\n      // randomness that the shape is different every time\n      const dirs=[0,1,2,3].map(d=>{\n        const nr=r+DR[d], nc=c+DC[d];\n        const toward=(nr>r?1:0)+(nc>c?1:0);\n        return {d,nr,nc,w:Math.random()+toward*0.12};\n      }).filter(o=>o.nr>=0&&o.nc>=0&&o.nr<N&&o.nc<N&&!seen[o.nr][o.nc])\n        .sort((a,b)=>b.w-a.w);\n      for(const o of dirs) if(dfs(o.nr,o.nc)) return true;\n      seen[r][c]=false; path.pop();\n      return false;\n    }\n    dfs(0,0);\n    return path;\n  }\n  // a walk that happens to come out as a near-straight staircase is a dull\n  // puzzle, so ask for another one until it actually wanders\n  function longPath(minLen){\n    let best=[];\n    for(let i=0;i<40;i++){\n      const p=carvePath();\n      if(p.length>best.length) best=p;\n      if(best.length>=minLen) break;\n    }\n    return best;\n  }\n\n  // build a guaranteed-solvable board: carve a path from source to drain, give\n  // each path cell the pipe it needs, then fill the rest with random pipes.\n  function build(lv){\n    const g=Array.from({length:N},()=>Array.from({length:N},()=>null));\n    const path=longPath(17+Math.min(6,lv));\n    for(let i=0;i<path.length;i++){\n      const [pr,pc]=path[i];\n      const sides=new Set();\n      if(i>0){ const [ar,ac]=path[i-1];\n        sides.add(ar<pr?0:ar>pr?2:ac<pc?3:1); }\n      if(i<path.length-1){ const [br,bc]=path[i+1];\n        sides.add(br<pr?0:br>pr?2:bc<pc?3:1); }\n      if(i===0) sides.add(3);             // source enters from the left edge\n      if(i===path.length-1) sides.add(1); // drain exits the right edge\n      g[pr][pc]={sides:[...sides], rot:0, onPath:true};\n    }\n    // fill the rest with random decoy pipes\n    for(let rr=0;rr<N;rr++)for(let cc=0;cc<N;cc++){\n      if(g[rr][cc]) continue;\n      const s=SHAPES[Math.random()*SHAPES.length|0];\n      g[rr][cc]={sides:rot(s,Math.random()*4|0), rot:0, onPath:false};\n    }\n    // scramble every tile so the player has to solve it. A straight pipe only\n    // has two distinct orientations, so give it an odd number of turns or it\n    // can come out already solved.\n    for(let rr=0;rr<N;rr++)for(let cc=0;cc<N;cc++){\n      const t=g[rr][cc];\n      let turns=1+(Math.random()*3|0);\n      if(t.onPath && t.sides.length===2 && (t.sides[0]+2)%4===t.sides[1] && turns%2===0) turns++;\n      t.sides=rot(t.sides,turns);\n    }\n    return g;\n  }\n\n  function openSides(t){ return t.sides; }\n  // flood from the source; returns the set of connected cells and whether the drain is reached\n  function flow(g){\n    const on=new Set(); const q=[];\n    if(openSides(g[0][0]).includes(3)){ on.add('0,0'); q.push([0,0]); }\n    while(q.length){\n      const [r,c]=q.pop();\n      for(const s of openSides(g[r][c])){\n        const nr=r+DR[s], nc=c+DC[s];\n        if(nr<0||nc<0||nr>=N||nc>=N) continue;\n        const k=nr+','+nc;\n        if(on.has(k)) continue;\n        if(!openSides(g[nr][nc]).includes(opp(s))) continue;   // must connect both ways\n        on.add(k); q.push([nr,nc]);\n      }\n    }\n    const done = on.has((N-1)+','+(N-1)) && openSides(g[N-1][N-1]).includes(1);\n    return {on, done};\n  }\n\n  function reset(full){\n    if(full){ score=0; level=1; }\n    grid=build(level);\n    timeMax=Math.max(14, 34-level*1.5); timeLeft=timeMax;\n    filled=new Set(); state='running';\n    $('lvl').textContent=level; $('score').textContent=score; $('msg').textContent='';\n    last=performance.now();\n    cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);\n    draw();\n  }\n\n  let last=0;\n  function loop(now){\n    if(state!=='running')return;\n    const dt=(now-last)/1000; last=now;\n    timeLeft-=dt;\n    $('bar').style.width=Math.max(0,100*timeLeft/timeMax)+'%';\n    if(timeLeft<=0){ return lose(); }\n    draw(); raf=requestAnimationFrame(loop);\n  }\n\n  function rotate(r,c,back){\n    if(state!=='running') return;\n    grid[r][c].sides=rot(grid[r][c].sides,back?3:1);\n    grid[r][c].spin=8;   // brief highlight so the click registers visually\n    const f=flow(grid);\n    filled=f.on;\n    draw();\n    if(f.done) win();\n    else $('msg').textContent=f.on.size>1? (f.on.size+' pipes connected') : '';\n  }\n\n  function win(){\n    state='won'; cancelAnimationFrame(raf);\n    const bonus=Math.round(timeLeft*10);\n    score+=100+bonus;\n    $('score').textContent=score;\n    if(score>best){ best=score; store.set('pipe.best',best); $('best').textContent=best; }\n    $('msg').textContent='Connected! +'+(100+bonus)+' — next level…';\n    draw();\n    setTimeout(()=>{ level++; reset(false); }, 1000);\n  }\n  function lose(){\n    state='over'; cancelAnimationFrame(raf);\n    $('msg').textContent='Flooded! Final score '+score+' — click to retry';\n    draw();\n  }\n\n  function draw(){\n    const c=ctx; c.clearRect(0,0,W,H);\n    for(let r=0;r<N;r++)for(let col=0;col<N;col++){\n      const x=col*CS, y=r*CS;\n      c.fillStyle=(r+col)%2? 'rgba(255,255,255,.03)':'rgba(255,255,255,.05)';\n      c.fillRect(x,y,CS,CS);\n      const lit=filled.has(r+','+col);\n      drawPipe(c,x,y,grid[r][col],lit);\n    }\n    // source + drain markers\n    c.fillStyle='#31e1ff'; c.beginPath(); c.arc(6,CS/2,13,0,7); c.fill();\n    c.fillStyle='#8dff5a'; c.beginPath(); c.arc(W-6,H-CS/2,13,0,7); c.fill();\n    if(state==='over'){ c.fillStyle='rgba(10,6,20,.6)'; c.fillRect(0,0,W,H);\n      c.fillStyle='#fff'; c.textAlign='center'; c.font='700 32px Outfit,system-ui,sans-serif';\n      c.fillText('Click to retry',W/2,H/2); }\n  }\n  function drawPipe(c,x,y,t,lit){\n    const cx=x+CS/2, cy=y+CS/2, w=CS*0.26;\n    if(t.spin>0){\n      c.fillStyle='rgba(255,255,255,'+(t.spin/8*0.18)+')';\n      c.fillRect(x,y,CS,CS);\n      t.spin--;\n    }\n    c.lineCap='round'; c.lineJoin='round';\n    c.strokeStyle = lit? '#31e1ff' : 'rgba(214,226,255,.5)';\n    c.lineWidth = lit? w : w*0.8;\n    if(lit){ c.shadowColor='#31e1ff'; c.shadowBlur=12; }\n    for(const s of t.sides){\n      c.beginPath(); c.moveTo(cx,cy);\n      c.lineTo(cx+DC[s]*CS/2, cy+DR[s]*CS/2);\n      c.stroke();\n    }\n    c.shadowBlur=0;\n    c.fillStyle = lit? '#8dff5a' : 'rgba(214,226,255,.55)';\n    c.beginPath(); c.arc(cx,cy,w*0.42,0,7); c.fill();\n  }\n\n  cv.addEventListener('pointerdown',e=>{\n    e.preventDefault();\n    if(state==='over'){ reset(true); return; }\n    if(state!=='running') return;\n    const r0=cv.getBoundingClientRect();\n    const x=(e.clientX-r0.left)*(W/r0.width), y=(e.clientY-r0.top)*(H/r0.height);\n    const c=Math.floor(x/CS), r=Math.floor(y/CS);\n    if(r>=0&&c>=0&&r<N&&c<N) rotate(r,c,e.button===2||e.ctrlKey);\n  });\n  cv.addEventListener('contextmenu',e=>e.preventDefault());\n  reset(true);\n" },
  "racer": { css: "\n  :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.6);--line:rgba(255,255,255,.16);--sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n  .wrap{width:100%;max-width:360px;text-align:center}\n  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}\n  h1{margin:0;font-size:18px;font-weight:800;white-space:nowrap}\n  .hud{display:flex;gap:12px;font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap}\n  canvas{display:block;width:100%;border-radius:16px;background:#151026;border:1px solid var(--line);touch-action:none}\n  .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.4}\n", body: "<main class=\"wrap\">\n  <header><h1>Turbo Lane</h1><div class=\"hud\"><span id=\"spd\">0</span><span style=\"opacity:.6\">best <span id=\"best\">0</span></span></div></header>\n  <canvas id=\"c\" width=\"330\" height=\"470\"></canvas>\n  <p class=\"hint\">\u2190 \u2192 or A D to change lane \u00b7 hold \u2191 to boost \u00b7 dodge the traffic</p>\n</main>", js: "\n  'use strict';\n  const $=id=>document.getElementById(id);\n  const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n    return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n    catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n  const cv=$('c'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;\n  const LANES=4, ROAD=W*0.86, RX=(W-ROAD)/2, LW=ROAD/LANES;\n  const CARW=LW*0.62, CARH=62;\n  const PY=H-96;\n  let lane, x, traffic, dist, speed, best, state, raf, keys, stripe, boost, hue, shake;\n  best=store.get('turbo.best')||0; $('best').textContent=best;\n\n  const laneX=i=>RX+LW*i+LW/2;\n\n  function reset(){\n    lane=1; x=laneX(1); traffic=[]; dist=0; speed=6; stripe=0; boost=0; hue=0; shake=0;\n    keys={}; state='ready';\n    $('spd').textContent='0';\n    draw(); overlay('\u2190 \u2192 to steer','Press a key or tap to start');\n  }\n  function start(){ if(state==='running')return; if(state==='over')reset(); state='running'; last=performance.now(); raf=requestAnimationFrame(loop); }\n\n  let last=0, spawnT=0;\n  function loop(now){\n    if(state!=='running')return;\n    const dt=Math.min(2.4,(now-last)/16.67); last=now;\n    update(dt); draw(); raf=requestAnimationFrame(loop);\n  }\n\n  function update(dt){\n    boost = keys.up? Math.min(1,boost+0.04*dt) : Math.max(0,boost-0.05*dt);\n    const target = 6 + Math.min(9, dist/2600) + boost*5;\n    speed += (target-speed)*0.05*dt;\n    dist += speed*dt;\n    stripe=(stripe+speed*dt)%56;\n    hue=(hue+speed*0.12*dt)%360;\n    if(shake>0) shake-=dt;\n    $('spd').textContent=Math.floor(dist/10);\n\n    // ease into the target lane\n    const tx=laneX(lane);\n    x += (tx-x)*0.24*dt;\n\n    // spawn traffic with a guaranteed open lane\n    spawnT-=dt*speed*0.1;\n    if(spawnT<=0){\n      const blocked=new Set();\n      const n=1+Math.floor(Math.random()*Math.min(3,1+dist/4000));\n      while(blocked.size<n) blocked.add(Math.random()*LANES|0);\n      // never fill every lane\n      if(blocked.size>=LANES) blocked.delete([...blocked][0]);\n      for(const l of blocked){\n        traffic.push({lane:l, y:-CARH-Math.random()*60, hue:(Math.random()*360)|0,\n          vy: 1.4+Math.random()*1.6});\n      }\n      spawnT = 26 + Math.random()*16;\n    }\n\n    for(const t of traffic) t.y += (speed - t.vy)*dt;\n    traffic=traffic.filter(t=>t.y<H+CARH);\n\n    // collision\n    for(const t of traffic){\n      const tx2=laneX(t.lane);\n      if(Math.abs(tx2-x) < CARW*0.86 && Math.abs(t.y-PY) < CARH*0.86) return crash();\n    }\n  }\n\n  function crash(){\n    state='over'; cancelAnimationFrame(raf);\n    const sc=Math.floor(dist/10);\n    if(sc>best){ best=sc; store.set('turbo.best',best); $('best').textContent=best; }\n    shake=14; draw();\n    overlay('CRASH \u2014 '+sc, 'tap or press a key to race again');\n  }\n\n  function car(c,cx,cy,h,isPlayer){\n    c.save(); c.translate(cx,cy);\n    const w=CARW, hh=CARH;\n    // body\n    const g=c.createLinearGradient(-w/2,-hh/2,w/2,hh/2);\n    g.addColorStop(0,'hsl('+h+' 92% 68%)');\n    g.addColorStop(1,'hsl('+((h+28)%360)+' 88% 48%)');\n    c.fillStyle=g;\n    rr(c,-w/2,-hh/2,w,hh,9); c.fill();\n    // windows\n    c.fillStyle='rgba(12,8,24,.72)';\n    rr(c,-w/2+5,-hh/2+9,w-10,15,4); c.fill();\n    rr(c,-w/2+5,hh/2-24,w-10,14,4); c.fill();\n    // stripes\n    c.fillStyle='rgba(255,255,255,.34)';\n    c.fillRect(-3,-hh/2+6,6,hh-12);\n    if(isPlayer){\n      c.fillStyle='rgba(255,220,120,.9)';\n      c.fillRect(-w/2+3,-hh/2-3,7,5); c.fillRect(w/2-10,-hh/2-3,7,5);\n    }\n    c.restore();\n  }\n  function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}\n\n  function draw(){\n    const c=ctx;\n    c.save();\n    if(shake>0) c.translate((Math.random()-0.5)*7,(Math.random()-0.5)*7);\n    c.clearRect(-10,-10,W+20,H+20);\n    c.fillStyle='#151026'; c.fillRect(0,0,W,H);\n    // grass shoulders\n    c.fillStyle='hsl('+hue+' 40% 16%)';\n    c.fillRect(0,0,RX,H); c.fillRect(RX+ROAD,0,RX+2,H);\n    // road\n    c.fillStyle='#1e1733'; c.fillRect(RX,0,ROAD,H);\n    // edge lines\n    c.fillStyle='hsl('+hue+' 90% 62%)';\n    c.fillRect(RX-3,0,3,H); c.fillRect(RX+ROAD,0,3,H);\n    // lane dashes\n    c.fillStyle='rgba(255,255,255,.3)';\n    for(let i=1;i<LANES;i++){\n      const lx=RX+LW*i-2;\n      for(let y=-56+stripe;y<H;y+=56) c.fillRect(lx,y,4,30);\n    }\n    // speed streaks when boosting\n    if(boost>0.05){\n      c.fillStyle='rgba(255,255,255,'+(0.06+boost*0.16)+')';\n      for(let i=0;i<10;i++){\n        const sx=RX+Math.random()*ROAD, sy=(stripe*4+i*70)%H;\n        c.fillRect(sx,sy,2,26+boost*40);\n      }\n    }\n    for(const t of traffic) car(c,laneX(t.lane),t.y,t.hue,false);\n    car(c,x,PY,196,true);\n    c.restore();\n  }\n  function overlay(a,b){\n    const c=ctx;\n    c.fillStyle='rgba(10,6,20,.72)'; c.fillRect(0,0,W,H);\n    c.textAlign='center';\n    c.fillStyle='#fff'; c.font='800 22px Outfit,system-ui,sans-serif';\n    c.fillText(a,W/2,H/2-6);\n    c.fillStyle='rgba(255,255,255,.72)'; c.font='600 13px Outfit,system-ui,sans-serif';\n    c.fillText(b,W/2,H/2+18);\n  }\n\n  function steer(d){\n    if(state!=='running'){ start(); return; }\n    lane=Math.max(0,Math.min(LANES-1,lane+d));\n  }\n  window.addEventListener('keydown',e=>{\n    const k=e.key.toLowerCase();\n    if(k==='arrowleft'||k==='a'){e.preventDefault();steer(-1);}\n    else if(k==='arrowright'||k==='d'){e.preventDefault();steer(1);}\n    else if(k==='arrowup'||k==='w'){e.preventDefault();keys.up=true;start();}\n    else if(e.key===' '){e.preventDefault();start();}\n  });\n  window.addEventListener('keyup',e=>{\n    const k=e.key.toLowerCase();\n    if(k==='arrowup'||k==='w')keys.up=false;\n  });\n  cv.addEventListener('pointerdown',e=>{\n    e.preventDefault();\n    if(state!=='running'){ start(); return; }\n    const r=cv.getBoundingClientRect();\n    steer((e.clientX-r.left)/r.width < 0.5 ? -1 : 1);\n  });\n  reset();\n" },
  "drift": { css: "\n  :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.6);--line:rgba(255,255,255,.16);--sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n  .wrap{width:100%;max-width:400px;text-align:center}\n  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}\n  h1{margin:0;font-size:18px;font-weight:800;white-space:nowrap}\n  .hud{display:flex;gap:12px;font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap}\n  canvas{display:block;width:100%;border-radius:16px;background:#121024;border:1px solid var(--line);touch-action:none}\n  .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.4}\n", body: "<main class=\"wrap\">\n  <header><h1>Drift Track</h1><div class=\"hud\"><span>LAP <span id=\"lap\">0</span></span><span id=\"time\">0.0s</span><span style=\"opacity:.6\">best <span id=\"best\">\u2014</span></span></div></header>\n  <canvas id=\"c\" width=\"380\" height=\"380\"></canvas>\n  <p class=\"hint\">\u2190 \u2192 to steer \u00b7 \u2191 to accelerate \u00b7 \u2193 to brake \u00b7 stay on the track</p>\n</main>", js: "\n  'use strict';\n  const $=id=>document.getElementById(id);\n  const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n    return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n    catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n  const cv=$('c'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;\n  const CX=W/2, CY=H/2;\n  const RO=Math.min(W,H)*0.42, RI=Math.min(W,H)*0.22;   // outer / inner track radius\n  const MID=(RO+RI)/2;\n  let car, keys, lap, lapStart, bestLap, state, raf, trail, checkpoint;\n  bestLap=store.get('drift.best')||null;\n  $('best').textContent = bestLap? bestLap.toFixed(1)+'s' : '\u2014';\n\n  function reset(){\n    car={x:CX, y:CY-MID, a:0, v:0};       // start at the top, facing right\n    keys={}; lap=0; lapStart=0; trail=[]; checkpoint=false;\n    state='ready';\n    $('lap').textContent='0'; $('time').textContent='0.0s';\n    draw(); overlay('Drift Track','\u2191 to go \u00b7 \u2190 \u2192 to steer');\n  }\n  function start(){ if(state==='running')return; if(state==='over')reset(); state='running'; lapStart=performance.now(); last=performance.now(); raf=requestAnimationFrame(loop); }\n\n  let last=0;\n  function loop(now){\n    if(state!=='running')return;\n    const dt=Math.min(2.4,(now-last)/16.67); last=now;\n    update(dt); draw(); raf=requestAnimationFrame(loop);\n  }\n\n  function update(dt){\n    // driving\n    if(keys.up) car.v=Math.min(5.4, car.v+0.12*dt);\n    else if(keys.down) car.v=Math.max(0, car.v-0.2*dt);\n    else car.v=Math.max(0, car.v-0.035*dt);\n    const turn=0.055*Math.min(1,car.v/2.2);\n    if(keys.left) car.a-=turn*dt;\n    if(keys.right) car.a+=turn*dt;\n    car.x+=Math.cos(car.a)*car.v*dt;\n    car.y+=Math.sin(car.a)*car.v*dt;\n\n    // tyre trail\n    if(car.v>2.4 && (keys.left||keys.right)){\n      trail.push({x:car.x,y:car.y,life:40});\n    }\n    for(const t of trail) t.life-=dt;\n    trail=trail.filter(t=>t.life>0);\n\n    // off track? slow the car down hard (soft penalty, never a hard fail)\n    const d=Math.hypot(car.x-CX, car.y-CY);\n    if(d>RO-8 || d<RI+8){\n      car.v*=0.9;\n      // nudge back toward the racing line so you can recover\n      const ang=Math.atan2(car.y-CY, car.x-CX);\n      const target=Math.max(RI+10, Math.min(RO-10, d));\n      car.x=CX+Math.cos(ang)*target;\n      car.y=CY+Math.sin(ang)*target;\n    }\n\n    // lap timing: cross the top (start line) going clockwise\n    const ang=Math.atan2(car.y-CY, car.x-CX);\n    if(ang>0.2 && ang<Math.PI-0.2) checkpoint=true;      // reached the far side\n    if(checkpoint && ang<-1.3 && ang>-1.85){\n      checkpoint=false;\n      const t=(performance.now()-lapStart)/1000;\n      lap++; $('lap').textContent=lap;\n      if(bestLap===null||t<bestLap){ bestLap=t; store.set('drift.best',+t.toFixed(1)); $('best').textContent=t.toFixed(1)+'s'; }\n      lapStart=performance.now();\n    }\n    $('time').textContent=((performance.now()-lapStart)/1000).toFixed(1)+'s';\n  }\n\n  function draw(){\n    const c=ctx; c.clearRect(0,0,W,H);\n    c.fillStyle='#121024'; c.fillRect(0,0,W,H);\n    // grass\n    c.fillStyle='#16233a'; c.beginPath(); c.arc(CX,CY,RO+16,0,7); c.fill();\n    // asphalt ring\n    c.strokeStyle='#2a2244'; c.lineWidth=RO-RI; c.beginPath(); c.arc(CX,CY,MID,0,7); c.stroke();\n    // kerbs\n    for(const [r,seg] of [[RO-2,26],[RI+2,20]]){\n      for(let i=0;i<seg;i++){\n        c.strokeStyle = i%2? '#ff4d6d':'#f4f4f4';\n        c.lineWidth=5;\n        c.beginPath(); c.arc(CX,CY,r,(i/seg)*7,((i+1)/seg)*7); c.stroke();\n      }\n    }\n    // start line\n    c.strokeStyle='rgba(255,255,255,.85)'; c.lineWidth=4;\n    c.beginPath(); c.moveTo(CX,CY-RO+4); c.lineTo(CX,CY-RI-4); c.stroke();\n    // tyre marks\n    for(const t of trail){\n      c.fillStyle='rgba(20,14,34,'+(t.life/40*0.5)+')';\n      c.beginPath(); c.arc(t.x,t.y,3.4,0,7); c.fill();\n    }\n    // car\n    c.save(); c.translate(car.x,car.y); c.rotate(car.a);\n    const g=c.createLinearGradient(-11,-7,11,7);\n    g.addColorStop(0,'#31e1ff'); g.addColorStop(1,'#4d7bff');\n    c.fillStyle=g; rr(c,-11,-7,22,14,4); c.fill();\n    c.fillStyle='rgba(10,6,20,.75)'; rr(c,-3,-5,8,10,2); c.fill();\n    c.fillStyle='rgba(255,220,120,.95)'; c.fillRect(9,-6,3,4); c.fillRect(9,2,3,4);\n    c.restore();\n  }\n  function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}\n  function overlay(a,b){\n    const c=ctx; c.fillStyle='rgba(10,6,20,.7)'; c.fillRect(0,0,W,H);\n    c.textAlign='center'; c.fillStyle='#fff'; c.font='800 22px Outfit,system-ui,sans-serif';\n    c.fillText(a,CX,CY-6);\n    c.fillStyle='rgba(255,255,255,.75)'; c.font='600 13px Outfit,system-ui,sans-serif';\n    c.fillText(b,CX,CY+18);\n  }\n\n  window.addEventListener('keydown',e=>{\n    const k=e.key.toLowerCase();\n    if(k==='arrowleft'||k==='a'){e.preventDefault();keys.left=true;}\n    else if(k==='arrowright'||k==='d'){e.preventDefault();keys.right=true;}\n    else if(k==='arrowup'||k==='w'){e.preventDefault();keys.up=true;start();}\n    else if(k==='arrowdown'||k==='s'){e.preventDefault();keys.down=true;}\n    else if(e.key===' '){e.preventDefault();start();}\n  });\n  window.addEventListener('keyup',e=>{\n    const k=e.key.toLowerCase();\n    if(k==='arrowleft'||k==='a')keys.left=false;\n    else if(k==='arrowright'||k==='d')keys.right=false;\n    else if(k==='arrowup'||k==='w')keys.up=false;\n    else if(k==='arrowdown'||k==='s')keys.down=false;\n  });\n  cv.addEventListener('pointerdown',e=>{\n    e.preventDefault(); start();\n    const r=cv.getBoundingClientRect();\n    const fx=(e.clientX-r.left)/r.width;\n    keys.up=true;\n    if(fx<0.4)keys.left=true; else if(fx>0.6)keys.right=true;\n  });\n  window.addEventListener('pointerup',()=>{keys.left=keys.right=false;});\n  reset();\n" },
  "parking": { css: "\n  :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.6);--line:rgba(255,255,255,.16);--sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n  .wrap{width:100%;max-width:380px;text-align:center}\n  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}\n  h1{margin:0;font-size:18px;font-weight:800;white-space:nowrap}\n  .hud{display:flex;gap:12px;font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap}\n  .fuelwrap{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-bottom:10px}\n  .fuelwrap span{display:block;height:100%;background:linear-gradient(90deg,#8dff5a,#ffc23d);width:100%}\n  canvas{display:block;width:100%;border-radius:16px;background:#141126;border:1px solid var(--line);touch-action:none}\n  .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.4}\n", body: "<main class=\"wrap\">\n  <header><h1>Cargo Dash</h1><div class=\"hud\"><span id=\"score\">0</span><span style=\"opacity:.6\">best <span id=\"best\">0</span></span></div></header>\n  <div class=\"fuelwrap\"><span id=\"fuel\"></span></div>\n  <canvas id=\"c\" width=\"360\" height=\"400\"></canvas>\n  <p class=\"hint\">Arrows / WASD to drive \u00b7 grab the glowing cargo \u00b7 fuel cans top you up</p>\n</main>", js: "\n  'use strict';\n  const $=id=>document.getElementById(id);\n  const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n    return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n    catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n  const cv=$('c'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;\n  const MAXFUEL=600;\n  let car, keys, cargo, fuelCans, cones, score, fuel, best, state, raf, pulse;\n  best=store.get('cargo.best')||0; $('best').textContent=best;\n\n  function rand(a,b){ return a+Math.random()*(b-a); }\n  function place(){\n    // keep pickups away from the car and the walls\n    let p, tries=0;\n    do{ p={x:rand(34,W-34), y:rand(34,H-34)}; tries++; }\n    while(tries<40 && Math.hypot(p.x-car.x,p.y-car.y)<90);\n    return p;\n  }\n\n  function reset(){\n    car={x:W/2, y:H/2, a:-Math.PI/2, v:0};\n    keys={}; score=0; fuel=MAXFUEL; pulse=0;\n    cones=[];\n    for(let i=0;i<5;i++) cones.push({x:rand(40,W-40),y:rand(40,H-40)});\n    cargo=place(); fuelCans=[];\n    state='ready';\n    $('score').textContent='0'; $('fuel').style.width='100%';\n    draw(); overlay('Cargo Dash','drive to the glowing crate');\n  }\n  function start(){ if(state==='running')return; if(state==='over')reset(); state='running'; last=performance.now(); raf=requestAnimationFrame(loop); }\n\n  let last=0;\n  function loop(now){\n    if(state!=='running')return;\n    const dt=Math.min(2.4,(now-last)/16.67); last=now;\n    update(dt); draw(); raf=requestAnimationFrame(loop);\n  }\n\n  function update(dt){\n    if(keys.up) car.v=Math.min(4.6, car.v+0.14*dt);\n    else if(keys.down) car.v=Math.max(-2.2, car.v-0.14*dt);\n    else car.v*=Math.pow(0.94,dt);\n    const turn=0.062*Math.min(1,Math.abs(car.v)/1.6)*(car.v<0?-1:1);\n    if(keys.left) car.a-=turn*dt;\n    if(keys.right) car.a+=turn*dt;\n    car.x+=Math.cos(car.a)*car.v*dt;\n    car.y+=Math.sin(car.a)*car.v*dt;\n    // walls bounce you back gently\n    if(car.x<18){car.x=18;car.v*=-0.4;} if(car.x>W-18){car.x=W-18;car.v*=-0.4;}\n    if(car.y<18){car.y=18;car.v*=-0.4;} if(car.y>H-18){car.y=H-18;car.v*=-0.4;}\n\n    fuel -= (0.55 + Math.abs(car.v)*0.22)*dt;\n    $('fuel').style.width=Math.max(0,100*fuel/MAXFUEL)+'%';\n    if(fuel<=0) return over();\n\n    pulse+=0.09*dt;\n\n    // cones slow you\n    for(const c of cones){\n      if(Math.hypot(car.x-c.x,car.y-c.y)<20){ car.v*=0.82; }\n    }\n    // cargo pickup\n    if(Math.hypot(car.x-cargo.x,car.y-cargo.y)<24){\n      score++; $('score').textContent=score;\n      if(score>best){ best=score; store.set('cargo.best',best); $('best').textContent=best; }\n      fuel=Math.min(MAXFUEL, fuel+130);\n      cargo=place();\n      // occasionally drop a fuel can and add a cone to raise difficulty\n      if(score%3===0) fuelCans.push(place());\n      if(score%2===0 && cones.length<14) cones.push({x:rand(30,W-30),y:rand(30,H-30)});\n    }\n    for(let i=fuelCans.length-1;i>=0;i--){\n      if(Math.hypot(car.x-fuelCans[i].x,car.y-fuelCans[i].y)<22){\n        fuel=Math.min(MAXFUEL,fuel+200); fuelCans.splice(i,1);\n      }\n    }\n  }\n\n  function over(){\n    state='over'; cancelAnimationFrame(raf);\n    draw(); overlay('Out of fuel \u2014 '+score, 'tap or press a key to retry');\n  }\n\n  function draw(){\n    const c=ctx; c.clearRect(0,0,W,H);\n    c.fillStyle='#141126'; c.fillRect(0,0,W,H);\n    // lot markings\n    c.strokeStyle='rgba(255,255,255,.05)'; c.lineWidth=2;\n    for(let x=40;x<W;x+=48){ c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }\n    // cones\n    for(const o of cones){\n      c.fillStyle='#ff7a4d';\n      c.beginPath(); c.moveTo(o.x,o.y-11); c.lineTo(o.x+9,o.y+9); c.lineTo(o.x-9,o.y+9); c.closePath(); c.fill();\n      c.fillStyle='rgba(255,255,255,.75)'; c.fillRect(o.x-6,o.y-1,12,3.4);\n    }\n    // fuel cans\n    for(const f of fuelCans){\n      c.fillStyle='#8dff5a'; rr(c,f.x-9,f.y-11,18,22,4); c.fill();\n      c.fillStyle='#12220a'; c.font='700 12px Outfit,system-ui,sans-serif'; c.textAlign='center';\n      c.fillText('F',f.x,f.y+5);\n    }\n    // cargo (pulsing)\n    const s=1+Math.sin(pulse)*0.1;\n    c.save(); c.translate(cargo.x,cargo.y); c.scale(s,s);\n    c.shadowColor='#ffc23d'; c.shadowBlur=20;\n    c.fillStyle='#ffc23d'; rr(c,-14,-14,28,28,6); c.fill(); c.shadowBlur=0;\n    c.strokeStyle='rgba(80,50,0,.55)'; c.lineWidth=2.4;\n    c.beginPath(); c.moveTo(-14,0); c.lineTo(14,0); c.moveTo(0,-14); c.lineTo(0,14); c.stroke();\n    c.restore();\n    // car\n    c.save(); c.translate(car.x,car.y); c.rotate(car.a);\n    const g=c.createLinearGradient(-13,-8,13,8);\n    g.addColorStop(0,'#ff4d9d'); g.addColorStop(1,'#c63dff');\n    c.fillStyle=g; rr(c,-13,-8,26,16,5); c.fill();\n    c.fillStyle='rgba(10,6,20,.72)'; rr(c,-4,-6,9,12,2); c.fill();\n    c.fillStyle='rgba(255,220,120,.95)'; c.fillRect(11,-7,3,5); c.fillRect(11,2,3,5);\n    c.restore();\n  }\n  function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}\n  function overlay(a,b){\n    const c=ctx; c.fillStyle='rgba(10,6,20,.72)'; c.fillRect(0,0,W,H);\n    c.textAlign='center'; c.fillStyle='#fff'; c.font='800 21px Outfit,system-ui,sans-serif';\n    c.fillText(a,W/2,H/2-6);\n    c.fillStyle='rgba(255,255,255,.75)'; c.font='600 13px Outfit,system-ui,sans-serif';\n    c.fillText(b,W/2,H/2+18);\n  }\n\n  window.addEventListener('keydown',e=>{\n    const k=e.key.toLowerCase();\n    if(k==='arrowleft'||k==='a'){e.preventDefault();keys.left=true;start();}\n    else if(k==='arrowright'||k==='d'){e.preventDefault();keys.right=true;start();}\n    else if(k==='arrowup'||k==='w'){e.preventDefault();keys.up=true;start();}\n    else if(k==='arrowdown'||k==='s'){e.preventDefault();keys.down=true;start();}\n    else if(e.key===' '){e.preventDefault();start();}\n  });\n  window.addEventListener('keyup',e=>{\n    const k=e.key.toLowerCase();\n    if(k==='arrowleft'||k==='a')keys.left=false;\n    else if(k==='arrowright'||k==='d')keys.right=false;\n    else if(k==='arrowup'||k==='w')keys.up=false;\n    else if(k==='arrowdown'||k==='s')keys.down=false;\n  });\n  cv.addEventListener('pointerdown',e=>{\n    e.preventDefault(); start();\n    const r=cv.getBoundingClientRect();\n    const fx=(e.clientX-r.left)/r.width;\n    keys.up=true;\n    if(fx<0.4)keys.left=true; else if(fx>0.6)keys.right=true;\n  });\n  window.addEventListener('pointerup',()=>{keys.left=keys.right=keys.up=false;});\n  reset();\n" },
  "pacchase": { css: "\n  :root{--ink:#f6f3ff;--muted:rgba(246,243,255,.6);--line:rgba(255,255,255,.16);--sans:\"Outfit\",-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace}\n  *{box-sizing:border-box}\n  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:var(--sans);padding:14px;-webkit-tap-highlight-color:transparent}\n  .wrap{width:100%;max-width:400px;text-align:center}\n  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap}\n  h1{margin:0;font-size:18px;font-weight:800;white-space:nowrap}\n  .hud{display:flex;gap:12px;font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap}\n  canvas{display:block;width:100%;border-radius:16px;background:#0b0818;border:1px solid var(--line);touch-action:none}\n  .hint{font-size:11px;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.45;padding:0 6px}\n", body: "<main class=\"wrap\">\n  <header><h1>Ghost Run</h1><div class=\"hud\"><span id=\"score\">0</span><span>LV <span id=\"lvl\">1</span></span><span id=\"lives\">\u25cf\u25cf\u25cf</span></div></header>\n  <canvas id=\"c\" width=\"336\" height=\"372\"></canvas>\n  <p class=\"hint\">Arrows / WASD to move \u00b7 eat every pellet \u00b7 big pellets let you chase the ghosts</p>\n</main>", js: "\n  'use strict';\n  const $=id=>document.getElementById(id);\n  const store=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');\n    return{get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}\n    catch(e){const m={};return{get:k=>k in m?m[k]:null,set:(k,v)=>{m[k]=v}}}})();\n  const cv=$('c'), ctx=cv.getContext('2d');\n  // # wall  . pellet  o power  space empty  - ghost house\n  const MAP=[\n    \"############\",\n    \"#o...#.....#\",\n    \"#.##.#.###.#\",\n    \"#.#......#.#
